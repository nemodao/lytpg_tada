<h1>HSB × TADA Redemption – Integration &amp; Spec</h1>
<p class="sub">Integration document for redeeming Coin for gifts through the TADA webview, with the backend spec. Updated: 2026-10-17.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. Overview</button><button type="button" role="tab" data-tab="flow" aria-selected="false">2. Flow</button><button type="button" role="tab" data-tab="api" aria-selected="false">3. API</button><button type="button" role="tab" data-tab="data" aria-selected="false">4. Data &amp; Configuration</button><button type="button" role="tab" data-tab="open" aria-selected="false">5. Open items</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. Overview</h2>
<p>This document describes the integration flow between HSB and TADA that lets customers redeem Coin for gifts through TADA's webview, and serves as the spec for HSB's backend to build the APIs. HSB owns the Coin; TADA provides the gift catalog and the redemption interface. It reflects the answers TADA has confirmed as of 2026-10-17.</p>

<h3>Two call directions and two tokens</h3>
<p>The flow has two opposite call directions, each using its own token; do not mix the tokens between them.</p>
<table>
  <tr><th style="width:24%">Direction</th><th>Description</th><th style="width:26%">Token</th></tr>
  <tr><td>Direction A — HSB calls TADA</td><td>When the customer taps redeem, HSB obtains a token and calls SSO to get the webview URL.</td><td>Issued by TADA to HSB</td></tr>
  <tr><td>Direction B — TADA calls HSB</td><td>While the customer works in the webview, TADA calls HSB's APIs to fetch the balance, deduct Coin and refund Coin.</td><td>Issued by HSB to TADA, via <code>/auth</code> or a static token</td></tr>
</table>
<p>The customer's app login token is never passed to TADA. The customer's legitimacy is already guaranteed by HSB at the SSO step: only after the customer is validly logged in to the app does HSB's backend call SSO. The Direction-B token only proves that the caller is TADA.</p>

<h3>API list</h3>
<p>The whole integration has 8 APIs. Field details for each API are in the <a href="#api" class="ref">API</a> tab; click an API name to jump there. There are also internal app ↔ backend APIs (open webview, get order list) in the Internal group on this same tab.</p>
<table>
  <tr><th style="width:30%">API</th><th>Role</th><th style="width:16%">Mandatory</th></tr>
  <tr><td><a href="#ep-token" class="ref">POST /v2/catalog/token</a></td><td>A · HSB → TADA</td><td>Mandatory</td></tr><tr><td><a href="#ep-sso" class="ref">POST /v2/catalog/sso</a></td><td>A · HSB → TADA</td><td>Mandatory</td></tr><tr><td><a href="#ep-auth" class="ref">POST /auth</a></td><td>B · TADA → HSB</td><td>Optional</td></tr><tr><td><a href="#ep-getpoint" class="ref">POST /get-point</a></td><td>B · TADA → HSB</td><td>Mandatory</td></tr><tr><td><a href="#ep-redeem" class="ref">POST /redeem-point</a></td><td>B · TADA → HSB</td><td>Mandatory</td></tr><tr><td><a href="#ep-topup" class="ref">POST /topup-point</a></td><td>B · TADA → HSB</td><td>Mandatory</td></tr><tr><td><a href="#ep-order" class="ref">GET /v2/catalog/orders/{orderNumberorderReference}</a></td><td>A · HSB → TADA</td><td>Optional · tracking</td></tr><tr><td><a href="#ep-webhook" class="ref">POST {HSB base URL}/webhook</a></td><td>B · TADA → HSB</td><td>Optional · tracking</td></tr>
</table>

<h3>Identifiers, units and rate</h3>
<ul>
  <li>The customer is identified by <code>userId</code> = <b>HSB's internal client_id</b> (e.g. <code>95000056</code>).</li>
  <li><code>cardNumber</code> is a fixed credential issued by TADA, the same on every request; it is not a per-customer card number.</li>
  <li>The Coin amount to deduct or refund is in <code>convertedAmount</code>; <code>amount</code> is the IDR monetary value, for reference only.</li>
  <li><b>Redeem rate</b> is configured by HSB on the TADA side; TADA computes <code>convertedAmount</code> itself. <b>Confirmed: 1 Coin = 100 IDR</b> (e.g. a 500,000 IDR gift → 5,000 Coin). HSB only deducts <code>convertedAmount</code> and does not convert itself.</li>
  <li>The reconciliation and idempotency key is <code>orderReference</code>, consistent between the deduction and the refund of the same transaction.</li>
  <li>Every call from TADA to HSB has a 3-second timeout; HSB's endpoints must respond within 3 seconds.</li>
  <li><b>Redemption block:</b> a client on the blocklist (table <code>client_promotion_blacklist</code>) cannot open the webview and is rejected at <code>/redeem-point</code>.</li>
</ul>

<h3>Implementation process with Tada (7 steps)</h3>
<table>
  <tr><th style="width:8%">Step</th><th>Activity</th><th style="width:20%">PIC</th></tr>
  <tr><td class="c">1</td><td>Meeting to gather integration requirements</td><td>Client &amp; Tada</td></tr><tr><td class="c">2</td><td>Tada provides API documentation + staging credentials</td><td>Tada</td></tr><tr><td class="c">3</td><td>Client builds the APIs per the documentation and integrates with Tada</td><td>Client</td></tr><tr><td class="c">4</td><td>Fill in the Test Case Catalog Webview Integration (provided by Tada)</td><td>Client</td></tr><tr><td class="c">5</td><td>UAT meeting: client runs the journey + test cases, Tada checks the logs</td><td>Client &amp; Tada</td></tr><tr><td class="c">6</td><td>Deposit payment — mandatory before Go Live</td><td>Client</td></tr><tr><td class="c">7</td><td>Go Live: Tada provides production credentials</td><td>Tada</td></tr>
</table>
</section><section class="panel" id="flow" role="tabpanel">
<h2>2. Redemption flow</h2>
<p>The diagram below shows a full redemption, from the moment the customer taps the button through deducting Coin, delivering the gift and refunding Coin on failure. Each box is a stage; the yellow strip at the bottom of a box is a note or an open item for that stage.</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">Stage 0 — Get the token</div><div class="fd">HSB calls TADA to get a Bearer token before calling SSO. Direction A.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-token">Spec · /v2/catalog/token ▸</button></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>HSB calls <code>POST /v2/catalog/token</code> (TADA calls it the API Authentication) with client credentials (Basic auth) and an API user (password grant).</td></tr><tr><td class="c">2</td><td>TADA returns a Bearer token with its expiry.</td></tr></table></div><div class="fnote">The token lasts about 1 day; cache it and check `expiredAt`; re-request when it expires or on a 401. UAT and Production use separate credentials.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 1 — Open the webview (SSO)</div><div class="fd">HSB calls TADA to get the URL that opens the redemption webview. Direction A.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="int-webview">Spec · /loyalty/redeem/session ▸</button><button type="button" class="specbtn mini" data-spec="ep-sso">Spec · /v2/catalog/sso ▸</button></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>The customer taps the redeem button in the app.</td></tr><tr><td class="c">2</td><td>The app calls <b>HSB backend's internal API</b> (with the customer's app token); the app does not call TADA directly.</td></tr><tr><td class="c">3</td><td>The backend calls <code>POST /v2/catalog/sso</code> with <code>userId</code>, <code>cardNumber</code>, <code>amount</code>.</td></tr><tr><td class="c">4</td><td>TADA returns <code>url</code>, <code>token</code> and a <code>expiryTime</code> of 300 seconds.</td></tr><tr><td class="c">5</td><td>The backend returns <code>url</code> to the app; the app opens the webview.</td></tr></table></div><div class="fnote"><code>cardNumber</code> is a fixed TADA credential, not a per-customer card number. 300 seconds is the window to open the URL; after authentication the webview session lives 24 hours and the customer is not logged out midway. HSB blocks blacklisted clients right at this step (does not open the webview); the real enforcement still sits at /redeem-point.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 2 — Display the balance</div><div class="fd">TADA calls HSB to fetch the Coin balance shown in the webview. Direction B. Mandatory.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-auth">Spec · /auth ▸</button><button type="button" class="specbtn mini" data-spec="ep-getpoint">Spec · /get-point ▸</button></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>TADA calls <code>/auth</code> (if HSB enables it) to get a token; or uses a static token.</td></tr><tr><td class="c">2</td><td>TADA calls <code>POST /get-point</code> with <code>userId</code>, <code>cardNumber</code>; HSB returns the balance.</td></tr></table></div><div class="fnote"><code>/get-point</code> is mandatory. Both the displayed balance and the balance used to validate a redemption come from the value returned here.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 3 — Deduct Coin</div><div class="fd">TADA calls HSB to deduct Coin when the customer redeems. Direction B. Mandatory. 3-second timeout.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-redeem">Spec · /redeem-point ▸</button></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>The customer selects a gift and taps redeem.</td></tr><tr><td class="c">2</td><td>TADA calls <code>POST /redeem-point</code> with <code>trxId</code>, <code>convertedAmount</code>, <code>orderReference</code>…</td></tr><tr><td class="c">3</td><td>HSB checks (dedupe by <code>orderReference</code>, <b>block blacklisted clients</b>, enough Coin) then deducts exactly <code>convertedAmount</code> (FIFO by lot), returns <code>status</code>.</td></tr><tr><td class="c">4</td><td>TADA creates the order.</td></tr></table></div><div class="fnote">Must respond within 3 seconds and dedupe by <code>orderReference</code>. On rejection: return HTTP 200 with <code>status</code> failed for business reasons (insufficient Coin, client blacklisted, client not found), 4xx for client errors, 5xx for system errors.<br><br><b>Redeem taking over 3 seconds:</b> TADA does NOT retry redeem and does NOT send a void on its own. If HSB already deducted Coin but responded too late, the order is not created → the customer is charged Coin with no gift. <b>HSB builds its own reconciliation job #16</b>: call <code>Get Order Detail</code> by <code>orderReference</code>; if past the deadline TADA returns a real 404 (order does not exist), <b>alert ops to verify then refund the Coin manually</b> — NOT an automatic refund (a 404 may be wrong if TADA’s API failed). TADA has confirmed the Get Order Detail API exists (#19). See the /redeem-point and Get Order Detail specs in the API tab.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 4a — Order succeeds</div><div class="fd">TADA delivers the gift to the customer. No call back to HSB.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-webhook">Spec · Order Webhook ▸</button><button type="button" class="specbtn mini" data-spec="ep-order">Spec · Get Order Detail ▸</button></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>TADA delivers the gift by type: e-Voucher, physical item, PLN, e-Wallet, Pulsa/Data.</td></tr></table></div><div class="fnote">For an e-Voucher sent by email: <b>the customer fills in the email at TADA's checkout step</b>; HSB does not pass the email and does not call Create Order. <b>Order tracking (#22 answered):</b> HSB can display order status and details <b>natively inside the app</b> via the webhook and Get Order Detail, without sending the customer back to the TADA webview (see the Order Webhook Spec in the API tab).</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 4b — Order fails, refund Coin</div><div class="fd">TADA calls HSB to refund the deducted Coin. Direction B. Mandatory.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-topup">Spec · /topup-point ▸</button></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>TADA calls <code>POST /topup-point</code> to refund Coin.</td></tr><tr><td class="c">2</td><td>HSB reconciles by <code>orderReference</code> then refunds Coin; a duplicate refund is treated as already done.</td></tr><tr><td class="c">3</td><td>TADA retries exactly once on failure; if it still fails, it emails HSB for manual handling.</td></tr></table></div><div class="fnote">Dedupe by <code>orderReference</code>: return success for a duplicate refund, do not refund twice.</div></div></div>
<p class="note">After redeeming, the customer returns to accumulating Coin as usual. Each API's details and dev work are in the <a href="#api" class="ref">API</a> tab (click Spec details); shared tables and config are in the <a href="#data" class="ref">Data &amp; Configuration</a> tab.</p>
</section><section class="panel" id="api" role="tabpanel">

<p>The API list by call direction. Click <b>Spec details</b> on each API to see all the work for that one API: preparation, request, HSB processing, response, notes. Shared tables and config are in the <a href="#data" class="ref">Data &amp; Configuration</a> tab.</p>
<h3>A · HSB calls TADA</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">Mandatory</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="ep-token"><td><code>POST /v2/catalog/token</code></td><td>Mandatory</td><td>HSB gets a Bearer token to call SSO and Get Order Detail.</td><td><button type="button" class="specbtn" data-spec="ep-token">Spec details ▸</button></td></tr><tr id="ep-sso"><td><code>POST /v2/catalog/sso</code></td><td>Mandatory</td><td>HSB gets the URL to open the redemption webview.</td><td><button type="button" class="specbtn" data-spec="ep-sso">Spec details ▸</button></td></tr><tr id="ep-order"><td><code>GET /v2/catalog/orders/{orderNumberorderReference}</code></td><td>Optional · tracking</td><td>Get the details and status of one order (on demand).</td><td><button type="button" class="specbtn" data-spec="ep-order">Spec details ▸</button></td></tr></table></div><h3>B · TADA calls HSB</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">Mandatory</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="ep-auth"><td><code>POST /auth</code></td><td>Optional</td><td>Issue a service token to Tada (or use a static token).</td><td><button type="button" class="specbtn" data-spec="ep-auth">Spec details ▸</button></td></tr><tr id="ep-getpoint"><td><code>POST /get-point</code></td><td>Mandatory</td><td>Return the customer's current Coin balance.</td><td><button type="button" class="specbtn" data-spec="ep-getpoint">Spec details ▸</button></td></tr><tr id="ep-redeem"><td><code>POST /redeem-point</code></td><td>Mandatory</td><td>Deduct Coin when the customer redeems (the deduct step).</td><td><button type="button" class="specbtn" data-spec="ep-redeem">Spec details ▸</button></td></tr><tr id="ep-topup"><td><code>POST /topup-point</code></td><td>Mandatory</td><td>Refund Coin when an order fails / is voided.</td><td><button type="button" class="specbtn" data-spec="ep-topup">Spec details ▸</button></td></tr><tr id="ep-webhook"><td><code>POST {HSB base URL}/webhook</code></td><td>Optional · tracking</td><td>Receive order updates from Tada → sync into table point_redemption_order (backend syncs continuously).</td><td><button type="button" class="specbtn" data-spec="ep-webhook">Spec details ▸</button></td></tr></table></div><h3>Internal · App ↔ HSB backend</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">Mandatory</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="int-webview"><td><code>POST /loyalty/redeem/session</code></td><td>Mandatory</td><td>The app requests the URL to open the Tada webview.</td><td><button type="button" class="specbtn" data-spec="int-webview">Spec details ▸</button></td></tr><tr id="int-orders"><td><code>GET /loyalty/orders</code></td><td>Optional · tracking</td><td>The app gets the customer's order list (from synced data).</td><td><button type="button" class="specbtn" data-spec="int-orders">Spec details ▸</button></td></tr><tr id="int-order-detail" class="rvnew"><td><code>GET /loyalty/orders/{orderReference}</code></td><td>Optional · tracking</td><td>The app fetches one order's details for the tracking page.</td><td><button type="button" class="specbtn" data-spec="int-order-detail">Spec details ▸</button></td></tr><tr id="int-catalog" class="rvnew"><td><code>GET /loyalty/catalog</code></td><td>Optional</td><td>A logged-in user fetches the gift list for their own client_group.</td><td><button type="button" class="specbtn" data-spec="int-catalog">Spec details ▸</button></td></tr><tr id="int-catalog-guest" class="rvnew"><td><code>GET /loyalty/catalog-guest</code></td><td>Optional · guest</td><td>Featured gift list for guests (home, not logged in).</td><td><button type="button" class="specbtn" data-spec="int-catalog-guest">Spec details ▸</button></td></tr></table></div>
<div hidden><div class="specsrc" id="spec-ep-token" data-title="POST /v2/catalog/token"><p class="specmeta">A · HSB → TADA · Mandatory · <code>POST https://api.gift.id/v2/catalog/token</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/fc415a72b5444-authentication" target="_blank" rel="noopener" class="ref">Original doc ↗</a></p><p>HSB calls this to get the Bearer token used for the SSO step. TADA calls this endpoint the "API Authentication".</p><div class="specsec"><h4>1. Preparation</h4><p>Config: <code>TADA_TOKEN_URL</code>; Terminal ID/Password + API Key/Secret (provided by Tada after the BRD). A place to cache the token (by <code>expiredAt</code>). See the <a href="#data" class="ref">Data &amp; Configuration</a> tab.</p></div><div class="specsec"><h4>2. Request</h4><p>HSB calls Tada with Terminal ID/Password + API Key/Secret:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>Terminal ID</code></td><td>string</td><td>…</td><td>Provided by TADA after the BRD.</td></tr><tr><td><code>Terminal Password</code></td><td>string</td><td>…</td><td>Provided by TADA after the BRD.</td></tr><tr><td><code>API Key</code></td><td>string</td><td>…</td><td>Provided by TADA after the BRD.</td></tr><tr><td><code>API Secret</code></td><td>string</td><td>…</td><td>Provided by TADA after the BRD.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><p>Receive the token → cache until <code>expiredAt</code> (minus a ~5-minute buffer). Only re-request when it expires or on a <code>401</code>. On error, retry at most once then notify Tada.</p></div><div class="specsec"><h4>4. Response</h4><p>Tada returns:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>token</code></td><td>string</td><td>6jYJW0lS9C…</td><td>Bearer token for subsequent calls.</td></tr><tr><td><code>tokenType</code></td><td>string</td><td>Bearer</td><td>Token type.</td></tr><tr><td><code>expiredAt</code></td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>When the token expires. Use this timestamp to compute the cache expiry.</td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><p>UAT and Production use separate credentials. The detailed schema is on Stoplight (the Original doc link above).</p></div></div><div class="specsrc" id="spec-ep-sso" data-title="POST /v2/catalog/sso"><p class="specmeta">A · HSB → TADA · Mandatory · <code>POST https://api.gift.id/v2/catalog/sso</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/aaa038646e288-tada-catalog-integration-v2" target="_blank" rel="noopener" class="ref">Original doc ↗</a></p><p>HSB calls this to get the URL that opens the redemption webview, with the customer identifier and current Coin.</p><div class="specsec"><h4>1. Preparation</h4><p>A token is available (token endpoint). Config <code>TADA_CARD_NUMBER</code>. A flow to authenticate the customer's app token.</p></div><div class="specsec"><h4>2. Request</h4><p>HSB calls Tada, header <code>Authorization: Bearer</code>, body:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Customer identifier = HSB's internal client_id.</td></tr><tr><td><code>cardNumber</code></td><td>string</td><td>3671618079831369</td><td>Fixed credential issued by TADA, the same on every request; not a per-customer card number.</td></tr><tr><td><code>amount</code></td><td>number</td><td>500000</td><td>The customer's current Coin, for the initial display.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><p>Customer taps Redeem → app calls the internal API <code>/loyalty/redeem/session</code> → backend calls token + sso → returns <code>url</code> to the app. Open immediately (300-second window).</p></div><div class="specsec"><h4>4. Response</h4><p>Tada returns:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>url</code></td><td>string</td><td>https://…usetada.com/authorize?sso=…</td><td>URL that opens the webview.</td></tr><tr><td><code>token</code></td><td>string</td><td>EA50L62of5…</td><td>SSO token embedded in the URL.</td></tr><tr><td><code>expiryTime</code></td><td>number</td><td>300</td><td>Window to open the URL, in seconds.</td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><p>Call server-to-server; the app does not call Tada directly. After authentication, the webview session lasts 24 hours.</p></div></div><div class="specsrc" id="spec-ep-order" data-title="GET /v2/catalog/orders/{orderNumberorderReference}"><p class="specmeta">A · HSB → TADA · Optional · tracking · <code>GET https://api.gift.id/v2/catalog/orders/{orderNumberorderReference}</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/a077bf045ddaf-get-order-detail" target="_blank" rel="noopener" class="ref">Original doc ↗</a></p><p>HSB calls this to get the details and status of one order. Used to display orders natively in the app and for the #16 reconciliation (checking whether an order was created).</p><div class="specsec"><h4>1. Preparation</h4><p>A token is available. Know <code>orderReference</code> (already from redeem) or <code>orderNumber</code>.</p></div><div class="specsec"><h4>2. Request</h4><p>HSB calls Tada, path param = <code>orderReference</code> OR <code>orderNumber</code>, header Bearer:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>orderNumberorderReference</code></td><td>string</td><td>TRX90393933 · TADA181029…</td><td>Lookup key: orderReference OR orderNumber.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds">
  <li>HSB calls <code>GET …/orders/{order_reference}</code> + Bearer header → receives the order.</li>
  <li><b>Cache:</b> <b>UPSERT</b> <code>point_redemption_order</code> by <code>order_reference</code> — <code>INSERT … ON DUPLICATE KEY UPDATE</code> status, order_number, order_items, recipient, fees, <code>last_status_at=NOW()</code>, raw_payload. <code>client_id</code> taken from <code>point_redemption_transaction</code>. Return to the app.</li>
  <li class="rvnew"><b>Reconciliation #16:</b> a job scans redeems <code>status=1, reconciled=0</code> older than <code>RECON_DELAY_MIN</code> (=10 min) that still have NO order in <code>point_redemption_order</code> (webhook sync) → call <code>Get Order Detail</code>. Only a <b>real HTTP 404</b> is an <b>orphan</b> (5xx / timeout / exception → retry, keep <code>reconciled=0</code>). Orphan → <b>raise an alert for ops</b> + set <code>reconciled=1</code> (pending manual) so the next scan does NOT re-alert; <b>do NOT auto-refund Coin</b>. Order exists → set <code>reconciled=2</code>. <b>Ops handle rows <code>reconciled=1</code>:</b> verify with TADA — if truly orphan, refund MANUALLY (<code>point_ledger</code> type=3 + <code>point_lot</code> + <code>point_redemption_transaction.status=2</code>); if the order actually exists, do nothing — then set <code>reconciled=2</code>. (Why not auto: a 404 may be wrong if TADA created the order but the API failed → avoid the customer getting both the gift and the Coin back.)</li>
  <li>Order exists &amp; <code>failed</code>: not handled here — Tada calls /topup-point itself.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>Tada returns (enough for the native UI):</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>status</code></td><td>string</td><td>new · on process · completed · canceled · failed</td><td>Order status.</td></tr><tr><td><code>orderReference / orderNumber</code></td><td>string</td><td>WILSONTEST-901… · TO2307…</td><td>Reconciliation reference and order number.</td></tr><tr><td><code>recipient</code></td><td>object</td><td>name, email, address, postalCode…</td><td>Recipient and delivery address (physical items).</td></tr><tr><td><code>orderItems</code></td><td>array</td><td>itemType, itemName, price, status, quantity…</td><td>The list of gifts; each item's status includes on courier / completed… for delivery tracking.</td></tr><tr><td><code>payment</code></td><td>object</td><td>cardNumber, walletName, amount</td><td>Payment information.</td></tr><tr><td><code>fees</code></td><td>array</td><td>SHIPPING_FEE, INSURANCE…</td><td>The order's fees.</td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><p>Keyed by both orderReference and orderNumber, so it does not depend on the webhook to get orderNumber.</p></div></div><div class="specsrc" id="spec-ep-auth" data-title="POST /auth"><p class="specmeta">B · TADA → HSB · Optional · <code>POST {HSB base URL}/auth</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">Original doc ↗</a></p><p>TADA logs into the HSB system to get a token, used for the other three Direction-B APIs.</p><div class="specsec"><h4>1. Preparation</h4><p>Configure the Terminal ID/Password (provided by Tada). A place to issue/validate the token.</p></div><div class="specsec"><h4>2. Request</h4><p>Tada calls HSB, body:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>username</code></td><td>string</td><td>johncatalog7464</td><td>Terminal ID issued by TADA.</td></tr><tr><td><code>password</code></td><td>string</td><td>9455J05N==</td><td>Terminal Password issued by TADA.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><p>Validate Terminal ID/Password → issue a token (service-level). OR skip /auth and give Tada a static lifetime token to put in the header of the three APIs below.</p></div><div class="specsec"><h4>4. Response</h4><p>HSB returns:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>token</code></td><td>string</td><td>6jYJW0lS9C…</td><td>Token issued by HSB to TADA.</td></tr><tr><td><code>expiredAt</code></td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>When the token expires (use this timestamp).</td></tr><tr><td><code>expiresIn</code></td><td>number</td><td>86399</td><td>Remaining lifetime. The original doc says milliseconds but the value looks like seconds — not confirmed by Tada, so use expiredAt.</td></tr><tr><td><code>tokenType</code></td><td>string</td><td>Bearer</td><td>Token type.</td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><p>Only proves 'the caller is Tada', not per-user authentication. Optional — the IP allowlist is the main layer.</p></div></div><div class="specsrc" id="spec-ep-getpoint" data-title="POST /get-point"><p class="specmeta">B · TADA → HSB · Mandatory · <code>POST {HSB base URL}/get-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">Original doc ↗</a></p><p>TADA calls this to fetch the customer's Coin balance, used to display in the webview and to validate the balance when the customer redeems.</p><div class="specsec"><h4>1. Preparation</h4><p>Use the existing points table <code>point_lot</code> (balance per lot). Receive token via header (from /auth or static).</p></div><div class="specsec"><h4>2. Request</h4><p>Tada calls HSB, header Bearer, body:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Customer identifier = HSB client_id.</td></tr><tr><td><code>cardNumber</code></td><td>string</td><td>6233724664249662</td><td>Fixed credential issued by TADA.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds">
  <li>Validate auth (Bearer header) + IP allowlist.</li>
  <li><b>SELECT (read-only)</b> available balance: <code>SELECT SUM(point_balance) FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW()</code>. No modify, no add row.</li>
  <li>Return <code>{userId, amount}</code> — <code>amount</code> = total available balance.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB returns:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Customer identifier (echoed back).</td></tr><tr><td><code>amount</code></td><td>number</td><td>500000</td><td>The customer's current Coin balance.</td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><p>Mandatory. This is the balance source Tada uses to display and to validate at redemption.</p></div></div><div class="specsrc" id="spec-ep-redeem" data-title="POST /redeem-point"><p class="specmeta">B · TADA → HSB · Mandatory · <code>POST {HSB base URL}/redeem-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">Original doc ↗</a></p><p>TADA calls this to deduct the customer's Coin whenever they redeem. This is the deduction step.</p><div class="specsec"><h4>1. Preparation</h4><p>New table <code>point_redemption_transaction</code> (unique <code>order_reference</code>). Coin movements are logged in <code>point_ledger</code>, deducted from the existing <code>point_lot</code>. Block blacklisted clients via table <code>client_promotion_blacklist</code>. Config <code>REDEEM_SLA_MS=3000</code>, IP allowlist, token. See tab <a href="#data" class="ref">Data &amp; Config</a>.</p></div><div class="specsec"><h4>2. Request</h4><p>Tada calls HSB, header Bearer, body:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>TADA's transaction id (stored for tracing, not used as the key).</td></tr><tr><td><code>date</code></td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>Transaction timestamp.</td></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Customer identifier = HSB client_id.</td></tr><tr><td><code>amount</code></td><td>number</td><td>150000</td><td>IDR monetary value, reference only.</td></tr><tr><td><code>convertedAmount</code></td><td>number</td><td>150</td><td>The Coin amount HSB must deduct.</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>Reconciliation and idempotency key, consistent with the refund.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds">
  <li>Validate auth + IP + required fields.</li>
  <li><b>Anti-duplicate:</b> <code>SELECT * FROM point_redemption_transaction WHERE order_reference=?</code>. If a row already exists → return the old <code>raw_response</code>, do NOT deduct again. Stop.</li>
  <li class="rvnew"><b>Blacklist block:</b> <code>SELECT 1 FROM client_promotion_blacklist WHERE client_id=? AND promo_table='point_redemption_transaction' AND enabled=1 LIMIT 1</code>. If found → return <code>{status:"failed", trxId, message}</code> (HTTP 200, do NOT deduct Coin, <b>do NOT write to the table</b>). Stop.</li>
  <li>Open a <b>DB transaction</b>: <ul class="rules">
      <li><b>Fetch &amp; lock available lots (FIFO):</b> <code>SELECT id, point_balance, cash_value_per_point_unit FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW() ORDER BY point_expiration_time ASC FOR UPDATE</code> (lots expiring soonest are consumed first).</li>
      <li class="rvnew">If <code>SUM(point_balance) &lt; convertedAmount</code> (or the client does not exist) → ROLLBACK → return <code>{status:"failed", trxId, message}</code> (do NOT deduct Coin, <b>do NOT write to the table</b>).</li>
      <li>Enough → <b>INSERT</b> <code>point_redemption_transaction</code> (<code>status=1</code>, external_system='tada', …) → get <code>redemption_id = id</code>. Then <b>consume lot by lot</b> until convertedAmount is met, each lot <code>amt = min(lot.point_balance, remaining)</code>: <ul class="rules">
          <li><b>INSERT</b> <code>point_ledger</code> (client_id, <code>source_type='redeem'</code>, <code>type=2</code> CONSUME, <code>point_amount=−amt</code>, <code>lot_id</code>, <code>redemption_id</code>, <code>external_system='tada'</code>, <code>external_id=order_reference</code>, <code>point_balance_before/after</code>, cash_value_per_point_unit).</li>
          <li><b>UPDATE</b> <code>point_lot</code> SET <code>point_balance = point_balance − amt</code> WHERE <code>id=lot.id</code>.</li>
        </ul> </li>
      <li>COMMIT.</li>
    </ul> </li>
  <li>Return <code>{status:"success", trxId}</code>. <b>Done in &lt;3 seconds.</b></li>
  <li><b>Concurrency race:</b> UNIQUE <code>order_reference</code> on <code>point_redemption_transaction</code> blocks duplicate requests — the second one hits duplicate-key → return the existing row.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB returns (in Tada's format):</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>status</code></td><td>string</td><td>success</td><td>Result: must be exactly the string success or failed.</td></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>Transaction id (echoed back).</td></tr><tr><td><code>message</code></td><td>string</td><td>insufficient points</td><td>Optional, not in the original schema — per Tada's suggestion for logging; Tada does not parse it.</td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><p class="rvnew">Deduct <code>convertedAmount</code> (NOT amount). Tada treats non-2xx / <code>status:failed</code> / timeout as failure and does not parse the message. A rejected redeem is <b>not written to the table</b> (Tada does not retry redeem). If Coin was deducted but the response took &gt;3s: <b>reconciliation job #16</b> (runs every 15–30 min + a daily full sweep; <code>RECON_DELAY_MIN=10'</code>) relies on <code>point_redemption_order</code>; if there is no order it calls Get Order Detail — only a <b>real HTTP 404</b> counts as orphan (5xx/timeout → retry). On orphan → <b>alert ops to verify + refund MANUALLY</b>, do NOT auto-credit Coin.</p></div></div><div class="specsrc" id="spec-ep-topup" data-title="POST /topup-point"><p class="specmeta">B · TADA → HSB · Mandatory · <code>POST {HSB base URL}/topup-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">Original doc ↗</a></p><p>TADA calls this to refund the customer's Coin when a redemption fails after the order was created. This is the refund / void step.</p><div class="specsec"><h4>1. Preparation</h4><p>Tables <code>point_redemption_transaction</code> + <code>point_ledger</code> + <code>point_lot</code>. See tab <a href="#data" class="ref">Data &amp; Config</a>.</p></div><div class="specsec"><h4>2. Request</h4><p>Tada calls HSB, header Bearer, body (same as /redeem-point):</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>TADA's transaction id.</td></tr><tr><td><code>date</code></td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>Transaction timestamp.</td></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Customer identifier = HSB client_id.</td></tr><tr><td><code>amount</code></td><td>number</td><td>150000</td><td>IDR monetary value, reference only.</td></tr><tr><td><code>convertedAmount</code></td><td>number</td><td>150</td><td>The Coin amount HSB must refund.</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>Reconciliation key, the same as the original deduction.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds">
  <li>Validate auth + IP + field.</li>
  <li class="rvnew"><b>Anti-duplicate:</b> <code>SELECT * FROM point_redemption_transaction WHERE order_reference=? FOR UPDATE</code>. If <code>status=2</code> (already refunded) → return success immediately, do NOT refund again. Stop.</li>
  <li class="rvnew">If there is no row or <code>status≠1</code> (redeem not successful / already refunded) → return failed + log. Stop.</li>
  <li>Open <b>DB transaction</b> — refund back to the exact lots consumed: <ul class="rules">
      <li>Fetch the original CONSUME rows: <code>SELECT lot_id, point_amount FROM point_ledger WHERE redemption_id=? AND type=2</code>.</li>
      <li>For each lot (still valid): <b>INSERT</b> <code>point_ledger</code> (<code>type=3</code> REFUND, <code>point_amount=+ABS(amt)</code>, lot_id, redemption_id, external_system='tada', external_id=order_reference, snapshot balance); <b>UPDATE</b> <code>point_lot</code> SET <code>point_balance = point_balance + ABS(amt)</code>.</li>
      <li class="rvnew"><b>UPDATE</b> <code>point_redemption_transaction</code> SET <code>status=2</code>, <code>void_trx_id=trxId</code>, <code>void_date=date</code>.</li>
      <li>COMMIT.</li>
    </ul> </li>
  <li>Return <code>{status:"success", trxId}</code>.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB returns:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>status</code></td><td>string</td><td>success</td><td>Refund result.</td></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>Transaction id (echoed back).</td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><p>Tada retries void exactly once → must return success for the duplicate, not refund twice. When an order is <code>failed</code>, Tada calls this API automatically. Where to refund when the lot has expired — a policy must be decided (refund into a new lot / allow negative / skip).</p></div></div><div class="specsrc" id="spec-ep-webhook" data-title="POST {HSB base URL}/webhook"><p class="specmeta">B · TADA → HSB · Optional · tracking · <code>POST {HSB base URL}/webhook</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/b942046a377b0-order" target="_blank" rel="noopener" class="ref">Original doc ↗</a></p><p>TADA POSTs order events to HSB's endpoint when an order is created and when its status changes, so HSB stores and updates them in its order table for native display.</p><div class="specsec"><h4>1. Preparation</h4><p>Build one stateless, open-access endpoint. Tell Tada the URL + events. Tada provides a <b>webhook key</b>. Table <code>point_redemption_order</code> (see the <a href="#data" class="ref">Data &amp; Configuration</a> tab).</p></div><div class="specsec"><h4>2. Request</h4><p>Tada POSTs to HSB. Headers: <code>X-TADA-Event</code>, <code>X-TADA-Signature</code>, <code>X-TADA-Delivery</code> (GUID), <code>X-TADA-Attempt</code>. Two event types:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>event = order.detail</code></td><td>object</td><td>trxDate, orderReference, orderNumber, status, recipient, payment, orderItems[], fees[]</td><td>Fired whenever an order is CREATED. Full detail; orderItems include egiftDetail (evoucherCode / pin / evoucherLink / expiredDate) and vendorDetail (PLN/pulsa token in serialNumber / vendorMessage).</td></tr><tr><td><code>event = order.status</code></td><td>object</td><td>data.order{ orderNumber, orderReferance, status, orderItems[]{ itemName, awbNumber, shippingCompany, trackingNumber, vendorMessage } }</td><td>Fired when an order's status CHANGES. Includes shipping tracking (awbNumber, shippingCompany, trackingNumber).</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds">
  <li><b>Validate the signature:</b> compute <code>SHA512(X-TADA-Delivery + webhookKey)</code>, compare with <code>X-TADA-Signature</code>; if wrong → ignore.</li>
  <li><b>Dedupe:</b> if <code>X-TADA-Delivery</code> was already processed → ack 200 and drop.</li>
  <li><b>Map owner:</b> <code>SELECT client_id FROM point_redemption_transaction WHERE order_reference=?</code> (the webhook has no userId; redeem already wrote the row earlier).</li>
  <li><b>By event type:</b>
    <ul class="rules">
      <li><code>order.detail</code> (order created) → <b>UPSERT</b> <code>point_redemption_order</code>: <code>INSERT</code> (order_reference, order_number, client_id, status, order_items [voucher code/PIN, PLN token], recipient, fees, last_status_at=NOW(), raw_payload) <code>ON DUPLICATE KEY UPDATE</code>.</li>
      <li><code>order.status</code> (status change) → <b>UPDATE</b> <code>point_redemption_order</code> SET <code>status</code>, merge tracking (awb/courier/trackingNumber) into <code>order_items</code>, <code>last_status_at=NOW()</code> WHERE <code>order_reference=?</code> (accept <code>orderReferance</code> too).</li>
    </ul>
  </li>
  <li>Return HTTP 200 ack.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB returns HTTP 200 to ack.</p></div><div class="specsec"><h4>5. Notes</h4><p>This is the <b>continuous backend sync</b> mechanism for the order-display flow. A <code>failed</code> order does not need handling here (Tada calls /topup-point itself).</p></div></div><div class="specsrc" id="spec-int-webview" data-title="POST /loyalty/redeem/session"><p class="specmeta">Internal · App → HSB · Mandatory · <code>POST {HSB base URL}/loyalty/redeem/session</code></p><p>The app calls the HSB backend to get the URL to open the Tada webview (not calling Tada directly).</p><div class="specsec"><h4>1. Preparation</h4><p>Has the token + sso flow (see the direction-A APIs). Block blacklisted clients via table <code>client_promotion_blacklist</code>.</p></div><div class="specsec"><h4>2. Request</h4><p>The app calls the HSB backend, with the customer's app token:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>The customer's app login token.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds">
  <li>Authenticate the customer's app token → derive <code>client_id</code>.</li>
  <li><b>Blacklist block:</b> <code>SELECT 1 FROM client_promotion_blacklist WHERE client_id=? AND promo_table='point_redemption_transaction' AND enabled=1 LIMIT 1</code>. If found → return an error to the app, do NOT open the webview. (The real enforcement still sits at /redeem-point since Tada can call it directly.)</li>
  <li><b>SELECT (read-only)</b> balance: <code>SELECT SUM(point_balance) FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW()</code> (send <code>amount</code> for initial display); take <code>cardNumber</code> from config.</li>
  <li>Get a Bearer token (call <a href="#ep-token" class="ref">POST /v2/catalog/token</a> if the cache has expired) → call <a href="#ep-sso" class="ref">POST /v2/catalog/sso</a> with <code>{userId=client_id, cardNumber, amount}</code> to obtain the webview URL.</li>
  <li>Receive <code>url</code> → return to the app. Do not write to the points tables.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>The backend returns to the app:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>url</code></td><td>string</td><td>https://…usetada.com/authorize?sso=…</td><td>The webview URL returned for the app to open.</td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><p>Middleware (D1): the app does not call Tada directly → Tada's Bearer token is not exposed and the customer cannot tamper with the Coin amount sent.</p></div></div><div class="specsrc" id="spec-int-orders" data-title="GET /loyalty/orders"><p class="specmeta">Internal · App → HSB · Optional · tracking · <code>GET {HSB base URL}/loyalty/orders?clientId=…&amp;page=1&amp;pageSize=20</code></p><p>The app calls the HSB backend to get the customer's order list (read from table point_redemption_order, which the webhook keeps synced).</p><div class="specsec"><h4>1. Preparation</h4><p>Table <code>point_redemption_order</code> kept <b>continuously synced by the webhook</b> (see Order Webhook).</p></div><div class="specsec"><h4>2. Request</h4><p>The app calls the HSB backend, with the app token + clientId:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>clientId</code></td><td>string</td><td>72000123</td><td>The customer ID. The backend DERIVES client_id FROM THE TOKEN; if the query clientId differs from the token → 403.</td></tr><tr><td><code>page</code></td><td>number</td><td>1</td><td>Page, starting from 1.</td></tr><tr><td><code>pageSize</code></td><td>number</td><td>20</td><td>Orders per page; default 20, max 100.</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>The app login token.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds">
  <li>Authenticate the app token → <code>client_id</code> (source of truth). If the query <code>clientId</code> differs from the token's <code>client_id</code> → <code>403</code>.</li>
  <li><b>SELECT</b> <code>point_redemption_order</code> WHERE <code>client_id=?</code> <code>ORDER BY create_date DESC, id DESC</code> <code>LIMIT pageSize OFFSET (page-1)*pageSize</code> → return a <b>summary list</b> (orderReference, orderNumber, status, orderDate, firstItemName, coinSpent) + <code>total=COUNT(*)</code>. Newest first so pagination stays stable.</li>
  <li class="rvnew">Full details of an order → use the dedicated endpoint <code>GET /loyalty/orders/{orderReference}</code> (see below).</li>
  <li>Read-only. Do NOT call Tada to list.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>Backend returns to the app (fixed JSON contract):</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>result</code></td><td>object</td><td>{ orders[], page, pageSize, total }</td><td>Wrapped in { success, result }. orders are newest-first.</td></tr></table></div><p class="specmeta">Fixed JSON contract (the dev returns exactly this shape):</p><pre class="rvnew">GET /loyalty/orders?clientId=72000123&amp;page=1&amp;pageSize=20  -&gt;  200
{
  "success": true,
  "result": {
    "orders": [
      {
        "orderReference": "CI23062210514901613152",
        "orderNumber": "TADA18102908185099",
        "status": "on process",
        "orderDate": "2023-06-22T10:51:50Z",
        "firstItemName": "Logam Mulia UBS 1 Gram",
        "coinSpent": 150
      }
    ],
    "page": 1, "pageSize": 20, "total": 37
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// page starts at 1; pageSize default 20, max 100
// orders newest-first (ORDER BY create_date DESC, id DESC)
// status: new | on process | completed | canceled | failed
// NO price / fees / IDR in the list</pre></div><div class="specsec"><h4>5. Notes</h4><p>Do NOT call Tada on each list — data comes from the backend synced via webhook. Tada has no API to list orders by userId, so HSB must keep its own table point_redemption_order.</p></div></div><div class="specsrc" id="spec-int-order-detail" data-title="GET /loyalty/orders/{orderReference}"><p class="specmeta">Internal · App → HSB · Optional · tracking · <code>GET {HSB base URL}/loyalty/orders/{orderReference}</code></p><p>The app fetches the FULL details of one order for the tracking page (reads point_redemption_order + the Coin side from point_redemption_transaction).</p><div class="specsec"><h4>1. Preparation</h4><p class="rvnew">Tables <code>point_redemption_order</code> (webhook sync) + <code>point_redemption_transaction</code> (the Coin side). Only the order owner can view it.</p></div><div class="specsec"><h4>2. Request</h4><p>The app calls the HSB backend with the app token; order_reference is in the path:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>The order to view.</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>The app login token; the backend must verify the order belongs to the token's client_id, otherwise 403.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds rvnew">
  <li>Authenticate the app token → <code>client_id</code>.</li>
  <li><b>SELECT</b> <code>point_redemption_order</code> WHERE <code>order_reference=?</code>. <b>Authorization check:</b> <code>order.client_id</code> must match the token's <code>client_id</code>, otherwise → <code>403</code>.</li>
  <li>Get the Coin side: <b>SELECT</b> <code>coin_amount, redeem_date, status, void_date</code> FROM <code>point_redemption_transaction</code> WHERE <code>order_reference=?</code> (do NOT fetch <code>idr_amount</code> for the app flow).</li>
  <li>Assemble &amp; return the object: header (orderNumber, status, orderDate, lastStatusAt), <code>items[]</code> (split by type: e-voucher code/PIN, PLN token in serialNumber, shipping tracking — <b>drop the price field</b>), recipient, Coin (coinSpent, refunded when <code>status=2</code>). <b>Strip every IDR monetary value</b> (item price, fees, idr_amount) before returning. Read-only.</li>
  <li>If realtime is needed → call <code>Get Order Detail</code> then UPSERT <code>point_redemption_order</code> again before returning.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>Backend returns the detail object (sensitive codes only to the owner) — fixed JSON contract:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>order</code></td><td>object</td><td>orderNumber, status, orderDate, lastStatusAt, coinSpent, items[], recipient</td><td>Details for the tracking page. Does NOT include any IDR monetary value (amount / price / fees).</td></tr></table></div><p class="specmeta">Fixed JSON contract (the dev returns exactly this shape):</p><pre class="rvnew">GET /loyalty/orders/{orderReference}  -&gt;  200
{
  "success": true,
  "result": {
    "orderReference": "CI23062210514901613152",
    "orderNumber": "TADA18102908185099",
    "status": "on process",
    "orderDate": "2023-06-22T10:51:50Z",
    "lastStatusAt": "2023-06-24T08:18:51Z",
    "coinSpent": 150,
    "refunded": false,
    "items": [
      {
        "name": "Pulsa Telkomsel 50rb",
        "type": "pln",
        "quantity": 1,
        "status": "completed",
        "evoucher": { "code": "ABC123", "pin": "9981", "link": "https://...", "expiredDate": "2024-06-22" },
        "token":    { "serialNumber": "1122-3344-5566", "message": "Token PLN" },
        "tracking": { "awbNumber": "JNE123", "shippingCompany": "JNE", "trackingNumber": "JNE123" }
      }
    ],
    "recipient": { "name": "Jo", "address": "Jl ...", "postalCode": "12374" }
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// status: new | on process | completed | canceled | failed
// type:   egift | physical | pln | pulsa | ewallet | ...
// each item has ONLY ONE of evoucher / token / tracking (by type)
// NEVER include item price / fees / idr_amount (IDR)</pre></div><div class="specsec"><h4>5. Notes</h4><p class="rvnew"><b>COMPLIANCE — do NOT expose IDR monetary values to the front-end</b> (idr_amount, each item's price, fees): a regulatory violation. The app shows Coin only; every IDR amount must be stripped at the backend before returning. <b>Sensitive data</b> (voucher code/PIN, PLN token in <code>serialNumber</code>) is returned only to the order owner; the app masks it and the user taps to reveal. <b>Phase 1 has only the current status</b> (<code>status</code> + <code>last_status_at</code>), no step-by-step timeline yet. Each item has only one of the three blocks e-voucher / token / tracking (render by <code>itemType</code>). <b>Fixed response contract:</b> camelCase keys, ISO-8601 dates (UTC), <code>status</code>/<code>type</code> per the enums in the JSON example — the dev returns exactly this shape so the UI needs no rework.</p></div></div><div class="specsrc" id="spec-int-catalog" data-title="GET /loyalty/catalog"><p class="specmeta">Internal · App → HSB · Optional · <code>GET {HSB base URL}/loyalty/catalog?clientId=…</code></p><p>A logged-in user fetches the gift list for their REAL client_group (derived from crm_customer_base). Requires app token + clientId.</p><div class="specsec"><h4>1. Preparation</h4><p class="rvnew">Same as <code>/loyalty/catalog-guest</code> but the <b>client_group is derived from the user</b> (not hardcoded): JOIN <code>promo_client_group → point_program → point_featured_gift</code>, the group taken from <code>crm_customer_base.group_code</code> of <code>clientId</code>. Requires app token.</p></div><div class="specsec"><h4>2. Request</h4><p>The app calls with the app token + clientId:</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>clientId</code></td><td>string</td><td>72000123</td><td>The customer ID. client_id comes from the token; the query clientId must match the token, otherwise 403.</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>The app login token.</td></tr></table></div></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds rvnew">
  <li>Validate the app token → <code>client_id</code>. The query <code>clientId</code> must match the token's <code>client_id</code>, otherwise → <code>403</code>.</li>
  <li>Fetch active gifts with the <b>SQL below</b> — <code>client_group</code> derived from <code>crm_customer_base</code> by <code>clientId</code>.</li>
  <li>Map each gift → <code>{ id, name, points, image }</code> (points = Coin; <code>id</code> = <code>point_featured_gift.id</code> internal, NOT a TADA deep-link). <b>DROP <code>cash_value</code> (IDR)</b>, <code>external_item_id</code>.</li>
  <li>Read-only.</li>
</ol><pre class="rvnew">SELECT  c.id             AS id,
        c.gift_name      AS name,
        c.point_price    AS points,       -- Coin
        c.gift_image_url AS image
FROM        promo_client_group  AS a
INNER JOIN  point_program        AS b  ON  b.id = a.promo_config_id
INNER JOIN  point_featured_gift  AS c  ON  c.program_id = b.id
WHERE   a.promo_table       = 'point_program'    -- hardcode (gift catalog is always under point_program)
    AND a.enabled           = 1
    AND b.enabled           = 1
    AND c.enabled           = 1
    AND c.show_on_dashboard = 1
    AND (c.display_from IS NULL OR NOW() &gt;= c.display_from)
    AND (c.display_to   IS NULL OR NOW() &lt;  c.display_to)
    AND a.client_group = (
            SELECT group_code
            FROM   crm_customer_base
            WHERE  client_id = :clientId       -- clientId resolved from / checked against the token
        )
ORDER BY c.sort_order ASC, c.point_price ASC;
-- do NOT select cash_value (IDR) or external_item_id</pre></div><div class="specsec"><h4>4. Response</h4><p>Backend returns to the app (fixed JSON contract):</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>result</code></td><td>object</td><td>{ rewards[] }</td><td>Wrapped in { success, result }. Coin only; NO cash_value / IDR.</td></tr></table></div><p class="specmeta">Fixed JSON contract (the dev returns exactly this shape):</p><pre class="rvnew">GET /loyalty/catalog?clientId=72000123  -&gt;  200
{
  "success": true,
  "result": {
    "rewards": [
      {
        "id": 1,
        "name": "Saldo GoPay Rp50.000",
        "points": 500,
        "image": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png"
      }
    ]
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// gifts via the user's client_group (crm_customer_base.group_code) -&gt; promo_client_group -&gt; point_program -&gt; point_featured_gift
// name is in Indonesian (TADA product name; may include a denomination)
// points = point_price (Coin). NEVER return cash_value / IDR
// id = point_featured_gift.id (internal key; NOT a TADA deep-link)
// UI shows up to 9 rewards (10th tile = "Earn more coins", UI-added)</pre></div><div class="specsec"><h4>5. Notes</h4><p class="rvnew"><b>Different from the guest version:</b> <code>client_group</code> is taken from the user (<code>crm_customer_base</code>), NOT hardcoded <code>'direct_client'</code>. <b>Compliance:</b> return only <code>points</code> (Coin); do NOT return <code>cash_value</code> or IDR. <code>gift_name</code> may contain a denomination (product name) — HSB owns this column. The list is HSB-curated (<code>point_featured_gift</code>); the full catalog is in the webview after SSO.</p></div></div><div class="specsrc" id="spec-int-catalog-guest" data-title="GET /loyalty/catalog-guest"><p class="specmeta">Internal · App → HSB · Optional · guest · <code>GET {HSB base URL}/loyalty/catalog-guest</code></p><p>A guest (not logged in) fetches the featured gift list for a client_group (default 'direct_client') to show on home. No user token needed.</p><div class="specsec"><h4>1. Preparation</h4><p class="rvnew">Fetch gifts for a <b>client_group</b> (default <code>'direct_client'</code>, hardcoded) through the JOIN chain <code>promo_client_group → point_program → point_featured_gift</code> (EXISTING tables; HSB-curated, not auto-synced from TADA). Protected by <b>a static app-key + rate limit</b>, no user token needed.</p></div><div class="specsec"><h4>2. Request</h4><p>The app calls in guest mode (no user token, no programId needed), with the app-key in the header:</p></div><div class="specsec"><h4>3. HSB processing</h4><ol class="conds rvnew">
  <li>Validate the <b>app-key</b> + rate limit. No user login, no <code>client_id</code>.</li>
  <li>Fetch active gifts with the <b>SQL below</b> — filtered by <code>client_group='direct_client'</code> (hardcoded), only <code>enabled</code> gifts within the display window.</li>
  <li>Map each gift → <code>{ id, name, points, image }</code> (points = Coin; <code>id</code> = <code>point_featured_gift.id</code> internal, NOT a TADA deep-link). <b>DROP <code>cash_value</code> (IDR)</b>, <code>external_item_id</code>.</li>
  <li>Read-only, not personalized. Tapping redeem as a guest → require login first, then enter the webview flow.</li>
</ol><pre class="rvnew">SELECT  c.id             AS id,
        c.gift_name      AS name,
        c.point_price    AS points,       -- Coin
        c.gift_image_url AS image
FROM        promo_client_group  AS a
INNER JOIN  point_program        AS b  ON  b.id = a.promo_config_id
INNER JOIN  point_featured_gift  AS c  ON  c.program_id = b.id
WHERE   a.promo_table       = 'point_program'    -- hardcode (gift catalog is always under point_program)
    AND a.client_group      = 'direct_client'    -- hardcode (guest default group)
    AND a.enabled           = 1
    AND b.enabled           = 1
    AND c.enabled           = 1
    AND c.show_on_dashboard = 1
    AND (c.display_from IS NULL OR NOW() &gt;= c.display_from)
    AND (c.display_to   IS NULL OR NOW() &lt;  c.display_to)
ORDER BY c.sort_order ASC, c.point_price ASC;
-- do NOT select cash_value (IDR) or external_item_id</pre></div><div class="specsec"><h4>4. Response</h4><p>Backend returns to the app (fixed JSON contract):</p><div class="scroll"><table><tr><th style="width:20%">Field</th><th style="width:14%">Type</th><th style="width:26%">Example</th><th>Meaning</th></tr><tr><td><code>result</code></td><td>object</td><td>{ rewards[] }</td><td>Wrapped in { success, result }. Coin only; NO cash_value / IDR.</td></tr></table></div><p class="specmeta">Fixed JSON contract (the dev returns exactly this shape):</p><pre class="rvnew">GET /loyalty/catalog  -&gt;  200
{
  "success": true,
  "result": {
    "rewards": [
      {
        "id": 1,
        "name": "Saldo GoPay Rp50.000",
        "points": 500,
        "image": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png"
      }
    ]
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// gifts via client_group='direct_client' (hardcoded) -&gt; promo_client_group -&gt; point_program -&gt; point_featured_gift
// name is in Indonesian (TADA product name; may include a denomination)
// points = point_price (Coin). NEVER return cash_value / IDR
// id = point_featured_gift.id (internal key; NOT a TADA deep-link)
// UI shows up to 9 rewards (10th tile = "Earn more coins", UI-added)
// guest: no client_id, no redeem; tapping redeem -&gt; require login</pre></div><div class="specsec"><h4>5. Notes</h4><p class="rvnew"><b>Guest = view only.</b> No balance, no redeem; a redeem action must gate login. <b>Compliance:</b> return only <code>points</code> (Coin); do NOT return <code>cash_value</code> or any IDR value. <b>Note on gift names:</b> <code>gift_name</code> may contain a denomination (e.g. "GoPay Rp50.000") — that is the product name; HSB owns this column so it can rename if the rules require hiding denominations. The list is HSB-curated (not auto-synced from TADA) — if a gift or price changes on TADA it must be updated by hand. To see the full catalog → log in to the TADA webview.</p></div></div></div>
</section><section class="panel" id="data" role="tabpanel">
<h2>4. Data &amp; Configuration</h2>
<p>Tables and config shared by multiple APIs. Each API's Spec popup in the <a href="#api" class="ref">API</a> tab points here.</p>

<h3>4.1 Configuration</h3>
<table>
  <tr><th style="width:30%">Config</th><th>Meaning</th><th style="width:30%">Note</th></tr>
  <tr><td><code>TADA_TOKEN_URL / SSO_URL / ORDER_URL</code></td><td>Direction-A endpoints (token, sso, get order detail)</td><td>Different for UAT and PROD</td></tr><tr><td><code>Terminal ID/Password, API Key/Secret</code></td><td>HSB authenticates to get Tada's token</td><td>secret, provided by Tada after the BRD</td></tr><tr><td><code>TADA_CARD_NUMBER</code></td><td>Fixed credential used in SSO and get-point</td><td>not a per-user card number</td></tr><tr><td><code>HSB_SERVICE_TOKEN / HSB_AUTH_USER/PASS</code></td><td>Token/credential HSB issues to Tada (Direction B)</td><td>secret</td></tr><tr><td><code>WEBHOOK_KEY</code></td><td>Key to validate the Order Webhook signature</td><td>Provided by Tada</td></tr><tr><td><code>REDEEM_RATE</code></td><td>Sanity-check convertedAmount</td><td>1 Coin = 100 IDR (confirmed)</td></tr><tr><td><code>TADA_ALLOWED_IPS</code></td><td>Tada outbound IPs to allowlist</td><td>PROD + STAGING; values in internal config</td></tr><tr><td><code>REDEEM_SLA_MS = 3000</code></td><td>Response-time budget</td><td></td></tr><tr class="rvnew"><td><code>RECON_DELAY_MIN</code></td><td>Delay before job #16 considers a record an orphan</td><td>10 minutes; the job detects + alerts ops (does NOT auto-refund Coin)</td></tr>
</table>

<h3>4.2 Existing points tables + point_redemption_transaction</h3>
<p><b>Coin movements and balance use 2 EXISTING tables</b> (full schema in Table Document): <code>point_lot</code> — available balance per lot (<code>point_balance</code>, <code>point_expiration_time</code>); <code>point_ledger</code> — movement log (<code>source_type='redeem'</code>, <code>type</code> 2=CONSUME/3=REFUND, <code>point_amount</code>, <code>lot_id</code>, <code>redemption_id</code>, <code>external_system</code>, <code>external_id</code>, snapshot <code>point_balance_before/after</code>).</p>
<p>The NEW table <code>point_redemption_transaction</code> stores redeem/void requests (idempotency by <code>order_reference</code>, status, void); <code>point_ledger.redemption_id</code> points back to its <code>id</code>:</p>
<p class="note">table document on Google Sheet: <a href="https://docs.google.com/spreadsheets/d/1YUNpxDGjTDgPRBuh1rSKOrCXHJk7o-TRWL5goiEmKhM/edit?gid=0#gid=0" target="_blank" rel="noopener" class="ref">Visit Doc ↗</a></p>
<pre class="rvnew">CREATE TABLE point_redemption_transaction (
  id              BIGINT       PRIMARY KEY AUTO_INCREMENT,
  order_reference VARCHAR(64)  NOT NULL UNIQUE,            -- Tada orderReference = idempotency key; = point_ledger.external_id
  external_system VARCHAR(32)  NOT NULL DEFAULT 'tada',    -- external redemption system
  client_id       VARCHAR(32)  NOT NULL,                   -- = userId (crm_customer_base.client_id)
  trx_id          BIGINT       NULL,                       -- Tada trxId of the redeem (tracing only, not the key)
  coin_amount     BIGINT       NOT NULL,                   -- = convertedAmount (Coin deducted)
  idr_amount      BIGINT       NULL,                       -- = amount (IDR, reference only)
  redeem_date     DATETIME(3)  NULL,                       -- date from the redeem request
  status          TINYINT      NOT NULL,                   -- 1 deducted (active) / 2 refunded; rejected redeems are NOT stored
  fail_reason     VARCHAR(255) NULL,                        -- optional note (manual ops / reconciliation remark)
  void_trx_id     BIGINT       NULL,                       -- Tada trxId of the void (when status=2)
  void_date       DATETIME(3)  NULL,
  reconciled      TINYINT      NOT NULL DEFAULT 0,         -- job #16: 0 unreconciled / 1 pending manual (alerted) / 2 reconciled
  raw_request     JSON         NULL,                        -- redeem request payload; set once at INSERT, NOT overwritten by void
  raw_response    JSON         NULL,                        -- redeem response payload; set once at INSERT, NOT overwritten by void
  create_date     DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
  create_user     VARCHAR(64)  NULL,
  update_date     DATETIME(3)  NULL ON UPDATE CURRENT_TIMESTAMP(3),
  update_user     VARCHAR(64)  NULL
);
-- Coin movements &amp; balance live in point_ledger (redemption_id = id) + point_lot (point_balance). No new balance table.</pre>

<h3>4.3 Table point_redemption_order</h3>
<p>The NEW table stores order status and details (fulfillment side), keyed by <code>order_reference</code>. The Order Webhook UPSERTs here; Get Order Detail fills in more when needed. Used by Order Webhook and the order list.</p>
<p class="note">table document on Google Sheet: <a href="https://docs.google.com/spreadsheets/d/1Tnp25uYI6zkLqNzgtpbOwlO9zLbshR6pXJHjEOWg514/edit?gid=0#gid=0" target="_blank" rel="noopener" class="ref">Visit Doc ↗</a></p>
<pre>CREATE TABLE point_redemption_order (
  id              BIGINT       PRIMARY KEY AUTO_INCREMENT,
  order_reference VARCHAR(64)  NOT NULL UNIQUE,            -- link point_redemption_transaction.order_reference
  order_number    VARCHAR(64)  NULL,                       -- Tada orderNumber
  client_id       VARCHAR(32)  NOT NULL,                   -- from point_redemption_transaction by order_reference
  status          VARCHAR(20)  NULL,                       -- new / on process / completed / canceled / failed
  order_items     JSON         NULL,                       -- items + egiftDetail (voucher code/PIN) + vendorDetail (PLN token) + tracking (awb/courier)
  recipient       JSON         NULL,                       -- recipient + delivery address
  fees            JSON         NULL,
  last_status_at  DATETIME(3)  NULL,
  raw_payload     JSON         NULL,
  create_date     DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
  create_user     VARCHAR(64)  NULL,
  update_date     DATETIME(3)  NULL ON UPDATE CURRENT_TIMESTAMP(3),
  update_user     VARCHAR(64)  NULL
);</pre>

<h3>4.4 Blocking blacklisted clients (client_promotion_blacklist)</h3>
<p>Reuse the <b>EXISTING</b> table <code>client_promotion_blacklist</code> (Point Sys - Global) to block a client from the redemption feature, no new table. The table's unique key = <code>client_id + promo_table + promo_config_id + point_task_bundle_id</code>.</p>
<p><b>Convention for one redeem-block row:</b></p>
<table>
  <tr><th style="width:34%">Column</th><th>Value</th></tr>
  <tr><td><code>client_id</code></td><td>client_id of the blocked customer</td></tr>
  <tr><td><code>promo_table</code></td><td><code>point_redemption_transaction</code> (used as a "redemption feature" flag)</td></tr>
  <tr><td><code>promo_config_id</code></td><td><code>0</code> (redeem has no config row)</td></tr>
  <tr><td><code>point_task_bundle_id</code></td><td><code>0</code> (redeem does not belong to a bundle)</td></tr>
  <tr><td><code>enabled</code></td><td><code>1</code> = blacklist (0 = unblock)</td></tr>
</table>
<p>Set <code>promo_config_id</code>/<code>point_task_bundle_id</code> = <code>0</code> (do NOT use NULL — NULLs in a MySQL unique key are treated as distinct and would allow duplicate inserts), keeping exactly "one client = one redeem-block row". Check query at /redeem-point and /loyalty/redeem/session:</p>
<pre>SELECT 1 FROM client_promotion_blacklist\n WHERE client_id = ?\n   AND promo_table = 'point_redemption_transaction'\n   AND enabled = 1\n LIMIT 1;</pre>

<h3>4.5 Security (summary)</h3>
<ul>
  <li><b>IP allowlist</b> at the LB/gateway for the Direction-B endpoints (IP values in internal config).</li>
  <li><b>Bearer token</b> on get-point / redeem / topup (via /auth or static). No HMAC.</li>
  <li><b>The Order Webhook is signed</b>: validate <code>X-TADA-Signature</code> = <code>SHA512(X-TADA-Delivery + webhookKey)</code>.</li>
  <li><b>No session binding</b> (option A).</li>
</ul>
</section><section class="panel" id="open" role="tabpanel">

<p>Items still to clarify or design; they do not block the core build.</p>
<table>
  <tr><th style="width:7%">ID</th><th style="width:30%">Item</th><th>Detail and status</th></tr>
  <tr class="rvnew"><td class="c">O1</td><td>Manual Coin refund for the orphan case (reconciliation job #16)</td><td>When job #16 detects an orphan (redeem status=1 but Get Order Detail returns a real HTTP 404 after RECON_DELAY_MIN=10 minutes), the system does NOT auto-refund Coin — it sets reconciled=1 (pending manual) and raises an alert. We need: (1) an alert channel for ops (e.g. Slack / email / ticket) when an orphan is detected; (2) an admin-adjust screen for ops to refund Coin manually after verifying with TADA — write point_ledger type=3 (REFUND) + update point_lot + set point_redemption_transaction status=2, then set reconciled=2. This alert channel and admin screen are NOT designed yet. <span class="pending">OPEN</span></td></tr>
</table>
