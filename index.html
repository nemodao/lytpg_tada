<h1>HSB × TADA Redemption – Integration flow</h1>
<p class="sub">Integration document for redeeming Coin for gifts through the TADA webview. Updated: 2026-10-15.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. Overview</button><button type="button" role="tab" data-tab="flow" aria-selected="false">2. Flow</button><button type="button" role="tab" data-tab="api" aria-selected="false">3. API</button><button type="button" role="tab" data-tab="open" aria-selected="false">4. Open items</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. Overview</h2>
<p>This document describes the integration flow between HSB and TADA that lets customers redeem Coin for gifts through TADA's webview. HSB owns the Coin; TADA provides the gift catalog and the redemption interface. It is for both sides' development teams when building and testing the integration, and reflects the answers TADA has confirmed as of 2026-10-15.</p>

<h3>Two call directions and two tokens</h3>
<p>The flow has two opposite call directions, each using its own token; do not mix the tokens between them.</p>
<table>
  <tr><th style="width:24%">Direction</th><th>Description</th><th style="width:26%">Token</th></tr>
  <tr><td>Direction A — HSB calls TADA</td><td>When the customer taps redeem, HSB obtains a token and calls SSO to get the webview URL.</td><td>Issued by TADA to HSB</td></tr>
  <tr><td>Direction B — TADA calls HSB</td><td>While the customer works in the webview, TADA calls HSB's APIs to fetch the balance, deduct Coin and refund Coin.</td><td>Issued by HSB to TADA, via <code>/auth</code></td></tr>
</table>
<p>The customer's app login token is never passed to TADA. The customer's legitimacy is already guaranteed by HSB at the SSO step: only after the customer is validly logged in to the app does HSB's backend call SSO. The Direction-B token only proves that the caller is TADA.</p>

<h3>API list</h3>
<p>The whole integration has 6 APIs. Field details for each API are in the <a href="#api" class="ref">API</a> tab; click an API name to jump there.</p>
<table>
  <tr><th style="width:30%">API</th><th>Role</th><th style="width:16%">Mandatory</th></tr>
  <tr><td><a href="#ep-token" class="ref">POST /v2/catalog/token</a></td><td>A · HSB → TADA</td><td>Mandatory</td></tr><tr><td><a href="#ep-sso" class="ref">POST /v2/catalog/sso</a></td><td>A · HSB → TADA</td><td>Mandatory</td></tr><tr><td><a href="#ep-auth" class="ref">POST /auth</a></td><td>B · TADA → HSB</td><td>Optional</td></tr><tr><td><a href="#ep-getpoint" class="ref">POST /get-point</a></td><td>B · TADA → HSB</td><td>Mandatory</td></tr><tr><td><a href="#ep-redeem" class="ref">POST /redeem-point</a></td><td>B · TADA → HSB</td><td>Mandatory</td></tr><tr><td><a href="#ep-topup" class="ref">POST /topup-point</a></td><td>B · TADA → HSB</td><td>Mandatory</td></tr>
</table>

<h3>Identifiers and units</h3>
<ul>
  <li>The customer is identified by <code>userId</code>, provided by HSB.</li>
  <li><code>cardNumber</code> is a fixed credential issued by TADA, the same on every request; it is not a per-customer card number.</li>
  <li>The Coin amount to deduct or refund is in <code>convertedAmount</code>; <code>amount</code> is the IDR monetary value, for reference only. The conversion rate is configured by HSB.</li>
  <li>The reconciliation and idempotency key is <code>orderReference</code>, consistent between the deduction and the refund of the same transaction.</li>
  <li>Every call from TADA to HSB has a 3-second timeout; HSB's endpoints must respond within 3 seconds.</li>
</ul>
</section><section class="panel" id="flow" role="tabpanel">
<h2>2. Redemption flow</h2>
<p>The diagram below shows a full redemption, from the moment the customer taps the button through deducting Coin, delivering the gift and refunding Coin on failure. Each box is a stage; the yellow strip at the bottom of a box is a note or an open item for that stage.</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">Stage 0 — Get the token</div><div class="fd">HSB calls TADA to get a Bearer token before calling SSO. Direction A.</div></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>HSB calls <code>POST /v2/catalog/token</code> with client credentials (Basic auth) and an API user (password grant).</td></tr><tr><td class="c">2</td><td>TADA returns a Bearer token with its expiry.</td></tr></table><div class="fnote">The token is time-limited with sliding expiry and no refresh token. Request a new one at expiry or on a 401. UAT and Production use separate credentials.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 1 — Open the webview (SSO)</div><div class="fd">HSB calls TADA to get the URL that opens the redemption webview. Direction A.</div></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>The customer taps the redeem button in the app.</td></tr><tr><td class="c">2</td><td>The app calls the HSB backend with the customer's app token; the app does not call TADA directly.</td></tr><tr><td class="c">3</td><td>The backend calls <code>POST /v2/catalog/sso</code> with <code>userId</code>, <code>cardNumber</code>, <code>amount</code>.</td></tr><tr><td class="c">4</td><td>TADA returns <code>url</code>, <code>token</code> and a <code>expiryTime</code> of 300 seconds.</td></tr><tr><td class="c">5</td><td>The backend returns <code>url</code> to the app; the app opens the webview.</td></tr></table><div class="fnote"><code>cardNumber</code> is TADA's fixed credential, not a per-customer card number. The 300 seconds is the window to open the URL; after authentication the webview session lasts 24 hours and the customer is not logged out mid-session.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 2 — Display the balance</div><div class="fd">TADA calls HSB to fetch the Coin balance shown in the webview. Direction B. Mandatory.</div></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>TADA calls <code>/auth</code> (if HSB enables it) to get a token.</td></tr><tr><td class="c">2</td><td>TADA calls <code>POST /get-point</code> with <code>userId</code>, <code>cardNumber</code>; HSB returns the balance.</td></tr></table><div class="fnote"><code>/get-point</code> is mandatory. Both the displayed balance and the balance used to validate a redemption come from the value returned here.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 3 — Deduct Coin</div><div class="fd">TADA calls HSB to deduct Coin when the customer redeems. Direction B. Mandatory. 3-second timeout.</div></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>The customer selects a gift and taps redeem.</td></tr><tr><td class="c">2</td><td>TADA calls <code>POST /redeem-point</code> with <code>trxId</code>, <code>convertedAmount</code>, <code>orderReference</code>…</td></tr><tr><td class="c">3</td><td>HSB checks (enough Coin, dedupe by <code>orderReference</code>) then deducts exactly <code>convertedAmount</code> and returns <code>status</code>.</td></tr><tr><td class="c">4</td><td>TADA creates the order.</td></tr></table><div class="fnote">Must respond within 3 seconds and dedupe by <code>orderReference</code>. On rejection: return HTTP 200 with <code>status</code> failed for business reasons, 4xx for client errors, 5xx for system errors.<br><br><b><span class="pending">PENDING</span> Rare edge case — question #16:</b> if HSB already deducted Coin but responds after 3 seconds, TADA treats it as failed, creates no order and sends no refund, so the customer is deducted but gets no gift. Awaiting TADA's confirmation on how to handle this.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 4a — Order succeeds</div><div class="fd">TADA delivers the gift to the customer. No call back to HSB.</div></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>TADA delivers the gift by type: e-Voucher, physical item, PLN, e-Wallet, Pulsa/Data.</td></tr></table><div class="fnote">For an e-Voucher sent by email, HSB must pass <code>recipient.email</code>. The exact way to pass it is awaiting TADA's clarification — question #18.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Stage 4b — Order fails, refund Coin</div><div class="fd">TADA calls HSB to refund the deducted Coin. Direction B. Mandatory.</div></div><table class="fmsg"><tr><th class="c">Step</th><th>Action</th></tr><tr><td class="c">1</td><td>TADA calls <code>POST /topup-point</code> to refund Coin.</td></tr><tr><td class="c">2</td><td>HSB reconciles by <code>orderReference</code> then refunds Coin; a duplicate refund is treated as already done.</td></tr><tr><td class="c">3</td><td>TADA retries exactly once on failure; if it still fails, it emails HSB for manual handling.</td></tr></table><div class="fnote">Dedupe by <code>orderReference</code>: return success for a duplicate refund, do not refund twice.</div></div></div>
<p class="note">After redeeming, the customer returns to accumulating Coin as usual. Field details for each API are in the <a href="#api" class="ref">API</a> tab.</p>
</section><section class="panel" id="api" role="tabpanel">
<h2>3. API details</h2>
<p>Each block is one API: the header row is the API name, followed by general information and rules, then a table of request and response fields. Field names and API names stay in English. Example values are dummy data.</p>
<div class="scroll evblock" id="ep-token"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /v2/catalog/token</code><span class="evmeta">A · HSB → TADA · Mandatory</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Path</dt><dd><code>POST https://api.gift.id/v2/catalog/token</code></dd><dt>Direction</dt><dd>A · HSB → TADA</dd><dt>Mandatory</dt><dd>Mandatory</dd><dt>Concept</dt><dd>HSB calls this to get the Bearer token used for the SSO step. Authentication uses client credentials (Basic auth) plus an API user (password grant).</dd><dt>Rules</dt><dd><ul class="rules"><li>The token is time-limited, set per client (in days). There is no refresh token: HSB gets a new token by calling this endpoint again.</li><li>Sliding expiry: if more than 1 hour remains, the same token is returned with its expiry extended; if under 1 hour or already expired, a new token is issued. HSB re-requests at <code>expiredAt</code> or on a 401.</li><li>UAT and Production use separate credentials; tokens are not shared between the two environments.</li></ul></dd></dl></td></tr><tr><th>Field</th><th>Direction</th><th>Type</th><th>Example</th><th>Meaning</th></tr><tr><td><code>client credentials</code></td><td>request</td><td>Basic auth</td><td>Authorization: Basic …</td><td>Identifies the HSB client, issued by TADA.</td></tr><tr><td><code>API user</code></td><td>request</td><td>password grant</td><td>username + password</td><td>API user account, issued by TADA.</td></tr><tr><td><code>token</code></td><td>response</td><td>string</td><td>6jYJW0lS9C…</td><td>Bearer token for subsequent calls.</td></tr><tr><td><code>tokenType</code></td><td>response</td><td>string</td><td>Bearer</td><td>Token type.</td></tr><tr><td><code>expiredAt</code></td><td>response</td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>When the token expires.</td></tr></table></div><div class="scroll evblock" id="ep-sso"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /v2/catalog/sso</code><span class="evmeta">A · HSB → TADA · Mandatory</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Path</dt><dd><code>POST https://api.gift.id/v2/catalog/sso</code></dd><dt>Direction</dt><dd>A · HSB → TADA</dd><dt>Mandatory</dt><dd>Mandatory</dd><dt>Concept</dt><dd>HSB calls this to get the URL that opens the redemption webview, with the customer identifier and current Coin.</dd><dt>Rules</dt><dd><ul class="rules"><li><code>expiryTime</code> (300 seconds) is the window to OPEN and authorize the URL. After successful authentication, the webview session lasts 24 hours; the customer is not logged out mid-session.</li><li>Open the URL immediately after getting it. Call server-to-server from the HSB backend, not directly from the app.</li></ul></dd></dl></td></tr><tr><th>Field</th><th>Direction</th><th>Type</th><th>Example</th><th>Meaning</th></tr><tr><td><code>userId</code></td><td>request</td><td>string</td><td>john74doe64</td><td>Customer identifier, provided by HSB.</td></tr><tr><td><code>cardNumber</code></td><td>request</td><td>string</td><td>3671618079831369</td><td>Fixed credential issued by TADA, the same on every request; not a per-customer card number.</td></tr><tr><td><code>amount</code></td><td>request</td><td>number</td><td>500000</td><td>The customer's current Coin, for the initial display.</td></tr><tr><td><code>url</code></td><td>response</td><td>string</td><td>https://…usetada.com/authorize?sso=…</td><td>URL that opens the webview.</td></tr><tr><td><code>token</code></td><td>response</td><td>string</td><td>EA50L62of5…</td><td>SSO token embedded in the URL.</td></tr><tr><td><code>expiryTime</code></td><td>response</td><td>number</td><td>300</td><td>Window to open the URL, in seconds.</td></tr></table></div><div class="scroll evblock" id="ep-auth"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /auth</code><span class="evmeta">B · TADA → HSB · Optional</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Path</dt><dd><code>POST {HSB base URL}/auth</code></dd><dt>Direction</dt><dd>B · TADA → HSB</dd><dt>Mandatory</dt><dd>Optional</dd><dt>Concept</dt><dd>TADA logs into the HSB system to get a token, used for the other three Direction-B APIs.</dd><dt>Rules</dt><dd><ul class="rules"><li>Service-level authentication: it only proves 'the caller is TADA', not per-customer authentication.</li><li>The credentials are the Terminal ID and Terminal Password issued by TADA, different between staging and production; one pair represents one store.</li></ul></dd></dl></td></tr><tr><th>Field</th><th>Direction</th><th>Type</th><th>Example</th><th>Meaning</th></tr><tr><td><code>username</code></td><td>request</td><td>string</td><td>johncatalog7464</td><td>Terminal ID issued by TADA.</td></tr><tr><td><code>password</code></td><td>request</td><td>string</td><td>9455J05N==</td><td>Terminal Password issued by TADA.</td></tr><tr><td><code>token</code></td><td>response</td><td>string</td><td>6jYJW0lS9C…</td><td>Token issued by HSB to TADA.</td></tr><tr><td><code>expiredAt</code></td><td>response</td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>When the token expires.</td></tr><tr><td><code>expiresIn</code></td><td>response</td><td>number</td><td>86399</td><td>Remaining lifetime, in SECONDS (the original doc wrongly says milliseconds).</td></tr><tr><td><code>tokenType</code></td><td>response</td><td>string</td><td>Bearer</td><td>Token type.</td></tr></table></div><div class="scroll evblock" id="ep-getpoint"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /get-point</code><span class="evmeta">B · TADA → HSB · Mandatory</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Path</dt><dd><code>POST {HSB base URL}/get-point</code></dd><dt>Direction</dt><dd>B · TADA → HSB</dd><dt>Mandatory</dt><dd>Mandatory</dd><dt>Concept</dt><dd>TADA calls this to fetch the customer's Coin balance, used to display in the webview and to validate the balance when the customer redeems.</dd><dt>Rules</dt><dd><ul class="rules"><li>Mandatory. The original doc saying 'optional' is wrong; TADA has corrected it. If HSB does not build this endpoint, TADA cannot fetch or display the balance.</li><li>Both the displayed balance and the balance used to validate a redemption come from the <code>amount</code> returned here.</li></ul></dd></dl></td></tr><tr><th>Field</th><th>Direction</th><th>Type</th><th>Example</th><th>Meaning</th></tr><tr><td><code>userId</code></td><td>request</td><td>string</td><td>671236713598173</td><td>Customer identifier.</td></tr><tr><td><code>cardNumber</code></td><td>request</td><td>string</td><td>6233724664249662</td><td>Fixed credential issued by TADA.</td></tr><tr><td><code>userId</code></td><td>response</td><td>string</td><td>671236713598173</td><td>Customer identifier (echoed back).</td></tr><tr><td><code>amount</code></td><td>response</td><td>number</td><td>500000</td><td>The customer's current Coin balance.</td></tr></table></div><div class="scroll evblock" id="ep-redeem"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /redeem-point</code><span class="evmeta">B · TADA → HSB · Mandatory</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Path</dt><dd><code>POST {HSB base URL}/redeem-point</code></dd><dt>Direction</dt><dd>B · TADA → HSB</dd><dt>Mandatory</dt><dd>Mandatory</dd><dt>Concept</dt><dd>TADA calls this to deduct the customer's Coin whenever they redeem. This is the deduction step.</dd><dt>Rules</dt><dd><ul class="rules"><li>Deduct exactly <code>convertedAmount</code> (the Coin amount). <code>amount</code> is the IDR monetary value, for reference only. The conversion rate is configured by HSB.</li><li>Dedupe by <code>orderReference</code>: a repeat call with the same <code>orderReference</code> returns the prior result, not a second deduction.</li><li>Must respond within 3 seconds.</li><li>On rejection: return <code>HTTP 200</code> with <code>{status:"failed", trxId, message}</code> for business reasons (insufficient Coin, customer not found); <code>4xx</code> for client errors; <code>5xx</code> for system errors. On a failed redeem, TADA does NOT send a refund.</li></ul></dd></dl></td></tr><tr><th>Field</th><th>Direction</th><th>Type</th><th>Example</th><th>Meaning</th></tr><tr><td><code>trxId</code></td><td>request</td><td>number</td><td>2147483647</td><td>TADA's transaction id.</td></tr><tr><td><code>date</code></td><td>request</td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>Transaction timestamp.</td></tr><tr><td><code>userId</code></td><td>request</td><td>string</td><td>671236713598173</td><td>Customer identifier.</td></tr><tr><td><code>amount</code></td><td>request</td><td>number</td><td>150000</td><td>IDR monetary value, reference only.</td></tr><tr><td><code>convertedAmount</code></td><td>request</td><td>number</td><td>150</td><td>The Coin amount HSB must deduct.</td></tr><tr><td><code>orderReference</code></td><td>request</td><td>string</td><td>CI23062210514901613152</td><td>Reconciliation and idempotency key, consistent with the refund.</td></tr><tr><td><code>status</code></td><td>response</td><td>string</td><td>success</td><td>Result: success or failed.</td></tr><tr><td><code>trxId</code></td><td>response</td><td>number</td><td>2147483647</td><td>Transaction id (echoed back).</td></tr><tr><td><code>message</code></td><td>response</td><td>string</td><td>insufficient points</td><td>Optional: the rejection reason, for TADA's logs.</td></tr></table></div><div class="scroll evblock" id="ep-topup"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /topup-point</code><span class="evmeta">B · TADA → HSB · Mandatory</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Path</dt><dd><code>POST {HSB base URL}/topup-point</code></dd><dt>Direction</dt><dd>B · TADA → HSB</dd><dt>Mandatory</dt><dd>Mandatory</dd><dt>Concept</dt><dd>TADA calls this to refund the customer's Coin when a redemption fails after the order was created. This is the refund / void step.</dd><dt>Rules</dt><dd><ul class="rules"><li>Refund exactly <code>convertedAmount</code> for the matching <code>orderReference</code>. Request and response share the same structure as /redeem-point.</li><li>Dedupe by <code>orderReference</code>: a duplicate refund with the same <code>orderReference</code> is treated as already done, return success, do not refund twice.</li><li>TADA retries exactly once (at most 2 calls, no wait between them). If it still fails, TADA emails HSB for manual handling.</li></ul></dd></dl></td></tr><tr><th>Field</th><th>Direction</th><th>Type</th><th>Example</th><th>Meaning</th></tr><tr><td><code>trxId</code></td><td>request</td><td>number</td><td>2147483647</td><td>TADA's transaction id.</td></tr><tr><td><code>date</code></td><td>request</td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>Transaction timestamp.</td></tr><tr><td><code>userId</code></td><td>request</td><td>string</td><td>671236713598173</td><td>Customer identifier.</td></tr><tr><td><code>amount</code></td><td>request</td><td>number</td><td>150000</td><td>IDR monetary value, reference only.</td></tr><tr><td><code>convertedAmount</code></td><td>request</td><td>number</td><td>150</td><td>The Coin amount HSB must refund.</td></tr><tr><td><code>orderReference</code></td><td>request</td><td>string</td><td>CI23062210514901613152</td><td>Reconciliation key, the same as the original deduction.</td></tr><tr><td><code>status</code></td><td>response</td><td>string</td><td>success</td><td>Refund result.</td></tr><tr><td><code>trxId</code></td><td>response</td><td>number</td><td>2147483647</td><td>Transaction id (echoed back).</td></tr></table></div>

<template id="tpl-zh">
<h1>HSB × TADA Redemption – 集成流程</h1>
<p class="sub">通过 TADA webview 用 Coin 兑换礼品的集成文档。更新：2026-10-15。</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. 概览</button><button type="button" role="tab" data-tab="flow" aria-selected="false">2. 流程</button><button type="button" role="tab" data-tab="api" aria-selected="false">3. API</button><button type="button" role="tab" data-tab="open" aria-selected="false">4. 待定事项</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. 概览</h2>
<p>本文档描述 HSB 与 TADA 之间的集成流程，让客户通过 TADA 的 webview 用 Coin 兑换礼品。HSB 负责管理 Coin；TADA 提供礼品库和兑换界面。本文档供双方开发团队在搭建和测试集成时使用，并反映了截至 2026-10-15 TADA 已确认的答复。</p>

<h3>两个调用方向与两个令牌</h3>
<p>流程有两个相反的调用方向，各自使用独立的令牌；两个方向之间不可混用。</p>
<table>
  <tr><th style="width:24%">方向</th><th>说明</th><th style="width:26%">Token</th></tr>
  <tr><td>方向 A — HSB 调用 TADA</td><td>客户点击兑换时，HSB 先取得令牌，再调用 SSO 获取 webview URL。</td><td>由 TADA 发给 HSB</td></tr>
  <tr><td>方向 B — TADA 调用 HSB</td><td>客户在 webview 操作期间，TADA 反向调用 HSB 的 API 来获取余额、扣减 Coin 和退回 Coin。</td><td>由 HSB 发给 TADA，通过 <code>/auth</code></td></tr>
</table>
<p>客户的 app 登录令牌绝不会传给 TADA。客户的合法性在 SSO 步骤已由 HSB 保证：只有客户在 app 中合法登录后，HSB 后端才会调用 SSO。方向 B 的令牌只用于证明调用方确实是 TADA。</p>

<h3>API 列表</h3>
<p>整个集成共 6 个 API。各 API 的字段明细见 <a href="#api" class="ref">API</a> 标签页；点击 API 名称可跳转。</p>
<table>
  <tr><th style="width:30%">API</th><th>作用</th><th style="width:16%">必须</th></tr>
  <tr><td><a href="#ep-token" class="ref">POST /v2/catalog/token</a></td><td>A · HSB → TADA</td><td>必须</td></tr><tr><td><a href="#ep-sso" class="ref">POST /v2/catalog/sso</a></td><td>A · HSB → TADA</td><td>必须</td></tr><tr><td><a href="#ep-auth" class="ref">POST /auth</a></td><td>B · TADA → HSB</td><td>可选</td></tr><tr><td><a href="#ep-getpoint" class="ref">POST /get-point</a></td><td>B · TADA → HSB</td><td>必须</td></tr><tr><td><a href="#ep-redeem" class="ref">POST /redeem-point</a></td><td>B · TADA → HSB</td><td>必须</td></tr><tr><td><a href="#ep-topup" class="ref">POST /topup-point</a></td><td>B · TADA → HSB</td><td>必须</td></tr>
</table>

<h3>标识与单位</h3>
<ul>
  <li>客户由 HSB 提供的 <code>userId</code> 标识。</li>
  <li><code>cardNumber</code> 是 TADA 发放的固定凭据，每次请求都相同；不是每位客户的卡号。</li>
  <li>要扣减或退回的 Coin 数量在 <code>convertedAmount</code>；<code>amount</code> 是 IDR 金额，仅供参考。兑换比率由 HSB 配置。</li>
  <li>对账与去重的键是 <code>orderReference</code>，在同一笔交易的扣减与退回之间保持一致。</li>
  <li>TADA 向 HSB 的每次调用都有 3 秒超时；HSB 的接口必须在 3 秒内响应。</li>
</ul>
</section><section class="panel" id="flow" role="tabpanel">
<h2>2. 兑换流程</h2>
<p>下图描述一次完整的兑换，从客户点击按钮到扣减 Coin、发放礼品，以及失败时退回 Coin。每个方框是一个阶段；方框底部的黄色条是该阶段的备注或待定事项。</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">阶段 0 — 获取令牌</div><div class="fd">HSB 在调用 SSO 之前先调用 TADA 获取 Bearer 令牌。方向 A。</div></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>HSB 用 client credentials（Basic auth）和 API 用户（password grant）调用 <code>POST /v2/catalog/token</code>。</td></tr><tr><td class="c">2</td><td>TADA 返回 Bearer 令牌及其有效期。</td></tr></table><div class="fnote">令牌有有效期、滑动续期、无 refresh token。到期或遇到 401 时重新申请。UAT 与 Production 使用各自的凭据。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 1 — 打开 webview（SSO）</div><div class="fd">HSB 调用 TADA 获取打开兑换 webview 的 URL。方向 A。</div></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>客户在 app 中点击兑换按钮。</td></tr><tr><td class="c">2</td><td>app 携带客户的 app 令牌调用 HSB 后端；app 不直接调用 TADA。</td></tr><tr><td class="c">3</td><td>后端用 <code>userId</code>、<code>cardNumber</code>、<code>amount</code> 调用 <code>POST /v2/catalog/sso</code>。</td></tr><tr><td class="c">4</td><td>TADA 返回 <code>url</code>、<code>token</code> 以及 300 秒的 <code>expiryTime</code>。</td></tr><tr><td class="c">5</td><td>后端把 <code>url</code> 返回给 app；app 打开 webview。</td></tr></table><div class="fnote"><code>cardNumber</code> 是 TADA 的固定凭据，不是每位客户的卡号。300 秒是打开 URL 的时限；验证成功后，webview 会话维持 24 小时，客户不会在中途被登出。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 2 — 显示余额</div><div class="fd">TADA 调用 HSB 获取在 webview 上显示的 Coin 余额。方向 B。必须。</div></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>TADA 调用 <code>/auth</code>（若 HSB 启用）获取令牌。</td></tr><tr><td class="c">2</td><td>TADA 用 <code>userId</code>、<code>cardNumber</code> 调用 <code>POST /get-point</code>；HSB 返回余额。</td></tr></table><div class="fnote"><code>/get-point</code> 为必须。显示的余额和兑换时用于校验的余额都取自此处返回的值。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 3 — 扣减 Coin</div><div class="fd">客户兑换时 TADA 调用 HSB 扣减 Coin。方向 B。必须。3 秒超时。</div></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>客户选择礼品并点击兑换。</td></tr><tr><td class="c">2</td><td>TADA 用 <code>trxId</code>、<code>convertedAmount</code>、<code>orderReference</code> 调用 <code>POST /redeem-point</code>…</td></tr><tr><td class="c">3</td><td>HSB 校验（Coin 足够、按 <code>orderReference</code> 去重）后按 <code>convertedAmount</code> 扣减，返回 <code>status</code>。</td></tr><tr><td class="c">4</td><td>TADA 创建订单。</td></tr></table><div class="fnote">必须在 3 秒内响应，并按 <code>orderReference</code> 去重。拒绝时：业务原因返回 HTTP 200 加 <code>status</code> failed，客户端错误返回 4xx，系统错误返回 5xx。<br><br><b><span class="pending">PENDING</span> 罕见边界情况 — 问题 #16：</b> 若 HSB 已扣减 Coin 但响应超过 3 秒，TADA 会视为失败，不创建订单也不发退回，导致客户被扣 Coin 却拿不到礼品。正在等待 TADA 确认处理方式。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 4a — 订单成功</div><div class="fd">TADA 向客户发放礼品。不回调 HSB。</div></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>TADA 按类型发放礼品：e-Voucher、实物、PLN、e-Wallet、Pulsa/Data。</td></tr></table><div class="fnote">对于通过邮件发送的 e-Voucher，HSB 需要传 <code>recipient.email</code>。具体传递方式仍待 TADA 澄清 — 问题 #18。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 4b — 订单失败，退回 Coin</div><div class="fd">TADA 调用 HSB 退回已扣的 Coin。方向 B。必须。</div></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>TADA 调用 <code>POST /topup-point</code> 退回 Coin。</td></tr><tr><td class="c">2</td><td>HSB 按 <code>orderReference</code> 对账后退回 Coin；重复的退回视为已完成。</td></tr><tr><td class="c">3</td><td>失败时 TADA 只重试一次；仍失败则发邮件给 HSB 人工处理。</td></tr></table><div class="fnote">按 <code>orderReference</code> 去重：对重复的退回返回 success，不退两次。</div></div></div>
<p class="note">兑换后，客户照常回到累积 Coin 的阶段。各 API 的字段明细见 <a href="#api" class="ref">API</a> 标签页。</p>
</section><section class="panel" id="api" role="tabpanel">
<h2>3. API 明细</h2>
<p>每个方框是一个 API：标题行是 API 名称，接着是通用信息和规则，再是 request 与 response 字段表。字段名和 API 名保持英文。示例值为虚构数据。</p>

<section class="panel" id="overview" role="tabpanel">
<h2>1. Tổng quan</h2>
<p>Tài liệu này mô tả luồng tích hợp giữa HSB và TADA để khách đổi Coin lấy quà qua webview của TADA. HSB là nơi quản lý Coin; TADA cung cấp kho quà và giao diện đổi quà. Tài liệu dùng cho đội phát triển hai bên khi dựng và kiểm thử tích hợp, và phản ánh các câu trả lời TADA đã xác nhận tính đến ngày 2026-10-15.</p>

<h3>Hai chiều gọi và hai token</h3>
<p>Luồng có hai chiều gọi ngược nhau, mỗi chiều dùng một token riêng; không dùng lẫn giữa hai chiều.</p>
<table>
  <tr><th style="width:24%">Chiều</th><th>Mô tả</th><th style="width:26%">Token</th></tr>
  <tr><td>Chiều A — HSB gọi TADA</td><td>Khi khách bấm đổi quà, HSB lấy token rồi gọi SSO để nhận URL webview.</td><td>TADA cấp cho HSB</td></tr>
  <tr><td>Chiều B — TADA gọi HSB</td><td>Trong lúc khách thao tác trong webview, TADA gọi ngược các API của HSB để lấy số dư, trừ Coin và hoàn Coin.</td><td>HSB cấp cho TADA, qua <code>/auth</code></td></tr>
</table>
<p>Token đăng nhập app của khách không bao giờ được đưa sang TADA. Việc khách hợp lệ đã được HSB bảo đảm ngay tại bước SSO: khách đăng nhập hợp lệ trong app thì backend HSB mới gọi SSO. Token chiều B chỉ để chứng minh bên gọi đúng là TADA.</p>

<h3>Danh sách API</h3>
<p>Toàn bộ tích hợp gồm 6 API. Chi tiết trường của từng API ở tab <a href="#api" class="ref">API</a>; bấm vào tên API để tới nơi.</p>
<table>
  <tr><th style="width:30%">API</th><th>Vai trò</th><th style="width:16%">Bắt buộc</th></tr>
  <tr><td><a href="#ep-token" class="ref">POST /v2/catalog/token</a></td><td>A · HSB → TADA</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-sso" class="ref">POST /v2/catalog/sso</a></td><td>A · HSB → TADA</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-auth" class="ref">POST /auth</a></td><td>B · TADA → HSB</td><td>Tùy chọn</td></tr><tr><td><a href="#ep-getpoint" class="ref">POST /get-point</a></td><td>B · TADA → HSB</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-redeem" class="ref">POST /redeem-point</a></td><td>B · TADA → HSB</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-topup" class="ref">POST /topup-point</a></td><td>B · TADA → HSB</td><td>Bắt buộc</td></tr>
</table>

<h3>Định danh và đơn vị</h3>
<ul>
  <li>Khách được định danh bằng <code>userId</code> do HSB cung cấp.</li>
  <li><code>cardNumber</code> là credential cố định do TADA cấp, giống nhau ở mọi request; không phải số thẻ của từng khách.</li>
  <li>Số Coin để trừ hoặc hoàn nằm ở <code>convertedAmount</code>; <code>amount</code> là giá trị tiền IDR chỉ để tham khảo. Tỷ giá quy đổi do HSB cấu hình.</li>
  <li>Khóa đối soát và chống lặp là <code>orderReference</code>, nhất quán giữa lần trừ Coin và lần hoàn Coin của cùng một giao dịch.</li>
  <li>Mọi lời gọi từ TADA sang HSB có timeout 3 giây; endpoint của HSB phải phản hồi trong 3 giây.</li>
</ul>
</section><section class="panel" id="flow" role="tabpanel">
<h2>2. Luồng đổi quà</h2>
<p>Sơ đồ dưới đây mô tả toàn bộ một lần đổi quà, từ lúc khách bấm nút đến khi trừ Coin, giao quà và hoàn Coin khi thất bại. Mỗi khối là một giai đoạn; dải nền vàng ở cuối khối là lưu ý hoặc điểm còn mở của giai đoạn đó.</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 0 — Lấy token</div><div class="fd">HSB gọi TADA để lấy Bearer token trước khi gọi SSO. Chiều A.</div></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>HSB gọi <code>POST /v2/catalog/token</code> với client credentials (Basic auth) và tài khoản API (password grant).</td></tr><tr><td class="c">2</td><td>TADA trả về Bearer token kèm thời hạn.</td></tr></table><div class="fnote">Token có thời hạn, gia hạn trượt, không có refresh token. Xin lại khi tới hạn hoặc khi gặp lỗi 401. UAT và Production dùng credentials riêng.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 1 — Mở webview (SSO)</div><div class="fd">HSB gọi TADA để lấy URL mở webview đổi quà. Chiều A.</div></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>Khách bấm nút đổi quà trong app.</td></tr><tr><td class="c">2</td><td>App gọi backend HSB kèm token app của khách; app không gọi thẳng TADA.</td></tr><tr><td class="c">3</td><td>Backend gọi <code>POST /v2/catalog/sso</code> với <code>userId</code>, <code>cardNumber</code>, <code>amount</code>.</td></tr><tr><td class="c">4</td><td>TADA trả về <code>url</code>, <code>token</code> và <code>expiryTime</code> 300 giây.</td></tr><tr><td class="c">5</td><td>Backend trả <code>url</code> về app; app mở webview.</td></tr></table><div class="fnote"><code>cardNumber</code> là credential cố định của TADA, không phải số thẻ từng khách. 300 giây là hạn mở URL; sau khi xác thực, phiên webview sống 24 giờ và khách không bị đăng xuất giữa chừng.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 2 — Hiển thị điểm</div><div class="fd">TADA gọi HSB để lấy số dư Coin hiển thị trên webview. Chiều B. Bắt buộc.</div></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>TADA gọi <code>/auth</code> (nếu HSB bật) để lấy token.</td></tr><tr><td class="c">2</td><td>TADA gọi <code>POST /get-point</code> với <code>userId</code>, <code>cardNumber</code>; HSB trả về số dư.</td></tr></table><div class="fnote"><code>/get-point</code> là bắt buộc. Cả số dư hiển thị lẫn số dư dùng để kiểm tra khi đổi quà đều lấy từ giá trị trả về ở đây.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 3 — Trừ Coin</div><div class="fd">TADA gọi HSB để trừ Coin khi khách đổi quà. Chiều B. Bắt buộc. Timeout 3 giây.</div></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>Khách chọn quà và bấm đổi.</td></tr><tr><td class="c">2</td><td>TADA gọi <code>POST /redeem-point</code> với <code>trxId</code>, <code>convertedAmount</code>, <code>orderReference</code>…</td></tr><tr><td class="c">3</td><td>HSB kiểm tra (đủ Coin, chống lặp theo <code>orderReference</code>) rồi trừ đúng <code>convertedAmount</code>, trả về <code>status</code>.</td></tr><tr><td class="c">4</td><td>TADA tạo order.</td></tr></table><div class="fnote">Phải phản hồi trong 3 giây và chống lặp theo <code>orderReference</code>. Khi từ chối: trả HTTP 200 kèm <code>status</code> failed cho lý do nghiệp vụ, 4xx cho lỗi client, 5xx cho lỗi hệ thống.<br><br><b><span class="pending">PENDING</span> Chạm trường hợp hiếm — câu hỏi #16:</b> nếu HSB đã trừ Coin nhưng phản hồi quá 3 giây, TADA coi là thất bại, không tạo order và không gửi hoàn Coin, dẫn tới khách bị trừ Coin mà không có quà. Đang chờ TADA xác nhận cách xử lý.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 4a — Order thành công</div><div class="fd">TADA giao quà cho khách. Không có lời gọi về HSB.</div></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>TADA giao quà theo loại: e-Voucher, hàng vật lý, PLN, e-Wallet, Pulsa/Data.</td></tr></table><div class="fnote">Với e-Voucher gửi qua email, HSB cần truyền <code>recipient.email</code>. Chi tiết cách truyền đang chờ TADA làm rõ — câu hỏi #18.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 4b — Order thất bại, hoàn Coin</div><div class="fd">TADA gọi HSB để hoàn Coin đã trừ. Chiều B. Bắt buộc.</div></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>TADA gọi <code>POST /topup-point</code> để hoàn Coin.</td></tr><tr><td class="c">2</td><td>HSB đối soát theo <code>orderReference</code> rồi hoàn Coin; lần hoàn trùng coi như đã xong.</td></tr><tr><td class="c">3</td><td>TADA thử lại đúng một lần nếu thất bại; vẫn thất bại thì gửi email cho HSB xử lý tay.</td></tr></table><div class="fnote">Chống lặp theo <code>orderReference</code>: trả success cho lần hoàn trùng, không hoàn hai lần.</div></div></div>
<p class="note">Sau khi đổi quà, khách quay lại giai đoạn tích lũy Coin như bình thường. Chi tiết trường của từng API ở tab <a href="#api" class="ref">API</a>.</p>
</section><section class="panel" id="api" role="tabpanel">
<h2>3. Chi tiết API</h2>
<p>Mỗi khối là một API: dòng tiêu đề là tên API, tiếp theo là thông tin chung và quy tắc, rồi bảng các trường request và response. Tên trường và tên API giữ nguyên tiếng Anh. Giá trị ví dụ là số liệu giả.</p>
<div class="scroll evblock" id="ep-token"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /v2/catalog/token</code><span class="evmeta">A · HSB → TADA · Bắt buộc</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Đường dẫn</dt><dd><code>POST https://api.gift.id/v2/catalog/token</code></dd><dt>Chiều</dt><dd>A · HSB → TADA</dd><dt>Bắt buộc</dt><dd>Bắt buộc</dd><dt>Khái niệm</dt><dd>HSB gọi để lấy Bearer token dùng cho bước SSO. Xác thực bằng client credentials (Basic auth) cộng tài khoản API (password grant).</dd><dt>Quy tắc</dt><dd><ul class="rules"><li>Token có thời hạn, đặt theo từng client (tính bằng ngày). Không có refresh token: HSB lấy token mới bằng cách gọi lại endpoint này.</li><li>Gia hạn trượt: còn hơn 1 giờ thì trả lại chính token cũ và kéo dài hạn; còn dưới 1 giờ hoặc đã hết hạn thì cấp token mới. HSB xin lại khi tới <code>expiredAt</code> hoặc khi gặp lỗi 401.</li><li>UAT và Production dùng credentials riêng, token không dùng chung giữa hai môi trường.</li></ul></dd></dl></td></tr><tr><th>Trường</th><th>Chiều</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>client credentials</code></td><td>request</td><td>Basic auth</td><td>Authorization: Basic …</td><td>Định danh client HSB, do TADA cấp.</td></tr><tr><td><code>API user</code></td><td>request</td><td>password grant</td><td>username + password</td><td>Tài khoản API, do TADA cấp.</td></tr><tr><td><code>token</code></td><td>response</td><td>string</td><td>6jYJW0lS9C…</td><td>Bearer token dùng cho các lời gọi tiếp theo.</td></tr><tr><td><code>tokenType</code></td><td>response</td><td>string</td><td>Bearer</td><td>Loại token.</td></tr><tr><td><code>expiredAt</code></td><td>response</td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>Thời điểm token hết hạn.</td></tr></table></div><div class="scroll evblock" id="ep-sso"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /v2/catalog/sso</code><span class="evmeta">A · HSB → TADA · Bắt buộc</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Đường dẫn</dt><dd><code>POST https://api.gift.id/v2/catalog/sso</code></dd><dt>Chiều</dt><dd>A · HSB → TADA</dd><dt>Bắt buộc</dt><dd>Bắt buộc</dd><dt>Khái niệm</dt><dd>HSB gọi để lấy URL mở webview đổi quà, kèm định danh khách và số Coin hiện tại.</dd><dt>Quy tắc</dt><dd><ul class="rules"><li><code>expiryTime</code> (300 giây) là hạn để MỞ và xác thực URL. Sau khi xác thực thành công, phiên webview sống 24 giờ; khách không bị đăng xuất giữa chừng.</li><li>Lấy URL xong phải mở ngay. Gọi server-to-server từ backend HSB, không gọi thẳng từ app.</li></ul></dd></dl></td></tr><tr><th>Trường</th><th>Chiều</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>userId</code></td><td>request</td><td>string</td><td>john74doe64</td><td>Định danh khách, do HSB cung cấp.</td></tr><tr><td><code>cardNumber</code></td><td>request</td><td>string</td><td>3671618079831369</td><td>Credential cố định do TADA cấp, giống nhau mọi request; không phải số thẻ của từng khách.</td></tr><tr><td><code>amount</code></td><td>request</td><td>number</td><td>500000</td><td>Số Coin hiện tại của khách, để hiển thị ban đầu.</td></tr><tr><td><code>url</code></td><td>response</td><td>string</td><td>https://…usetada.com/authorize?sso=…</td><td>URL mở webview.</td></tr><tr><td><code>token</code></td><td>response</td><td>string</td><td>EA50L62of5…</td><td>SSO token gắn trong URL.</td></tr><tr><td><code>expiryTime</code></td><td>response</td><td>number</td><td>300</td><td>Hạn mở URL, tính bằng giây.</td></tr></table></div><div class="scroll evblock" id="ep-auth"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /auth</code><span class="evmeta">B · TADA → HSB · Tùy chọn</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Đường dẫn</dt><dd><code>POST {HSB base URL}/auth</code></dd><dt>Chiều</dt><dd>B · TADA → HSB</dd><dt>Bắt buộc</dt><dd>Tùy chọn</dd><dt>Khái niệm</dt><dd>TADA đăng nhập vào hệ thống HSB để lấy token, dùng cho ba API chiều B còn lại.</dd><dt>Quy tắc</dt><dd><ul class="rules"><li>Xác thực ở mức dịch vụ (service-level): chỉ chứng minh 'bên gọi đúng là TADA', không phải xác thực từng khách.</li><li>Credential là Terminal ID và Terminal Password do TADA cấp, khác nhau giữa staging và production; một cặp đại diện cho một store.</li></ul></dd></dl></td></tr><tr><th>Trường</th><th>Chiều</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>username</code></td><td>request</td><td>string</td><td>johncatalog7464</td><td>Terminal ID do TADA cấp.</td></tr><tr><td><code>password</code></td><td>request</td><td>string</td><td>9455J05N==</td><td>Terminal Password do TADA cấp.</td></tr><tr><td><code>token</code></td><td>response</td><td>string</td><td>6jYJW0lS9C…</td><td>Token HSB cấp cho TADA.</td></tr><tr><td><code>expiredAt</code></td><td>response</td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>Thời điểm token hết hạn.</td></tr><tr><td><code>expiresIn</code></td><td>response</td><td>number</td><td>86399</td><td>Thời hạn còn lại, tính bằng GIÂY (tài liệu gốc ghi nhầm là millisecond).</td></tr><tr><td><code>tokenType</code></td><td>response</td><td>string</td><td>Bearer</td><td>Loại token.</td></tr></table></div><div class="scroll evblock" id="ep-getpoint"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /get-point</code><span class="evmeta">B · TADA → HSB · Bắt buộc</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Đường dẫn</dt><dd><code>POST {HSB base URL}/get-point</code></dd><dt>Chiều</dt><dd>B · TADA → HSB</dd><dt>Bắt buộc</dt><dd>Bắt buộc</dd><dt>Khái niệm</dt><dd>TADA gọi để lấy số dư Coin của khách, dùng để hiển thị trên webview và để kiểm tra số dư khi khách đổi quà.</dd><dt>Quy tắc</dt><dd><ul class="rules"><li>Bắt buộc. Tài liệu gốc ghi 'optional' là sai; TADA đã đính chính. Nếu HSB không làm endpoint này, TADA không lấy và không hiển thị được số dư.</li><li>Số dư hiển thị và số dư dùng để validate lúc đổi quà đều lấy từ <code>amount</code> trả về ở đây.</li></ul></dd></dl></td></tr><tr><th>Trường</th><th>Chiều</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>userId</code></td><td>request</td><td>string</td><td>671236713598173</td><td>Định danh khách.</td></tr><tr><td><code>cardNumber</code></td><td>request</td><td>string</td><td>6233724664249662</td><td>Credential cố định do TADA cấp.</td></tr><tr><td><code>userId</code></td><td>response</td><td>string</td><td>671236713598173</td><td>Định danh khách (trả lại).</td></tr><tr><td><code>amount</code></td><td>response</td><td>number</td><td>500000</td><td>Số dư Coin hiện tại của khách.</td></tr></table></div><div class="scroll evblock" id="ep-redeem"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /redeem-point</code><span class="evmeta">B · TADA → HSB · Bắt buộc</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Đường dẫn</dt><dd><code>POST {HSB base URL}/redeem-point</code></dd><dt>Chiều</dt><dd>B · TADA → HSB</dd><dt>Bắt buộc</dt><dd>Bắt buộc</dd><dt>Khái niệm</dt><dd>TADA gọi để trừ Coin của khách mỗi khi khách đổi quà. Đây là bước trừ điểm.</dd><dt>Quy tắc</dt><dd><ul class="rules"><li>Trừ đúng <code>convertedAmount</code> (số Coin). <code>amount</code> là giá trị tiền IDR, chỉ để tham khảo. Tỷ giá quy đổi do HSB cấu hình.</li><li>Chống lặp theo <code>orderReference</code>: gọi lại cùng <code>orderReference</code> thì trả lại kết quả cũ, không trừ lần hai.</li><li>Phải phản hồi trong vòng 3 giây.</li><li>Khi từ chối: trả <code>HTTP 200</code> kèm <code>{status:"failed", trxId, message}</code> cho lý do nghiệp vụ (thiếu Coin, không tìm thấy khách); <code>4xx</code> cho lỗi client; <code>5xx</code> cho lỗi hệ thống. Redeem thất bại thì TADA KHÔNG gửi hoàn Coin.</li></ul></dd></dl></td></tr><tr><th>Trường</th><th>Chiều</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>trxId</code></td><td>request</td><td>number</td><td>2147483647</td><td>Mã giao dịch của TADA.</td></tr><tr><td><code>date</code></td><td>request</td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>Thời điểm giao dịch.</td></tr><tr><td><code>userId</code></td><td>request</td><td>string</td><td>671236713598173</td><td>Định danh khách.</td></tr><tr><td><code>amount</code></td><td>request</td><td>number</td><td>150000</td><td>Giá trị tiền IDR, chỉ tham khảo.</td></tr><tr><td><code>convertedAmount</code></td><td>request</td><td>number</td><td>150</td><td>Số Coin HSB phải trừ.</td></tr><tr><td><code>orderReference</code></td><td>request</td><td>string</td><td>CI23062210514901613152</td><td>Khóa đối soát và chống lặp, nhất quán với lần hoàn Coin.</td></tr><tr><td><code>status</code></td><td>response</td><td>string</td><td>success</td><td>Kết quả: success hoặc failed.</td></tr><tr><td><code>trxId</code></td><td>response</td><td>number</td><td>2147483647</td><td>Mã giao dịch (trả lại).</td></tr><tr><td><code>message</code></td><td>response</td><td>string</td><td>insufficient points</td><td>Tùy chọn: lý do từ chối, để TADA ghi log.</td></tr></table></div><div class="scroll evblock" id="ep-topup"><table class="events"><colgroup><col style="width:18%"><col style="width:11%"><col style="width:11%"><col style="width:24%"><col></colgroup><tr class="ev"><td colspan="5"><code class="evname">POST /topup-point</code><span class="evmeta">B · TADA → HSB · Bắt buộc</span></td></tr><tr class="evd"><td colspan="5"><dl><dt>Đường dẫn</dt><dd><code>POST {HSB base URL}/topup-point</code></dd><dt>Chiều</dt><dd>B · TADA → HSB</dd><dt>Bắt buộc</dt><dd>Bắt buộc</dd><dt>Khái niệm</dt><dd>TADA gọi để hoàn Coin cho khách khi một lần đổi quà thất bại sau khi order đã được tạo. Đây là bước hoàn Coin / void.</dd><dt>Quy tắc</dt><dd><ul class="rules"><li>Hoàn đúng <code>convertedAmount</code> cho <code>orderReference</code> tương ứng. Request và response cùng cấu trúc với /redeem-point.</li><li>Chống lặp theo <code>orderReference</code>: lần hoàn trùng <code>orderReference</code> coi như đã xong, trả success, không hoàn hai lần.</li><li>TADA thử lại đúng một lần (tối đa 2 lần gọi, không chờ giữa hai lần). Nếu vẫn thất bại, TADA gửi email cho HSB để xử lý tay.</li></ul></dd></dl></td></tr><tr><th>Trường</th><th>Chiều</th><th>Kiểu</th><th>Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>trxId</code></td><td>request</td><td>number</td><td>2147483647</td><td>Mã giao dịch của TADA.</td></tr><tr><td><code>date</code></td><td>request</td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>Thời điểm giao dịch.</td></tr><tr><td><code>userId</code></td><td>request</td><td>string</td><td>671236713598173</td><td>Định danh khách.</td></tr><tr><td><code>amount</code></td><td>request</td><td>number</td><td>150000</td><td>Giá trị tiền IDR, chỉ tham khảo.</td></tr><tr><td><code>convertedAmount</code></td><td>request</td><td>number</td><td>150</td><td>Số Coin HSB phải hoàn.</td></tr><tr><td><code>orderReference</code></td><td>request</td><td>string</td><td>CI23062210514901613152</td><td>Khóa đối soát, trùng với lần trừ Coin gốc.</td></tr><tr><td><code>status</code></td><td>response</td><td>string</td><td>success</td><td>Kết quả hoàn Coin.</td></tr><tr><td><code>trxId</code></td><td>response</td><td>number</td><td>2147483647</td><td>Mã giao dịch (trả lại).</td></tr></table></div>

<h2>4. Điểm còn mở và lịch sử</h2>

<h3>Câu hỏi còn chờ TADA trả lời</h3>
<p>Ba điểm dưới đây cần TADA trả lời trước khi hoàn thiện spec và code chi tiết phần trừ, hoàn Coin và email.</p>
<table>
  <tr><th style="width:7%">Mã</th><th style="width:26%">Việc</th><th>Nội dung và trạng thái</th></tr>
  <tr><td class="c">#16</td><td>Chạm trường hợp redeem quá 3 giây</td><td>Timeout là 3 giây và TADA không gửi hoàn Coin cho một lần redeem thất bại. Nếu HSB đã trừ Coin nhưng phản hồi quá 3 giây, TADA coi redeem là thất bại, không tạo order và không gửi hoàn Coin, dẫn tới khách bị trừ Coin mà không nhận quà và cũng không được hoàn. Cần TADA xác nhận: có thử lại redeem (idempotent theo <code>orderReference</code>) để order đi tiếp không; nếu không thì xử lý trường hợp trừ-mà-không-có-order ra sao. <span class="pending">PENDING</span></td></tr><tr><td class="c">#17</td><td>Dải IP của môi trường UAT</td><td>TADA đã cung cấp IP production (<code>16.78.195.90/32</code>, <code>16.78.49.52/32</code>). HSB cần thêm dải IP outbound của môi trường UAT/staging để mở allowlist cho môi trường thử nghiệm trước khi go-live. <span class="pending">PENDING</span></td></tr><tr><td class="c">#18</td><td>Truyền recipient.email và Create Order API</td><td>Câu trả lời về email e-Voucher có nhắc tới việc đưa <code>recipient.email</code> vào Create Order API request. Cần làm rõ: Create Order là API HSB phải gọi hay là bước nội bộ của webview TADA; nếu HSB phải cung cấp email thì truyền ở bước nào; và cấu trúc request, response của bước đó. <span class="pending">PENDING</span></td></tr>
</table>

<table>

<script>var TITLES = {"en": "HSB × TADA Redemption – Integration flow", "zh": "HSB × TADA Redemption – 集成流程", "vi": "HSB × TADA Redemption – Luồng tích hợp"};
(function () {
  var app = document.getElementById('app'), sel = document.getElementById('lang');
  var FIRST = 'overview', current = FIRST;
  function show(id, push) {
    app.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById(b.dataset.tab).classList.toggle('on', on);
    });
    current = id;
    if (push) history.replaceState(null, '', '#' + id);
  }
  function go(hash) {
    var el = hash && hash.length > 1 && document.getElementById(hash.slice(1));
    if (!el) return false;
    var panel = el.classList.contains('panel') ? el : el.closest('.panel');
    if (!panel) return false;
    show(panel.id, false);
    if (el !== panel) el.scrollIntoView(); else window.scrollTo(0, 0);
    return true;
  }
  function mount(lang, keepTab) {
    var tpl = document.getElementById('tpl-' + lang) || document.getElementById('tpl-en');
    app.innerHTML = tpl.innerHTML;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.title = TITLES[lang] || TITLES.en;
    sel.value = lang;
    if (keepTab) show(current, false);
    else if (!go(location.hash)) show(FIRST, false);
  }
  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tabs button');
    if (tab) { show(tab.dataset.tab, true); window.scrollTo(0, 0); return; }
    var a = ev.target.closest('a.ref');
    if (a && go(a.getAttribute('href'))) { ev.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); }
  });
  sel.addEventListener('change', function () {
    try { localStorage.setItem('hsb-doc-lang', sel.value); } catch (err) {}
    mount(sel.value, true);
  });
  var saved = null;
  try { saved = localStorage.getItem('hsb-doc-lang'); } catch (err) {}
  mount(saved === 'zh' || saved === 'vi' || saved === 'en' ? saved : 'en', false);
})();
</script>
