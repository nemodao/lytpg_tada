<template id="tpl-vi">
<h1>HSB × TADA Redemption – Luồng tích hợp &amp; Spec</h1>
<p class="sub">Tài liệu tích hợp đổi Coin lấy quà qua webview TADA, kèm spec backend. Cập nhật: 2026-10-17.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. Tổng quan</button><button type="button" role="tab" data-tab="flow" aria-selected="false">2. Luồng</button><button type="button" role="tab" data-tab="api" aria-selected="false">3. API</button><button type="button" role="tab" data-tab="data" aria-selected="false">4. Dữ liệu và Cấu hình</button><button type="button" role="tab" data-tab="open" aria-selected="false">5. Điểm còn mở</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. Tổng quan</h2>
<p>Tài liệu này mô tả luồng tích hợp giữa HSB và TADA để khách đổi Coin lấy quà qua webview của TADA, và là spec để backend HSB dựng các API. HSB là nơi quản lý Coin; TADA cung cấp kho quà và giao diện đổi quà. Nội dung phản ánh các câu trả lời TADA đã xác nhận tính đến ngày 2026-10-17.</p>

<h3>Hai chiều gọi và hai token</h3>
<p>Luồng có hai chiều gọi ngược nhau, mỗi chiều dùng một token riêng; không dùng lẫn giữa hai chiều.</p>
<table>
  <tr><th style="width:24%">Chiều</th><th>Mô tả</th><th style="width:26%">Token</th></tr>
  <tr><td>Chiều A — HSB gọi TADA</td><td>Khi khách bấm đổi quà, HSB lấy token rồi gọi SSO để nhận URL webview.</td><td>TADA cấp cho HSB</td></tr>
  <tr><td>Chiều B — TADA gọi HSB</td><td>Trong lúc khách thao tác trong webview, TADA gọi ngược các API của HSB để lấy số dư, trừ Coin và hoàn Coin.</td><td>HSB cấp cho TADA, qua <code>/auth</code> hoặc static token</td></tr>
</table>
<p>Token đăng nhập app của khách không bao giờ được đưa sang TADA. Việc khách hợp lệ đã được HSB bảo đảm ngay tại bước SSO: khách đăng nhập hợp lệ trong app thì backend HSB mới gọi SSO. Token chiều B chỉ để chứng minh bên gọi đúng là TADA.</p>

<h3>Danh sách API</h3>
<p>Toàn bộ tích hợp gồm 8 API. Chi tiết trường của từng API ở tab <a href="#api" class="ref">API</a>; bấm vào tên API để tới nơi. Ngoài ra còn các API nội bộ app ↔ backend (mở webview, lấy danh sách order) ở nhóm Nội bộ cùng tab này.</p>
<table>
  <tr><th style="width:30%">API</th><th>Vai trò</th><th style="width:16%">Bắt buộc</th></tr>
  <tr><td><a href="#ep-token" class="ref">POST /v2/catalog/token</a></td><td>A · HSB → TADA</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-sso" class="ref">POST /v2/catalog/sso</a></td><td>A · HSB → TADA</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-auth" class="ref">POST /auth</a></td><td>B · TADA → HSB</td><td>Tùy chọn</td></tr><tr><td><a href="#ep-getpoint" class="ref">POST /get-point</a></td><td>B · TADA → HSB</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-redeem" class="ref">POST /redeem-point</a></td><td>B · TADA → HSB</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-topup" class="ref">POST /topup-point</a></td><td>B · TADA → HSB</td><td>Bắt buộc</td></tr><tr><td><a href="#ep-order" class="ref">GET /v2/catalog/orders/{orderNumberorderReference}</a></td><td>A · HSB → TADA</td><td>Tùy chọn · tracking</td></tr><tr><td><a href="#ep-webhook" class="ref">POST {HSB base URL}/webhook</a></td><td>B · TADA → HSB</td><td>Tùy chọn · tracking</td></tr>
</table>

<h3>Định danh, đơn vị và tỉ giá</h3>
<ul>
  <li>Khách được định danh bằng <code>userId</code> = <b>client_id nội bộ của HSB</b> (ví dụ <code>95000056</code>).</li>
  <li><code>cardNumber</code> là credential cố định do TADA cấp, giống nhau ở mọi request; không phải số thẻ của từng khách.</li>
  <li>Số Coin để trừ hoặc hoàn nằm ở <code>convertedAmount</code>; <code>amount</code> là giá trị tiền IDR chỉ để tham khảo.</li>
  <li><b>Redeem rate</b> do HSB cấu hình bên TADA; TADA tự tính <code>convertedAmount</code>. <b>Đã xác nhận: 1 Coin = 100 IDR</b> (vd quà 500.000 IDR → 5.000 Coin). HSB chỉ trừ <code>convertedAmount</code>, không tự quy đổi.</li>
  <li>Khóa đối soát và chống lặp là <code>orderReference</code>, nhất quán giữa lần trừ Coin và lần hoàn Coin của cùng một giao dịch.</li>
  <li>Mọi lời gọi từ TADA sang HSB có timeout 3 giây; endpoint của HSB phải phản hồi trong 3 giây.</li>
  <li><b>Chặn đổi quà:</b> khách nằm trong danh sách chặn (bảng <code>client_promotion_blacklist</code>) sẽ không mở được webview và bị từ chối ở <code>/redeem-point</code>.</li>
</ul>

<h3>Quy trình triển khai với Tada (7 bước)</h3>
<table>
  <tr><th style="width:8%">Bước</th><th>Hoạt động</th><th style="width:20%">PIC</th></tr>
  <tr><td class="c">1</td><td>Họp lấy yêu cầu tích hợp</td><td>Client &amp; Tada</td></tr><tr><td class="c">2</td><td>Tada cấp API documentation + staging credentials</td><td>Tada</td></tr><tr><td class="c">3</td><td>Client dựng API theo tài liệu + tích hợp sang Tada</td><td>Client</td></tr><tr><td class="c">4</td><td>Điền bộ Test Case Catalog Webview Integration (Tada cung cấp)</td><td>Client</td></tr><tr><td class="c">5</td><td>UAT meeting: client chạy journey + test case, Tada soi log</td><td>Client &amp; Tada</td></tr><tr><td class="c">6</td><td>Deposit payment — bắt buộc trước Go Live</td><td>Client</td></tr><tr><td class="c">7</td><td>Go Live: Tada cấp production credentials</td><td>Tada</td></tr>
</table>
</section><section class="panel" id="flow" role="tabpanel">
<h2>2. Luồng đổi quà</h2>
<p>Sơ đồ dưới đây mô tả toàn bộ một lần đổi quà, từ lúc khách bấm nút đến khi trừ Coin, giao quà và hoàn Coin khi thất bại. Mỗi khối là một giai đoạn; dải nền vàng ở cuối khối là lưu ý hoặc điểm còn mở của giai đoạn đó.</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 0 — Lấy token</div><div class="fd">HSB gọi TADA để lấy Bearer token trước khi gọi SSO. Chiều A.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-token">Spec · /v2/catalog/token ▸</button></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>HSB gọi <code>POST /v2/catalog/token</code> (TADA gọi là API Authentication) với client credentials (Basic auth) và tài khoản API (password grant).</td></tr><tr><td class="c">2</td><td>TADA trả về Bearer token kèm thời hạn.</td></tr></table></div><div class="fnote">Token hạn khoảng 1 ngày, phải cache và check `expiredAt`; gọi lại khi hết hạn hoặc gặp 401. UAT và Production dùng credentials riêng.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 1 — Mở webview (SSO)</div><div class="fd">HSB gọi TADA để lấy URL mở webview đổi quà. Chiều A.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="int-webview">Spec · /loyalty/redeem/session ▸</button><button type="button" class="specbtn mini" data-spec="ep-sso">Spec · /v2/catalog/sso ▸</button></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>Khách bấm nút đổi quà trong app.</td></tr><tr><td class="c">2</td><td>App gọi <b>API nội bộ của backend HSB</b> (kèm token app của khách); app không gọi thẳng TADA.</td></tr><tr><td class="c">3</td><td>Backend gọi <code>POST /v2/catalog/sso</code> với <code>userId</code>, <code>cardNumber</code>, <code>amount</code>.</td></tr><tr><td class="c">4</td><td>TADA trả về <code>url</code>, <code>token</code> và <code>expiryTime</code> 300 giây.</td></tr><tr><td class="c">5</td><td>Backend trả <code>url</code> về app; app mở webview.</td></tr></table></div><div class="fnote"><code>cardNumber</code> là credential cố định của TADA, không phải số thẻ từng khách. 300 giây là hạn mở URL; sau khi xác thực, phiên webview sống 24 giờ và khách không bị đăng xuất giữa chừng. HSB chặn khách trong blacklist ngay ở bước này (không mở webview); chốt chặn thật vẫn ở /redeem-point.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 2 — Hiển thị điểm</div><div class="fd">TADA gọi HSB để lấy số dư Coin hiển thị trên webview. Chiều B. Bắt buộc.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-auth">Spec · /auth ▸</button><button type="button" class="specbtn mini" data-spec="ep-getpoint">Spec · /get-point ▸</button></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>TADA gọi <code>/auth</code> (nếu HSB bật) để lấy token; hoặc dùng static token.</td></tr><tr><td class="c">2</td><td>TADA gọi <code>POST /get-point</code> với <code>userId</code>, <code>cardNumber</code>; HSB trả về số dư.</td></tr></table></div><div class="fnote"><code>/get-point</code> là bắt buộc. Cả số dư hiển thị lẫn số dư dùng để kiểm tra khi đổi quà đều lấy từ giá trị trả về ở đây.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 3 — Trừ Coin</div><div class="fd">TADA gọi HSB để trừ Coin khi khách đổi quà. Chiều B. Bắt buộc. Timeout 3 giây.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-redeem">Spec · /redeem-point ▸</button></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>Khách chọn quà và bấm đổi.</td></tr><tr><td class="c">2</td><td>TADA gọi <code>POST /redeem-point</code> với <code>trxId</code>, <code>convertedAmount</code>, <code>orderReference</code>…</td></tr><tr><td class="c">3</td><td>HSB kiểm tra (chống lặp theo <code>orderReference</code>, <b>chặn khách blacklist</b>, đủ Coin) rồi trừ đúng <code>convertedAmount</code> (FIFO theo lot), trả về <code>status</code>.</td></tr><tr><td class="c">4</td><td>TADA tạo order.</td></tr></table></div><div class="fnote">Phải phản hồi trong 3 giây và chống lặp theo <code>orderReference</code>. Khi từ chối: trả HTTP 200 kèm <code>status</code> failed cho lý do nghiệp vụ (thiếu Coin, khách bị blacklist, không tìm thấy khách), 4xx cho lỗi client, 5xx cho lỗi hệ thống.<br><br><b>Ca redeem quá 3 giây:</b> TADA KHÔNG retry redeem và KHÔNG tự gửi void. Nếu HSB đã trừ Coin nhưng phản hồi quá hạn, order không được tạo → khách bị trừ Coin mà không có quà. <b>HSB tự dựng job đối soát #16</b>: gọi <code>Get Order Detail</code> theo <code>orderReference</code>; nếu quá hạn mà TADA trả 404 thực sự (order không tồn tại) thì <b>cảnh báo ops verify rồi hoàn Coin bằng tay</b> — KHÔNG auto hoàn (404 có thể sai khi TADA lỗi API). TADA đã xác nhận có API Get Order Detail (#19). Xem Spec /redeem-point và Get Order Detail ở tab API.</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 4a — Order thành công</div><div class="fd">TADA giao quà cho khách. Không có lời gọi về HSB.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-webhook">Spec · Order Webhook ▸</button><button type="button" class="specbtn mini" data-spec="ep-order">Spec · Get Order Detail ▸</button></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>TADA giao quà theo loại: e-Voucher, hàng vật lý, PLN, e-Wallet, Pulsa/Data.</td></tr></table></div><div class="fnote">Với e-Voucher gửi qua email: <b>khách tự điền email ở bước checkout của TADA</b>; HSB không truyền email và không gọi Create Order. <b>Theo dõi order (#22 đã trả lời):</b> HSB có thể hiển thị trạng thái và chi tiết đơn <b>native ngay trong app</b> qua webhook và Get Order Detail, không bắt khách quay lại webview TADA (xem Spec Order Webhook ở tab API).</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">Giai đoạn 4b — Order thất bại, hoàn Coin</div><div class="fd">TADA gọi HSB để hoàn Coin đã trừ. Chiều B. Bắt buộc.</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-topup">Spec · /topup-point ▸</button></div><table class="fmsg"><tr><th class="c">Bước</th><th>Hành động</th></tr><tr><td class="c">1</td><td>TADA gọi <code>POST /topup-point</code> để hoàn Coin.</td></tr><tr><td class="c">2</td><td>HSB đối soát theo <code>orderReference</code> rồi hoàn Coin; lần hoàn trùng coi như đã xong.</td></tr><tr><td class="c">3</td><td>TADA thử lại đúng một lần nếu thất bại; vẫn thất bại thì gửi email cho HSB xử lý tay.</td></tr></table></div><div class="fnote">Chống lặp theo <code>orderReference</code>: trả success cho lần hoàn trùng, không hoàn hai lần.</div></div></div>
<p class="note">Sau khi đổi quà, khách quay lại giai đoạn tích lũy Coin như bình thường. Chi tiết và việc dev của từng API ở tab <a href="#api" class="ref">API</a> (bấm Spec chi tiết); bảng và cấu hình dùng chung ở tab <a href="#data" class="ref">Dữ liệu và Cấu hình</a>.</p>
</section><section class="panel" id="api" role="tabpanel">
<h2>3. API</h2>
<p>Danh sách API theo chiều gọi. Bấm <b>Spec chi tiết</b> ở mỗi API để xem đủ phần việc của riêng API đó: chuẩn bị, request, HSB xử lý, response, lưu ý. Bảng dùng chung và cấu hình ở tab <a href="#data" class="ref">Dữ liệu &amp; Cấu hình</a>.</p>
<h3>A · HSB gọi TADA</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">Bắt buộc</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="ep-token"><td><code>POST /v2/catalog/token</code></td><td>Bắt buộc</td><td>HSB lấy Bearer token để gọi SSO và Get Order Detail.</td><td><button type="button" class="specbtn" data-spec="ep-token">Spec chi tiết ▸</button></td></tr><tr id="ep-sso"><td><code>POST /v2/catalog/sso</code></td><td>Bắt buộc</td><td>HSB lấy URL mở webview đổi quà.</td><td><button type="button" class="specbtn" data-spec="ep-sso">Spec chi tiết ▸</button></td></tr><tr id="ep-order"><td><code>GET /v2/catalog/orders/{orderNumberorderReference}</code></td><td>Tùy chọn · tracking</td><td>Lấy chi tiết và trạng thái 1 order (theo yêu cầu).</td><td><button type="button" class="specbtn" data-spec="ep-order">Spec chi tiết ▸</button></td></tr></table></div><h3>B · TADA gọi HSB</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">Bắt buộc</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="ep-auth"><td><code>POST /auth</code></td><td>Tùy chọn</td><td>Cấp token service cho Tada (hoặc dùng static token).</td><td><button type="button" class="specbtn" data-spec="ep-auth">Spec chi tiết ▸</button></td></tr><tr id="ep-getpoint"><td><code>POST /get-point</code></td><td>Bắt buộc</td><td>Trả số dư Coin hiện tại của khách.</td><td><button type="button" class="specbtn" data-spec="ep-getpoint">Spec chi tiết ▸</button></td></tr><tr id="ep-redeem"><td><code>POST /redeem-point</code></td><td>Bắt buộc</td><td>Trừ Coin khi khách đổi quà (bước deduct).</td><td><button type="button" class="specbtn" data-spec="ep-redeem">Spec chi tiết ▸</button></td></tr><tr id="ep-topup"><td><code>POST /topup-point</code></td><td>Bắt buộc</td><td>Hoàn Coin khi order thất bại / void.</td><td><button type="button" class="specbtn" data-spec="ep-topup">Spec chi tiết ▸</button></td></tr><tr id="ep-webhook"><td><code>POST {HSB base URL}/webhook</code></td><td>Tùy chọn · tracking</td><td>Nhận cập nhật order từ Tada → sync vào bảng point_redemption_order (backend sync liên tục).</td><td><button type="button" class="specbtn" data-spec="ep-webhook">Spec chi tiết ▸</button></td></tr></table></div><h3>Nội bộ · App ↔ HSB backend</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">Bắt buộc</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="int-webview"><td><code>POST /loyalty/redeem/session</code></td><td>Bắt buộc</td><td>App xin URL mở webview Tada.</td><td><button type="button" class="specbtn" data-spec="int-webview">Spec chi tiết ▸</button></td></tr><tr id="int-orders"><td><code>GET /loyalty/orders</code></td><td>Tùy chọn · tracking</td><td>App lấy danh sách order của khách (từ dữ liệu đã sync).</td><td><button type="button" class="specbtn" data-spec="int-orders">Spec chi tiết ▸</button></td></tr><tr id="int-order-detail" class="rvnew"><td><code>GET /loyalty/orders/{orderReference}</code></td><td>Tùy chọn · tracking</td><td>App lấy chi tiết 1 order cho trang theo dõi.</td><td><button type="button" class="specbtn" data-spec="int-order-detail">Spec chi tiết ▸</button></td></tr><tr id="int-catalog" class="rvnew"><td><code>GET /loyalty/catalog</code></td><td>Tùy chọn</td><td>User đã đăng nhập lấy danh sách quà theo client_group của mình.</td><td><button type="button" class="specbtn" data-spec="int-catalog">Spec chi tiết ▸</button></td></tr><tr id="int-catalog-guest" class="rvnew"><td><code>GET /loyalty/catalog-guest</code></td><td>Tùy chọn · guest</td><td>Danh sách quà nổi bật cho guest (home, chưa đăng nhập).</td><td><button type="button" class="specbtn" data-spec="int-catalog-guest">Spec chi tiết ▸</button></td></tr></table></div>
<div hidden><div class="specsrc" id="spec-ep-token" data-title="POST /v2/catalog/token"><p class="specmeta">A · HSB → TADA · Bắt buộc · <code>POST https://api.gift.id/v2/catalog/token</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/fc415a72b5444-authentication" target="_blank" rel="noopener" class="ref">Tài liệu gốc ↗</a></p><p>HSB gọi để lấy Bearer token dùng cho bước SSO. TADA gọi endpoint này là "API Authentication".</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Config: <code>TADA_TOKEN_URL</code>; Terminal ID/Password + API Key/Secret (Tada cấp sau BRD). Nơi cache token (theo <code>expiredAt</code>). Xem tab <a href="#data" class="ref">Dữ liệu &amp; Cấu hình</a>.</p></div><div class="specsec"><h4>2. Request</h4><p>HSB gọi Tada với Terminal ID/Password + API Key/Secret:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>Terminal ID</code></td><td>string</td><td>…</td><td>Do TADA cấp sau BRD.</td></tr><tr><td><code>Terminal Password</code></td><td>string</td><td>…</td><td>Do TADA cấp sau BRD.</td></tr><tr><td><code>API Key</code></td><td>string</td><td>…</td><td>Do TADA cấp sau BRD.</td></tr><tr><td><code>API Secret</code></td><td>string</td><td>…</td><td>Do TADA cấp sau BRD.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><p>Nhận token → cache tới <code>expiredAt</code> (trừ buffer ~5 phút). Chỉ gọi lại khi hết hạn hoặc gặp <code>401</code>. Lỗi thì retry tối đa 1 lần rồi báo Tada.</p></div><div class="specsec"><h4>4. Response</h4><p>Tada trả về:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>token</code></td><td>string</td><td>6jYJW0lS9C…</td><td>Bearer token dùng cho các lời gọi tiếp theo.</td></tr><tr><td><code>tokenType</code></td><td>string</td><td>Bearer</td><td>Loại token.</td></tr><tr><td><code>expiredAt</code></td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>Thời điểm token hết hạn. Dùng mốc này để tính hạn cache.</td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><p>UAT và Production dùng credentials riêng. Schema chi tiết ở Stoplight (link Tài liệu gốc phía trên).</p></div></div><div class="specsrc" id="spec-ep-sso" data-title="POST /v2/catalog/sso"><p class="specmeta">A · HSB → TADA · Bắt buộc · <code>POST https://api.gift.id/v2/catalog/sso</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/aaa038646e288-tada-catalog-integration-v2" target="_blank" rel="noopener" class="ref">Tài liệu gốc ↗</a></p><p>HSB gọi để lấy URL mở webview đổi quà, kèm định danh khách và số Coin hiện tại.</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Đã có token (token endpoint). Config <code>TADA_CARD_NUMBER</code>. Có luồng xác thực app token của khách.</p></div><div class="specsec"><h4>2. Request</h4><p>HSB gọi Tada, header <code>Authorization: Bearer</code>, body:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Định danh khách = client_id nội bộ của HSB.</td></tr><tr><td><code>cardNumber</code></td><td>string</td><td>3671618079831369</td><td>Credential cố định do TADA cấp, giống nhau mọi request; không phải số thẻ của từng khách.</td></tr><tr><td><code>amount</code></td><td>number</td><td>500000</td><td>Số Coin hiện tại của khách, để hiển thị ban đầu.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><p>Khách bấm Redeem → app gọi API nội bộ <code>/loyalty/redeem/session</code> → backend gọi token + sso → trả <code>url</code> về app. Mở ngay (hạn 300 giây).</p></div><div class="specsec"><h4>4. Response</h4><p>Tada trả về:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>url</code></td><td>string</td><td>https://…usetada.com/authorize?sso=…</td><td>URL mở webview.</td></tr><tr><td><code>token</code></td><td>string</td><td>EA50L62of5…</td><td>SSO token gắn trong URL.</td></tr><tr><td><code>expiryTime</code></td><td>number</td><td>300</td><td>Hạn mở URL, tính bằng giây.</td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><p>Gọi server-to-server; app không gọi thẳng Tada. Sau xác thực, phiên webview sống 24 giờ.</p></div></div><div class="specsrc" id="spec-ep-order" data-title="GET /v2/catalog/orders/{orderNumberorderReference}"><p class="specmeta">A · HSB → TADA · Tùy chọn · tracking · <code>GET https://api.gift.id/v2/catalog/orders/{orderNumberorderReference}</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/a077bf045ddaf-get-order-detail" target="_blank" rel="noopener" class="ref">Tài liệu gốc ↗</a></p><p>HSB gọi để lấy chi tiết và trạng thái một order. Dùng để hiển thị order native trong app và đối soát ca #16 (kiểm order có được tạo không).</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Đã có token. Biết <code>orderReference</code> (có sẵn từ redeem) hoặc <code>orderNumber</code>.</p></div><div class="specsec"><h4>2. Request</h4><p>HSB gọi Tada, path param = <code>orderReference</code> HOẶC <code>orderNumber</code>, header Bearer:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>orderNumberorderReference</code></td><td>string</td><td>TRX90393933 · TADA181029…</td><td>Khóa tra cứu: orderReference HOẶC orderNumber.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds">
  <li>HSB gọi <code>GET …/orders/{order_reference}</code> + header Bearer → nhận order.</li>
  <li><b>Cache:</b> <b>UPSERT</b> <code>point_redemption_order</code> theo <code>order_reference</code> — <code>INSERT … ON DUPLICATE KEY UPDATE</code> status, order_number, order_items, recipient, fees, <code>last_status_at=NOW()</code>, raw_payload. <code>client_id</code> lấy từ <code>point_redemption_transaction</code>. Trả cho app.</li>
  <li class="rvnew"><b>Đối soát #16:</b> job quét redeem <code>status=1, reconciled=0</code> quá <code>RECON_DELAY_MIN</code> (=10') mà CHƯA có order trong <code>point_redemption_order</code> (webhook sync) → gọi <code>Get Order Detail</code>. Chỉ <b>HTTP 404 thực sự</b> mới là <b>orphan</b> (5xx / timeout / exception → retry, giữ <code>reconciled=0</code>). Orphan → <b>raise alert cho ops</b> + set <code>reconciled=1</code> (pending manual) để chu kỳ quét sau KHÔNG alert lại; <b>KHÔNG tự hoàn Coin</b>. Order tồn tại → set <code>reconciled=2</code>. <b>Ops xử dòng <code>reconciled=1</code>:</b> verify với TADA — nếu đúng orphan thì hoàn TAY (<code>point_ledger</code> type=3 + <code>point_lot</code> + <code>point_redemption_transaction.status=2</code>); nếu thực ra có order thì thôi — xong set <code>reconciled=2</code>. (Lý do không auto: 404 có thể sai khi TADA đã tạo order nhưng API lỗi → tránh khách vừa có quà vừa được hoàn Coin.)</li>
  <li>Order tồn tại &amp; <code>failed</code>: không xử ở đây — Tada tự gọi /topup-point.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>Tada trả về (đủ cho UI native):</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>status</code></td><td>string</td><td>new · on process · completed · canceled · failed</td><td>Trạng thái order.</td></tr><tr><td><code>orderReference / orderNumber</code></td><td>string</td><td>WILSONTEST-901… · TO2307…</td><td>Mã đối chiếu và mã order.</td></tr><tr><td><code>recipient</code></td><td>object</td><td>name, email, address, postalCode…</td><td>Người nhận và địa chỉ giao (hàng vật lý).</td></tr><tr><td><code>orderItems</code></td><td>array</td><td>itemType, itemName, price, status, quantity…</td><td>Danh sách quà; status từng item có on courier / completed… để theo dõi giao.</td></tr><tr><td><code>payment</code></td><td>object</td><td>cardNumber, walletName, amount</td><td>Thông tin thanh toán.</td></tr><tr><td><code>fees</code></td><td>array</td><td>SHIPPING_FEE, INSURANCE…</td><td>Các loại phí của order.</td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><p>Keyed cả orderReference lẫn orderNumber nên không phụ thuộc webhook để có orderNumber.</p></div></div><div class="specsrc" id="spec-ep-auth" data-title="POST /auth"><p class="specmeta">B · TADA → HSB · Tùy chọn · <code>POST {HSB base URL}/auth</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">Tài liệu gốc ↗</a></p><p>TADA đăng nhập vào hệ thống HSB để lấy token, dùng cho ba API chiều B còn lại.</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Cấu hình Terminal ID/Password (Tada cấp). Nơi sinh/validate token.</p></div><div class="specsec"><h4>2. Request</h4><p>Tada gọi HSB, body:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>username</code></td><td>string</td><td>johncatalog7464</td><td>Terminal ID do TADA cấp.</td></tr><tr><td><code>password</code></td><td>string</td><td>9455J05N==</td><td>Terminal Password do TADA cấp.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><p>Validate Terminal ID/Password → cấp token (service-level). HOẶC bỏ /auth, cấp cho Tada 1 static lifetime token để nó bỏ vào header 3 API dưới.</p></div><div class="specsec"><h4>4. Response</h4><p>HSB trả về:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>token</code></td><td>string</td><td>6jYJW0lS9C…</td><td>Token HSB cấp cho TADA.</td></tr><tr><td><code>expiredAt</code></td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>Thời điểm token hết hạn (dùng mốc này).</td></tr><tr><td><code>expiresIn</code></td><td>number</td><td>86399</td><td>Thời hạn còn lại. Tài liệu gốc ghi là millisecond nhưng giá trị giống số giây — chưa được Tada xác nhận, nên dùng expiredAt.</td></tr><tr><td><code>tokenType</code></td><td>string</td><td>Bearer</td><td>Loại token.</td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><p>Chỉ chứng minh "caller là Tada", không phải xác thực user. Optional — IP allowlist là lớp chính.</p></div></div><div class="specsrc" id="spec-ep-getpoint" data-title="POST /get-point"><p class="specmeta">B · TADA → HSB · Bắt buộc · <code>POST {HSB base URL}/get-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">Tài liệu gốc ↗</a></p><p>TADA gọi để lấy số dư Coin của khách, dùng để hiển thị trên webview và để kiểm tra số dư khi khách đổi quà.</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Dùng bảng điểm sẵn có <code>point_lot</code> (số dư mỗi lot). Nhận token qua header (từ /auth hoặc static).</p></div><div class="specsec"><h4>2. Request</h4><p>Tada gọi HSB, header Bearer, body:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Định danh khách = client_id HSB.</td></tr><tr><td><code>cardNumber</code></td><td>string</td><td>6233724664249662</td><td>Credential cố định do TADA cấp.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds">
  <li>Validate auth (Bearer header) + IP allowlist.</li>
  <li><b>SELECT (read-only)</b> số dư khả dụng: <code>SELECT SUM(point_balance) FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW()</code>. Không modify, không add row.</li>
  <li>Trả <code>{userId, amount}</code> — <code>amount</code> = tổng số dư khả dụng.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB trả về:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Định danh khách (trả lại).</td></tr><tr><td><code>amount</code></td><td>number</td><td>500000</td><td>Số dư Coin hiện tại của khách.</td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><p>Bắt buộc. Đây là nguồn số dư để Tada hiển thị và validate lúc đổi quà.</p></div></div><div class="specsrc" id="spec-ep-redeem" data-title="POST /redeem-point"><p class="specmeta">B · TADA → HSB · Bắt buộc · <code>POST {HSB base URL}/redeem-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">Tài liệu gốc ↗</a></p><p>TADA gọi để trừ Coin của khách mỗi khi khách đổi quà. Đây là bước trừ điểm.</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Bảng mới <code>point_redemption_transaction</code> (unique <code>order_reference</code>). Biến động Coin ghi ở <code>point_ledger</code>, trừ từ <code>point_lot</code> sẵn có. Chặn khách blacklist bằng bảng <code>client_promotion_blacklist</code>. Config <code>REDEEM_SLA_MS=3000</code>, IP allowlist, token. Xem tab <a href="#data" class="ref">Dữ liệu &amp; Cấu hình</a>.</p></div><div class="specsec"><h4>2. Request</h4><p>Tada gọi HSB, header Bearer, body:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>Mã giao dịch của TADA (lưu để truy vết, không dùng làm khóa).</td></tr><tr><td><code>date</code></td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>Thời điểm giao dịch.</td></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Định danh khách = client_id HSB.</td></tr><tr><td><code>amount</code></td><td>number</td><td>150000</td><td>Giá trị tiền IDR, chỉ tham khảo.</td></tr><tr><td><code>convertedAmount</code></td><td>number</td><td>150</td><td>Số Coin HSB phải trừ.</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>Khóa đối soát và chống lặp, nhất quán với lần hoàn Coin.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds">
  <li>Validate auth + IP + đủ field.</li>
  <li><b>Chống lặp:</b> <code>SELECT * FROM point_redemption_transaction WHERE order_reference=?</code>. Nếu đã có row → trả lại <code>raw_response</code> cũ, KHÔNG trừ lại. Dừng.</li>
  <li class="rvnew"><b>Chặn blacklist:</b> <code>SELECT 1 FROM client_promotion_blacklist WHERE client_id=? AND promo_table='point_redemption_transaction' AND enabled=1 LIMIT 1</code>. Nếu có → trả <code>{status:"failed", trxId, message}</code> (HTTP 200, KHÔNG trừ Coin, <b>KHÔNG ghi bảng</b>). Dừng.</li>
  <li>Mở <b>DB transaction</b>: <ul class="rules">
      <li><b>Lấy &amp; lock lot khả dụng (FIFO):</b> <code>SELECT id, point_balance, cash_value_per_point_unit FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW() ORDER BY point_expiration_time ASC FOR UPDATE</code> (lot hết hạn sớm tiêu trước).</li>
      <li class="rvnew">Nếu <code>SUM(point_balance) &lt; convertedAmount</code> (hoặc client không tồn tại) → ROLLBACK → trả <code>{status:"failed", trxId, message}</code> (KHÔNG trừ Coin, <b>KHÔNG ghi bảng</b>).</li>
      <li>Đủ → <b>INSERT</b> <code>point_redemption_transaction</code> (<code>status=1</code>, external_system='tada', …) → lấy <code>redemption_id = id</code>. Rồi <b>tiêu lần lượt từng lot</b> tới khi đủ convertedAmount, mỗi lot <code>amt = min(lot.point_balance, remaining)</code>: <ul class="rules">
          <li><b>INSERT</b> <code>point_ledger</code> (client_id, <code>source_type='redeem'</code>, <code>type=2</code> CONSUME, <code>point_amount=−amt</code>, <code>lot_id</code>, <code>redemption_id</code>, <code>external_system='tada'</code>, <code>external_id=order_reference</code>, <code>point_balance_before/after</code>, cash_value_per_point_unit).</li>
          <li><b>UPDATE</b> <code>point_lot</code> SET <code>point_balance = point_balance − amt</code> WHERE <code>id=lot.id</code>.</li>
        </ul> </li>
      <li>COMMIT.</li>
    </ul> </li>
  <li>Trả <code>{status:"success", trxId}</code>. <b>Xong &lt;3 giây.</b></li>
  <li><b>Đua song song:</b> UNIQUE <code>order_reference</code> trên <code>point_redemption_transaction</code> chặn request trùng — cái thứ hai dính duplicate-key → trả lại row đã có.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB trả về (đúng format Tada):</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>status</code></td><td>string</td><td>success</td><td>Kết quả: phải đúng chuỗi success hoặc failed.</td></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>Mã giao dịch (trả lại).</td></tr><tr><td><code>message</code></td><td>string</td><td>insufficient points</td><td>Optional, không có trong schema gốc — theo gợi ý của Tada để ghi log; Tada không parse.</td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><p class="rvnew">Trừ <code>convertedAmount</code> (KHÔNG phải amount). Tada coi non-2xx / <code>status:failed</code> / timeout là thất bại và không parse message. Redeem bị từ chối thì <b>KHÔNG ghi bảng</b> (Tada không retry redeem). Nếu trừ mà phản hồi &gt;3s: <b>job đối soát #16</b> (chạy mỗi 15–30 phút + quét lại hằng ngày; <code>RECON_DELAY_MIN=10'</code>) dựa vào <code>point_redemption_order</code>; không có order thì gọi Get Order Detail — chỉ <b>HTTP 404 thực sự</b> mới coi là orphan (5xx/timeout thì retry). Orphan → <b>cảnh báo ops verify + hoàn TAY</b>, KHÔNG auto cộng Coin.</p></div></div><div class="specsrc" id="spec-ep-topup" data-title="POST /topup-point"><p class="specmeta">B · TADA → HSB · Bắt buộc · <code>POST {HSB base URL}/topup-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">Tài liệu gốc ↗</a></p><p>TADA gọi để hoàn Coin cho khách khi một lần đổi quà thất bại sau khi order đã được tạo. Đây là bước hoàn Coin / void.</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Bảng <code>point_redemption_transaction</code> + <code>point_ledger</code> + <code>point_lot</code>. Xem tab <a href="#data" class="ref">Dữ liệu &amp; Cấu hình</a>.</p></div><div class="specsec"><h4>2. Request</h4><p>Tada gọi HSB, header Bearer, body (như /redeem-point):</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>Mã giao dịch của TADA.</td></tr><tr><td><code>date</code></td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>Thời điểm giao dịch.</td></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>Định danh khách = client_id HSB.</td></tr><tr><td><code>amount</code></td><td>number</td><td>150000</td><td>Giá trị tiền IDR, chỉ tham khảo.</td></tr><tr><td><code>convertedAmount</code></td><td>number</td><td>150</td><td>Số Coin HSB phải hoàn.</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>Khóa đối soát, trùng với lần trừ Coin gốc.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds">
  <li>Validate auth + IP + field.</li>
  <li class="rvnew"><b>Chống lặp:</b> <code>SELECT * FROM point_redemption_transaction WHERE order_reference=? FOR UPDATE</code>. Nếu <code>status=2</code> (đã hoàn) → trả success ngay, KHÔNG hoàn lại. Dừng.</li>
  <li class="rvnew">Nếu không có row hoặc <code>status≠1</code> (redeem chưa thành công / đã hoàn) → trả failed + log. Dừng.</li>
  <li>Mở <b>DB transaction</b> — hoàn về đúng lot đã tiêu: <ul class="rules">
      <li>Lấy các dòng CONSUME gốc: <code>SELECT lot_id, point_amount FROM point_ledger WHERE redemption_id=? AND type=2</code>.</li>
      <li>Với mỗi lot (còn hiệu lực): <b>INSERT</b> <code>point_ledger</code> (<code>type=3</code> REFUND, <code>point_amount=+ABS(amt)</code>, lot_id, redemption_id, external_system='tada', external_id=order_reference, snapshot balance); <b>UPDATE</b> <code>point_lot</code> SET <code>point_balance = point_balance + ABS(amt)</code>.</li>
      <li class="rvnew"><b>UPDATE</b> <code>point_redemption_transaction</code> SET <code>status=2</code>, <code>void_trx_id=trxId</code>, <code>void_date=date</code>.</li>
      <li>COMMIT.</li>
    </ul> </li>
  <li>Trả <code>{status:"success", trxId}</code>.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB trả về:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>status</code></td><td>string</td><td>success</td><td>Kết quả hoàn Coin.</td></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>Mã giao dịch (trả lại).</td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><p>Tada retry void đúng 1 lần → phải trả success cho lần trùng, không hoàn 2 lần. Khi order <code>failed</code>, Tada tự động gọi API này. Lot đã hết hạn thì hoàn vào đâu — cần chốt policy (hoàn vào lot mới / cho phép âm / bỏ qua).</p></div></div><div class="specsrc" id="spec-ep-webhook" data-title="POST {HSB base URL}/webhook"><p class="specmeta">B · TADA → HSB · Tùy chọn · tracking · <code>POST {HSB base URL}/webhook</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/b942046a377b0-order" target="_blank" rel="noopener" class="ref">Tài liệu gốc ↗</a></p><p>TADA POST sự kiện order tới endpoint HSB khi tạo order và khi đổi trạng thái, để HSB lưu và cập nhật vào bảng order, phục vụ hiển thị native.</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Dựng 1 endpoint stateless, open-access. Báo Tada URL + event. Tada cấp <b>webhook key</b>. Bảng <code>point_redemption_order</code> (xem tab <a href="#data" class="ref">Dữ liệu &amp; Cấu hình</a>).</p></div><div class="specsec"><h4>2. Request</h4><p>Tada POST tới HSB. Headers: <code>X-TADA-Event</code>, <code>X-TADA-Signature</code>, <code>X-TADA-Delivery</code> (GUID), <code>X-TADA-Attempt</code>. 2 loại event:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>event = order.detail</code></td><td>object</td><td>trxDate, orderReference, orderNumber, status, recipient, payment, orderItems[], fees[]</td><td>Bắn mỗi khi TẠO order. Chi tiết đầy đủ; orderItems gồm egiftDetail (evoucherCode / pin / evoucherLink / expiredDate) và vendorDetail (PLN/pulsa token ở serialNumber / vendorMessage).</td></tr><tr><td><code>event = order.status</code></td><td>object</td><td>data.order{ orderNumber, orderReferance, status, orderItems[]{ itemName, awbNumber, shippingCompany, trackingNumber, vendorMessage } }</td><td>Bắn khi ĐỔI trạng thái order. Gồm tracking vận chuyển (awbNumber, shippingCompany, trackingNumber).</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds">
  <li><b>Validate chữ ký:</b> tính <code>SHA512(X-TADA-Delivery + webhookKey)</code>, so với <code>X-TADA-Signature</code>; sai → bỏ qua.</li>
  <li><b>Dedupe:</b> nếu <code>X-TADA-Delivery</code> đã xử lý → ack 200 và bỏ.</li>
  <li><b>Map chủ:</b> <code>SELECT client_id FROM point_redemption_transaction WHERE order_reference=?</code> (webhook không có userId; redeem đã ghi row trước).</li>
  <li><b>Theo loại event:</b>
    <ul class="rules">
      <li><code>order.detail</code> (tạo order) → <b>UPSERT</b> <code>point_redemption_order</code>: <code>INSERT</code> (order_reference, order_number, client_id, status, order_items [voucher code/PIN, PLN token], recipient, fees, last_status_at=NOW(), raw_payload) <code>ON DUPLICATE KEY UPDATE</code>.</li>
      <li><code>order.status</code> (đổi trạng thái) → <b>UPDATE</b> <code>point_redemption_order</code> SET <code>status</code>, merge tracking (awb/courier/trackingNumber) vào <code>order_items</code>, <code>last_status_at=NOW()</code> WHERE <code>order_reference=?</code> (nhận cả <code>orderReferance</code>).</li>
    </ul>
  </li>
  <li>Trả HTTP 200 ack.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB trả HTTP 200 để ack.</p></div><div class="specsec"><h4>5. Lưu ý</h4><p>Đây là cơ chế <b>backend sync liên tục</b> cho luồng hiển thị order. Order <code>failed</code> không cần xử ở đây (Tada tự gọi /topup-point).</p></div></div><div class="specsrc" id="spec-int-webview" data-title="POST /loyalty/redeem/session"><p class="specmeta">Nội bộ · App → HSB · Bắt buộc · <code>POST {HSB base URL}/loyalty/redeem/session</code></p><p>App gọi backend HSB để lấy URL mở webview Tada (không gọi thẳng Tada).</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Có luồng token + sso (xem các API chiều A). Chặn khách blacklist bằng bảng <code>client_promotion_blacklist</code>.</p></div><div class="specsec"><h4>2. Request</h4><p>App gọi backend HSB, kèm app token của khách:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>Token đăng nhập app của khách.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds">
  <li>Xác thực app token của khách → suy ra <code>client_id</code>.</li>
  <li><b>Chặn blacklist:</b> <code>SELECT 1 FROM client_promotion_blacklist WHERE client_id=? AND promo_table='point_redemption_transaction' AND enabled=1 LIMIT 1</code>. Nếu có → trả lỗi cho app, KHÔNG mở webview. (Chốt chặn thật vẫn ở /redeem-point vì Tada có thể gọi thẳng.)</li>
  <li><b>SELECT (read-only)</b> số dư: <code>SELECT SUM(point_balance) FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW()</code> (gửi <code>amount</code> hiển thị ban đầu); lấy <code>cardNumber</code> từ config.</li>
  <li>Lấy Bearer token (gọi <a href="#ep-token" class="ref">POST /v2/catalog/token</a> nếu cache hết hạn) → gọi <a href="#ep-sso" class="ref">POST /v2/catalog/sso</a> với <code>{userId=client_id, cardNumber, amount}</code> để lấy URL webview.</li>
  <li>Nhận <code>url</code> → trả về app. Không ghi bảng điểm.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>Backend trả về app:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>url</code></td><td>string</td><td>https://…usetada.com/authorize?sso=…</td><td>URL webview trả về cho app mở.</td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><p>Middleware (D1): app không gọi thẳng Tada → không lộ Bearer token Tada và khách không sửa được số Coin gửi đi.</p></div></div><div class="specsrc" id="spec-int-orders" data-title="GET /loyalty/orders"><p class="specmeta">Nội bộ · App → HSB · Tùy chọn · tracking · <code>GET {HSB base URL}/loyalty/orders?clientId=…&amp;page=1&amp;pageSize=20</code></p><p>App gọi backend HSB để lấy danh sách order của khách (đọc từ bảng point_redemption_order đã được webhook sync).</p><div class="specsec"><h4>1. Chuẩn bị</h4><p>Bảng <code>point_redemption_order</code> đã được <b>webhook sync liên tục</b> (xem Order Webhook).</p></div><div class="specsec"><h4>2. Request</h4><p>App gọi backend HSB, kèm app token + clientId:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>clientId</code></td><td>string</td><td>72000123</td><td>Định danh khách. Backend LẤY client_id TỪ TOKEN; nếu query clientId khác token → 403.</td></tr><tr><td><code>page</code></td><td>number</td><td>1</td><td>Trang, bắt đầu từ 1.</td></tr><tr><td><code>pageSize</code></td><td>number</td><td>20</td><td>Số đơn mỗi trang; mặc định 20, tối đa 100.</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>Token đăng nhập app.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds">
  <li>Xác thực app token → <code>client_id</code> (nguồn tin cậy). Nếu query <code>clientId</code> khác <code>client_id</code> của token → <code>403</code>.</li>
  <li><b>SELECT</b> <code>point_redemption_order</code> WHERE <code>client_id=?</code> <code>ORDER BY create_date DESC, id DESC</code> <code>LIMIT pageSize OFFSET (page-1)*pageSize</code> → trả <b>danh sách tóm tắt</b> (orderReference, orderNumber, status, orderDate, firstItemName, coinSpent) + <code>total=COUNT(*)</code>. Sắp mới nhất trước để phân trang ổn định.</li>
  <li class="rvnew">Chi tiết đầy đủ 1 order → dùng endpoint riêng <code>GET /loyalty/orders/{orderReference}</code> (xem bên dưới).</li>
  <li>Read-only. KHÔNG gọi Tada để list.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>Backend trả về app (hợp đồng JSON cố định):</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>result</code></td><td>object</td><td>{ orders[], page, pageSize, total }</td><td>Nằm trong vỏ { success, result }. orders sắp mới nhất trước.</td></tr></table></div><p class="specmeta">Hợp đồng JSON cố định (dev trả đúng shape này):</p><pre class="rvnew">GET /loyalty/orders?clientId=72000123&amp;page=1&amp;pageSize=20  -&gt;  200
{
  "success": true,
  "result": {
    "orders": [
      {
        "orderReference": "CI23062210514901613152",
        "orderNumber": "TADA18102908185099",
        "status": "on process",
        "orderDate": "2023-06-22T10:51:50Z",
        "firstItemName": "Logam Mulia UBS 1 Gram",
        "coinSpent": 150
      }
    ],
    "page": 1, "pageSize": 20, "total": 37
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// page starts at 1; pageSize default 20, max 100
// orders newest-first (ORDER BY create_date DESC, id DESC)
// status: new | on process | completed | canceled | failed
// NO price / fees / IDR in the list</pre></div><div class="specsec"><h4>5. Lưu ý</h4><p>KHÔNG gọi Tada mỗi lần list — dữ liệu đến từ backend sync qua webhook. Tada không có API list order theo userId nên HSB phải tự lưu bảng point_redemption_order.</p></div></div><div class="specsrc" id="spec-int-order-detail" data-title="GET /loyalty/orders/{orderReference}"><p class="specmeta">Nội bộ · App → HSB · Tùy chọn · tracking · <code>GET {HSB base URL}/loyalty/orders/{orderReference}</code></p><p>App lấy CHI TIẾT 1 order để hiển thị trang theo dõi (đọc point_redemption_order + phần Coin ở point_redemption_transaction).</p><div class="specsec"><h4>1. Chuẩn bị</h4><p class="rvnew">Bảng <code>point_redemption_order</code> (webhook sync) + <code>point_redemption_transaction</code> (phần Coin). Chỉ chủ đơn mới xem được.</p></div><div class="specsec"><h4>2. Request</h4><p>App gọi backend HSB, kèm app token; order_reference ở path:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>Mã order cần xem.</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>Token đăng nhập app; BE phải kiểm order thuộc client_id của token, nếu không thì 403.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds rvnew">
  <li>Xác thực app token → <code>client_id</code>.</li>
  <li><b>SELECT</b> <code>point_redemption_order</code> WHERE <code>order_reference=?</code>. <b>Kiểm quyền:</b> <code>order.client_id</code> phải khớp <code>client_id</code> của token, nếu không → <code>403</code>.</li>
  <li>Lấy phần Coin: <b>SELECT</b> <code>coin_amount, redeem_date, status, void_date</code> FROM <code>point_redemption_transaction</code> WHERE <code>order_reference=?</code> (KHÔNG lấy <code>idr_amount</code> cho luồng app).</li>
  <li>Ghép &amp; trả object: header (orderNumber, status, orderDate, lastStatusAt), <code>items[]</code> (tách theo loại: e-voucher code/PIN, token PLN ở serialNumber, tracking vận chuyển — <b>bỏ trường giá</b>), recipient, Coin (coinSpent, refunded khi <code>status=2</code>). <b>Strip toàn bộ giá trị tiền IDR</b> (price của item, fees, idr_amount) trước khi trả. Read-only.</li>
  <li>Nếu cần realtime → gọi <code>Get Order Detail</code> rồi UPSERT lại <code>point_redemption_order</code> trước khi trả.</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>Backend trả object chi tiết (mã nhạy cảm chỉ trả cho chính chủ) — hợp đồng JSON cố định:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>order</code></td><td>object</td><td>orderNumber, status, orderDate, lastStatusAt, coinSpent, items[], recipient</td><td>Chi tiết cho trang track. KHÔNG kèm bất kỳ giá trị tiền IDR nào (amount / price / fees).</td></tr></table></div><p class="specmeta">Hợp đồng JSON cố định (dev trả đúng shape này):</p><pre class="rvnew">GET /loyalty/orders/{orderReference}  -&gt;  200
{
  "success": true,
  "result": {
    "orderReference": "CI23062210514901613152",
    "orderNumber": "TADA18102908185099",
    "status": "on process",
    "orderDate": "2023-06-22T10:51:50Z",
    "lastStatusAt": "2023-06-24T08:18:51Z",
    "coinSpent": 150,
    "refunded": false,
    "items": [
      {
        "name": "Pulsa Telkomsel 50rb",
        "type": "pln",
        "quantity": 1,
        "status": "completed",
        "evoucher": { "code": "ABC123", "pin": "9981", "link": "https://...", "expiredDate": "2024-06-22" },
        "token":    { "serialNumber": "1122-3344-5566", "message": "Token PLN" },
        "tracking": { "awbNumber": "JNE123", "shippingCompany": "JNE", "trackingNumber": "JNE123" }
      }
    ],
    "recipient": { "name": "Jo", "address": "Jl ...", "postalCode": "12374" }
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// status: new | on process | completed | canceled | failed
// type:   egift | physical | pln | pulsa | ewallet | ...
// each item has ONLY ONE of evoucher / token / tracking (by type)
// NEVER include item price / fees / idr_amount (IDR)</pre></div><div class="specsec"><h4>5. Lưu ý</h4><p class="rvnew"><b>TUÂN THỦ — KHÔNG đưa giá trị tiền IDR ra front-end</b> (idr_amount, giá tiền từng item, fees): vi phạm quy định. App chỉ hiển thị Coin; mọi số tiền IDR phải bị strip ở backend trước khi trả. <b>Dữ liệu nhạy cảm</b> (voucher code/PIN, token PLN ở <code>serialNumber</code>) chỉ trả cho chủ đơn; app che sẵn, user bấm mới hiện. <b>Phase 1 chỉ có trạng thái hiện tại</b> (<code>status</code> + <code>last_status_at</code>), chưa có timeline từng bước. Mỗi item chỉ có 1 trong 3 khối e-voucher / token / tracking (render theo <code>itemType</code>). <b>Quy ước cố định của response:</b> key dạng camelCase, ngày ISO-8601 (UTC), <code>status</code>/<code>type</code> theo enum ở ví dụ JSON — dev trả đúng shape này để UI không phải sửa.</p></div></div><div class="specsrc" id="spec-int-catalog" data-title="GET /loyalty/catalog"><p class="specmeta">Nội bộ · App → HSB · Tùy chọn · <code>GET {HSB base URL}/loyalty/catalog?clientId=…</code></p><p>User đã đăng nhập lấy danh sách quà theo client_group THẬT của mình (suy từ crm_customer_base). Cần app token + clientId.</p><div class="specsec"><h4>1. Chuẩn bị</h4><p class="rvnew">Giống <code>/loyalty/catalog-guest</code> nhưng <b>client_group suy từ user</b> (không hardcode): JOIN <code>promo_client_group → point_program → point_featured_gift</code>, nhóm lấy từ <code>crm_customer_base.group_code</code> của <code>clientId</code>. Cần app token.</p></div><div class="specsec"><h4>2. Request</h4><p>App gọi kèm app token + clientId:</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>clientId</code></td><td>string</td><td>72000123</td><td>Định danh khách. client_id lấy từ token; query clientId phải khớp token, sai → 403.</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>Token đăng nhập app.</td></tr></table></div></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds rvnew">
  <li>Validate app token → <code>client_id</code>. Query <code>clientId</code> phải khớp <code>client_id</code> của token, sai → <code>403</code>.</li>
  <li>Lấy quà đang active bằng <b>truy vấn SQL bên dưới</b> — <code>client_group</code> suy từ <code>crm_customer_base</code> theo <code>clientId</code>.</li>
  <li>Map mỗi quà → <code>{ id, name, points, image }</code> (points = Coin; <code>id</code> = <code>point_featured_gift.id</code> nội bộ, KHÔNG phải deep-link TADA). <b>BỎ <code>cash_value</code> (IDR)</b>, <code>external_item_id</code>.</li>
  <li>Read-only.</li>
</ol><pre class="rvnew">SELECT  c.id             AS id,
        c.gift_name      AS name,
        c.point_price    AS points,       -- Coin
        c.gift_image_url AS image
FROM        promo_client_group  AS a
INNER JOIN  point_program        AS b  ON  b.id = a.promo_config_id
INNER JOIN  point_featured_gift  AS c  ON  c.program_id = b.id
WHERE   a.promo_table       = 'point_program'    -- hardcode (gift catalog is always under point_program)
    AND a.enabled           = 1
    AND b.enabled           = 1
    AND c.enabled           = 1
    AND c.show_on_dashboard = 1
    AND (c.display_from IS NULL OR NOW() &gt;= c.display_from)
    AND (c.display_to   IS NULL OR NOW() &lt;  c.display_to)
    AND a.client_group = (
            SELECT group_code
            FROM   crm_customer_base
            WHERE  client_id = :clientId       -- clientId resolved from / checked against the token
        )
ORDER BY c.sort_order ASC, c.point_price ASC;
-- do NOT select cash_value (IDR) or external_item_id</pre></div><div class="specsec"><h4>4. Response</h4><p>Backend trả về app (hợp đồng JSON cố định):</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>result</code></td><td>object</td><td>{ rewards[] }</td><td>Nằm trong vỏ { success, result }. Chỉ Coin; KHÔNG có cash_value / IDR.</td></tr></table></div><p class="specmeta">Hợp đồng JSON cố định (dev trả đúng shape này):</p><pre class="rvnew">GET /loyalty/catalog?clientId=72000123  -&gt;  200
{
  "success": true,
  "result": {
    "rewards": [
      {
        "id": 1,
        "name": "Saldo GoPay Rp50.000",
        "points": 500,
        "image": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png"
      }
    ]
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// gifts via the user's client_group (crm_customer_base.group_code) -&gt; promo_client_group -&gt; point_program -&gt; point_featured_gift
// name is in Indonesian (TADA product name; may include a denomination)
// points = point_price (Coin). NEVER return cash_value / IDR
// id = point_featured_gift.id (internal key; NOT a TADA deep-link)
// UI shows up to 9 rewards (10th tile = "Earn more coins", UI-added)</pre></div><div class="specsec"><h4>5. Lưu ý</h4><p class="rvnew"><b>Khác bản guest:</b> <code>client_group</code> lấy theo user (<code>crm_customer_base</code>), KHÔNG hardcode <code>'direct_client'</code>. <b>TUÂN THỦ:</b> chỉ trả <code>points</code> (Coin); KHÔNG trả <code>cash_value</code> hay IDR. <code>gift_name</code> có thể chứa mệnh giá (tên sản phẩm) — HSB tự quản cột. Danh sách HSB tự tuyển (<code>point_featured_gift</code>); full catalog xem trong webview sau SSO.</p></div></div><div class="specsrc" id="spec-int-catalog-guest" data-title="GET /loyalty/catalog-guest"><p class="specmeta">Nội bộ · App → HSB · Tùy chọn · guest · <code>GET {HSB base URL}/loyalty/catalog-guest</code></p><p>Guest (chưa đăng nhập) lấy danh sách quà nổi bật theo client_group (mặc định 'direct_client') để hiển thị ở home. KHÔNG cần user token.</p><div class="specsec"><h4>1. Chuẩn bị</h4><p class="rvnew">Lấy quà theo <b>client_group</b> (mặc định <code>'direct_client'</code>, hardcode trong code) qua chuỗi JOIN <code>promo_client_group → point_program → point_featured_gift</code> (các bảng SẴN CÓ; HSB tự tuyển, không sync tự động từ TADA). Bảo vệ bằng <b>app-key tĩnh + rate limit</b>, KHÔNG cần user token.</p></div><div class="specsec"><h4>2. Request</h4><p>App gọi ở chế độ guest (không user token, không cần programId), kèm app-key ở header:</p></div><div class="specsec"><h4>3. HSB xử lý</h4><ol class="conds rvnew">
  <li>Validate <b>app-key</b> + rate limit. KHÔNG cần user login, KHÔNG có <code>client_id</code>.</li>
  <li>Lấy quà đang active bằng <b>truy vấn SQL bên dưới</b> — lọc theo <code>client_group='direct_client'</code> (hardcode), chỉ quà <code>enabled</code> và trong cửa sổ hiển thị.</li>
  <li>Map mỗi quà → <code>{ id, name, points, image }</code> (points = Coin; <code>id</code> = <code>point_featured_gift.id</code> nội bộ, KHÔNG phải deep-link TADA). <b>BỎ <code>cash_value</code> (IDR)</b>, <code>external_item_id</code>.</li>
  <li>Read-only, không cá nhân hoá. Bấm redeem từ guest → yêu cầu đăng nhập rồi mới vào luồng webview.</li>
</ol><pre class="rvnew">SELECT  c.id             AS id,
        c.gift_name      AS name,
        c.point_price    AS points,       -- Coin
        c.gift_image_url AS image
FROM        promo_client_group  AS a
INNER JOIN  point_program        AS b  ON  b.id = a.promo_config_id
INNER JOIN  point_featured_gift  AS c  ON  c.program_id = b.id
WHERE   a.promo_table       = 'point_program'    -- hardcode (gift catalog is always under point_program)
    AND a.client_group      = 'direct_client'    -- hardcode (guest default group)
    AND a.enabled           = 1
    AND b.enabled           = 1
    AND c.enabled           = 1
    AND c.show_on_dashboard = 1
    AND (c.display_from IS NULL OR NOW() &gt;= c.display_from)
    AND (c.display_to   IS NULL OR NOW() &lt;  c.display_to)
ORDER BY c.sort_order ASC, c.point_price ASC;
-- do NOT select cash_value (IDR) or external_item_id</pre></div><div class="specsec"><h4>4. Response</h4><p>Backend trả về app (hợp đồng JSON cố định):</p><div class="scroll"><table><tr><th style="width:20%">Trường</th><th style="width:14%">Kiểu</th><th style="width:26%">Ví dụ</th><th>Ý nghĩa</th></tr><tr><td><code>result</code></td><td>object</td><td>{ rewards[] }</td><td>Nằm trong vỏ { success, result }. Chỉ Coin; KHÔNG có cash_value / IDR.</td></tr></table></div><p class="specmeta">Hợp đồng JSON cố định (dev trả đúng shape này):</p><pre class="rvnew">GET /loyalty/catalog  -&gt;  200
{
  "success": true,
  "result": {
    "rewards": [
      {
        "id": 1,
        "name": "Saldo GoPay Rp50.000",
        "points": 500,
        "image": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png"
      }
    ]
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// gifts via client_group='direct_client' (hardcoded) -&gt; promo_client_group -&gt; point_program -&gt; point_featured_gift
// name is in Indonesian (TADA product name; may include a denomination)
// points = point_price (Coin). NEVER return cash_value / IDR
// id = point_featured_gift.id (internal key; NOT a TADA deep-link)
// UI shows up to 9 rewards (10th tile = "Earn more coins", UI-added)
// guest: no client_id, no redeem; tapping redeem -&gt; require login</pre></div><div class="specsec"><h4>5. Lưu ý</h4><p class="rvnew"><b>Guest = chỉ xem.</b> Không số dư, không redeem; thao tác redeem phải gate đăng nhập. <b>TUÂN THỦ:</b> chỉ trả <code>points</code> (Coin); KHÔNG trả <code>cash_value</code> hay bất kỳ giá trị IDR nào. <b>Lưu ý tên quà:</b> <code>gift_name</code> có thể chứa mệnh giá (vd "GoPay Rp50.000") — đây là tên sản phẩm; HSB tự quản cột này nên có thể đặt lại tên nếu quy định yêu cầu ẩn mệnh giá. Danh sách do HSB tự tuyển (không sync tự động từ TADA) — đổi giá/quà bên TADA thì phải cập nhật tay. Muốn xem full catalog → đăng nhập vào webview TADA.</p></div></div></div>
</section><section class="panel" id="data" role="tabpanel">
<h2>4. Dữ liệu và Cấu hình</h2>
<p>Bảng và cấu hình dùng chung cho nhiều API. Popup Spec của từng API ở tab <a href="#api" class="ref">API</a> trỏ về đây.</p>

<h3>4.1 Cấu hình</h3>
<table>
  <tr><th style="width:30%">Config</th><th>Ý nghĩa</th><th style="width:30%">Ghi chú</th></tr>
  <tr><td><code>TADA_TOKEN_URL / SSO_URL / ORDER_URL</code></td><td>Endpoint chiều A (token, sso, get order detail)</td><td>UAT và PROD khác nhau</td></tr><tr><td><code>Terminal ID/Password, API Key/Secret</code></td><td>HSB xác thực để lấy token Tada</td><td>secret, Tada cấp sau BRD</td></tr><tr><td><code>TADA_CARD_NUMBER</code></td><td>Credential cố định dùng ở SSO và get-point</td><td>không phải số thẻ per-user</td></tr><tr><td><code>HSB_SERVICE_TOKEN / HSB_AUTH_USER/PASS</code></td><td>Token/credential HSB cấp cho Tada (chiều B)</td><td>secret</td></tr><tr><td><code>WEBHOOK_KEY</code></td><td>Khóa validate chữ ký Order Webhook</td><td>Tada cấp</td></tr><tr><td><code>REDEEM_RATE</code></td><td>Sanity-check convertedAmount</td><td>1 Coin = 100 IDR (đã xác nhận)</td></tr><tr><td><code>TADA_ALLOWED_IPS</code></td><td>IP outbound Tada để allowlist</td><td>PROD + STAGING; giá trị ở config nội bộ</td></tr><tr><td><code>REDEEM_SLA_MS = 3000</code></td><td>Ngân sách thời gian phản hồi</td><td></td></tr><tr class="rvnew"><td><code>RECON_DELAY_MIN</code></td><td>Độ trễ trước khi job #16 xét orphan</td><td>10 phút; job phát hiện + cảnh báo ops (KHÔNG tự hoàn Coin)</td></tr>
</table>

<h3>4.2 Bảng điểm sẵn có + point_redemption_transaction</h3>
<p><b>Biến động Coin và số dư dùng 2 bảng SẴN CÓ</b> (schema đầy đủ ở Table Document): <code>point_lot</code> — số dư khả dụng mỗi lot (<code>point_balance</code>, <code>point_expiration_time</code>); <code>point_ledger</code> — log biến động (<code>source_type='redeem'</code>, <code>type</code> 2=CONSUME/3=REFUND, <code>point_amount</code>, <code>lot_id</code>, <code>redemption_id</code>, <code>external_system</code>, <code>external_id</code>, snapshot <code>point_balance_before/after</code>).</p>
<p>Bảng MỚI <code>point_redemption_transaction</code> lưu request redeem/void (idempotency theo <code>order_reference</code>, trạng thái, void); <code>point_ledger.redemption_id</code> trỏ về <code>id</code> của nó:</p>
<p class="note">table document on Google Sheet: <a href="https://docs.google.com/spreadsheets/d/1YUNpxDGjTDgPRBuh1rSKOrCXHJk7o-TRWL5goiEmKhM/edit?gid=0#gid=0" target="_blank" rel="noopener" class="ref">Visit Doc ↗</a></p>
<pre class="rvnew">CREATE TABLE point_redemption_transaction (
  id              BIGINT       PRIMARY KEY AUTO_INCREMENT,
  order_reference VARCHAR(64)  NOT NULL UNIQUE,            -- Tada orderReference = idempotency key; = point_ledger.external_id
  external_system VARCHAR(32)  NOT NULL DEFAULT 'tada',    -- external redemption system
  client_id       VARCHAR(32)  NOT NULL,                   -- = userId (crm_customer_base.client_id)
  trx_id          BIGINT       NULL,                       -- Tada trxId of the redeem (tracing only, not the key)
  coin_amount     BIGINT       NOT NULL,                   -- = convertedAmount (Coin deducted)
  idr_amount      BIGINT       NULL,                       -- = amount (IDR, reference only)
  redeem_date     DATETIME(3)  NULL,                       -- date from the redeem request
  status          TINYINT      NOT NULL,                   -- 1 deducted (active) / 2 refunded; rejected redeems are NOT stored
  fail_reason     VARCHAR(255) NULL,                        -- optional note (manual ops / reconciliation remark)
  void_trx_id     BIGINT       NULL,                       -- Tada trxId of the void (when status=2)
  void_date       DATETIME(3)  NULL,
  reconciled      TINYINT      NOT NULL DEFAULT 0,         -- job #16: 0 unreconciled / 1 pending manual (alerted) / 2 reconciled
  raw_request     JSON         NULL,                        -- redeem request payload; set once at INSERT, NOT overwritten by void
  raw_response    JSON         NULL,                        -- redeem response payload; set once at INSERT, NOT overwritten by void
  create_date     DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
  create_user     VARCHAR(64)  NULL,
  update_date     DATETIME(3)  NULL ON UPDATE CURRENT_TIMESTAMP(3),
  update_user     VARCHAR(64)  NULL
);
-- Coin movements &amp; balance live in point_ledger (redemption_id = id) + point_lot (point_balance). No new balance table.</pre>

<h3>4.3 Bảng point_redemption_order</h3>
<p>Bảng MỚI lưu trạng thái và chi tiết order (phía fulfillment), keyed theo <code>order_reference</code>. Order Webhook UPSERT vào đây; Get Order Detail fill thêm khi cần. Dùng bởi Order Webhook và Lấy danh sách order.</p>
<p class="note">table document on Google Sheet: <a href="https://docs.google.com/spreadsheets/d/1Tnp25uYI6zkLqNzgtpbOwlO9zLbshR6pXJHjEOWg514/edit?gid=0#gid=0" target="_blank" rel="noopener" class="ref">Visit Doc ↗</a></p>
<pre>CREATE TABLE point_redemption_order (
  id              BIGINT       PRIMARY KEY AUTO_INCREMENT,
  order_reference VARCHAR(64)  NOT NULL UNIQUE,            -- link point_redemption_transaction.order_reference
  order_number    VARCHAR(64)  NULL,                       -- Tada orderNumber
  client_id       VARCHAR(32)  NOT NULL,                   -- from point_redemption_transaction by order_reference
  status          VARCHAR(20)  NULL,                       -- new / on process / completed / canceled / failed
  order_items     JSON         NULL,                       -- items + egiftDetail (voucher code/PIN) + vendorDetail (PLN token) + tracking (awb/courier)
  recipient       JSON         NULL,                       -- recipient + delivery address
  fees            JSON         NULL,
  last_status_at  DATETIME(3)  NULL,
  raw_payload     JSON         NULL,
  create_date     DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
  create_user     VARCHAR(64)  NULL,
  update_date     DATETIME(3)  NULL ON UPDATE CURRENT_TIMESTAMP(3),
  update_user     VARCHAR(64)  NULL
);</pre>

<h3>4.4 Chặn khách blacklist (client_promotion_blacklist)</h3>
<p>Tái dùng bảng <b>SẴN CÓ</b> <code>client_promotion_blacklist</code> (Point Sys - Global) để chặn 1 khách khỏi tính năng đổi quà, không tạo bảng mới. Unique key của bảng = <code>client_id + promo_table + promo_config_id + point_task_bundle_id</code>.</p>
<p><b>Quy ước 1 dòng chặn redeem:</b></p>
<table>
  <tr><th style="width:34%">Cột</th><th>Giá trị</th></tr>
  <tr><td><code>client_id</code></td><td>client_id của khách bị chặn</td></tr>
  <tr><td><code>promo_table</code></td><td><code>point_redemption_transaction</code> (dùng như cờ "tính năng đổi quà")</td></tr>
  <tr><td><code>promo_config_id</code></td><td><code>0</code> (redeem không có dòng config)</td></tr>
  <tr><td><code>point_task_bundle_id</code></td><td><code>0</code> (redeem không thuộc bundle)</td></tr>
  <tr><td><code>enabled</code></td><td><code>1</code> = blacklist (0 = bỏ chặn)</td></tr>
</table>
<p>Đặt <code>promo_config_id</code>/<code>point_task_bundle_id</code> = <code>0</code> (KHÔNG để NULL — NULL trong unique key của MySQL coi là khác nhau nên sẽ cho insert trùng), giữ đúng "1 khách = 1 dòng chặn redeem". Query kiểm tra ở /redeem-point và /loyalty/redeem/session:</p>
<pre>SELECT 1 FROM client_promotion_blacklist\n WHERE client_id = ?\n   AND promo_table = 'point_redemption_transaction'\n   AND enabled = 1\n LIMIT 1;</pre>

<h3>4.5 Bảo mật (tóm tắt)</h3>
<ul>
  <li><b>IP allowlist</b> ở LB/gateway cho các endpoint chiều B (giá trị IP ở config nội bộ).</li>
  <li><b>Bearer token</b> trên get-point / redeem / topup (qua /auth hoặc static). Không HMAC.</li>
  <li><b>Order Webhook có chữ ký</b>: validate <code>X-TADA-Signature</code> = <code>SHA512(X-TADA-Delivery + webhookKey)</code>.</li>
  <li><b>Không session binding</b> (phương án A).</li>
</ul>

<script>var TITLES = {"en": "HSB × TADA Redemption – Integration & Spec", "zh": "HSB × TADA Redemption – 集成与规格", "vi": "HSB × TADA Redemption – Luồng tích hợp & Spec"};
(function () {
  var app = document.getElementById('app'), sel = document.getElementById('lang');
  var FIRST = 'overview', current = FIRST;
  function show(id, push) {
    app.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById(b.dataset.tab).classList.toggle('on', on);
    });
    current = id;
    if (push) history.replaceState(null, '', '#' + id);
  }
  function go(hash) {
    var el = hash && hash.length > 1 && document.getElementById(hash.slice(1));
    if (!el) return false;
    var panel = el.classList.contains('panel') ? el : el.closest('.panel');
    if (!panel) return false;
    show(panel.id, false);
    if (el !== panel) el.scrollIntoView(); else window.scrollTo(0, 0);
    return true;
  }
  function mount(lang, keepTab) {
    var tpl = document.getElementById('tpl-' + lang) || document.getElementById('tpl-en');
    app.innerHTML = tpl.innerHTML;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.title = TITLES[lang] || TITLES.en;
    sel.value = lang;
    if (keepTab) show(current, false);
    else if (!go(location.hash)) show(FIRST, false);
  }
  function closeModal() { var m = document.getElementById('specmodal'); if (m) m.hidden = true; }
  document.addEventListener('click', function (ev) {
    var sb = ev.target.closest('.specbtn');
    if (sb) {
      var src = document.getElementById('spec-' + sb.dataset.spec);
      if (src) {
        document.getElementById('spec-title').textContent = src.dataset.title || '';
        document.getElementById('spec-body').innerHTML = src.innerHTML;
        document.getElementById('specmodal').hidden = false;
      }
      return;
    }
    if (ev.target.closest('#spec-close')) { closeModal(); return; }
    var tab = ev.target.closest('.tabs button');
    if (tab) { show(tab.dataset.tab, true); window.scrollTo(0, 0); return; }
    var a = ev.target.closest('a.ref');
    if (a && go(a.getAttribute('href'))) { ev.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); closeModal(); }
  });
  sel.addEventListener('change', function () {
    mount(sel.value, true);
  });
  mount('en', false);  // always default to English on load; dropdown still switches within the session
})();
</script>
