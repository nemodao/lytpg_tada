<h1>HSB × TADA Redemption – 集成与规格</h1>
<p class="sub">通过 TADA webview 用 Coin 兑换礼品的集成文档，含后端规格。更新：2026-10-17。</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. 概览</button><button type="button" role="tab" data-tab="flow" aria-selected="false">2. 流程</button><button type="button" role="tab" data-tab="api" aria-selected="false">3. API</button><button type="button" role="tab" data-tab="data" aria-selected="false">4. 数据与配置</button><button type="button" role="tab" data-tab="open" aria-selected="false">5. 待定事项</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>1. 概览</h2>
<p>本文档描述 HSB 与 TADA 之间的集成流程，让客户通过 TADA 的 webview 用 Coin 兑换礼品，并作为 HSB 后端构建各 API 的规格。HSB 负责管理 Coin；TADA 提供礼品库和兑换界面。内容反映截至 2026-10-17 TADA 已确认的答复。</p>

<h3>两个调用方向与两个令牌</h3>
<p>流程有两个相反的调用方向，各自使用独立的令牌；两个方向之间不可混用。</p>
<table>
  <tr><th style="width:24%">方向</th><th>说明</th><th style="width:26%">Token</th></tr>
  <tr><td>方向 A — HSB 调用 TADA</td><td>客户点击兑换时，HSB 先取得令牌，再调用 SSO 获取 webview URL。</td><td>由 TADA 发给 HSB</td></tr>
  <tr><td>方向 B — TADA 调用 HSB</td><td>客户在 webview 操作期间，TADA 反向调用 HSB 的 API 来获取余额、扣减 Coin 和退回 Coin。</td><td>由 HSB 发给 TADA，通过 <code>/auth</code> 或 static token</td></tr>
</table>
<p>客户的 app 登录令牌绝不会传给 TADA。客户的合法性在 SSO 步骤已由 HSB 保证：只有客户在 app 中合法登录后，HSB 后端才会调用 SSO。方向 B 的令牌只用于证明调用方确实是 TADA。</p>

<h3>API 列表</h3>
<p>整个集成共 8 个 API。各 API 的字段明细见 <a href="#api" class="ref">API</a> 标签页；点击 API 名称可跳转。此外还有内部 app ↔ backend 的 API（打开 webview、获取订单列表）在本标签页的「内部」分组中。</p>
<table>
  <tr><th style="width:30%">API</th><th>作用</th><th style="width:16%">必须</th></tr>
  <tr><td><a href="#ep-token" class="ref">POST /v2/catalog/token</a></td><td>A · HSB → TADA</td><td>必须</td></tr><tr><td><a href="#ep-sso" class="ref">POST /v2/catalog/sso</a></td><td>A · HSB → TADA</td><td>必须</td></tr><tr><td><a href="#ep-auth" class="ref">POST /auth</a></td><td>B · TADA → HSB</td><td>可选</td></tr><tr><td><a href="#ep-getpoint" class="ref">POST /get-point</a></td><td>B · TADA → HSB</td><td>必须</td></tr><tr><td><a href="#ep-redeem" class="ref">POST /redeem-point</a></td><td>B · TADA → HSB</td><td>必须</td></tr><tr><td><a href="#ep-topup" class="ref">POST /topup-point</a></td><td>B · TADA → HSB</td><td>必须</td></tr><tr><td><a href="#ep-order" class="ref">GET /v2/catalog/orders/{orderNumberorderReference}</a></td><td>A · HSB → TADA</td><td>可选 · tracking</td></tr><tr><td><a href="#ep-webhook" class="ref">POST {HSB base URL}/webhook</a></td><td>B · TADA → HSB</td><td>可选 · tracking</td></tr>
</table>

<h3>标识、单位与比率</h3>
<ul>
  <li>客户由 <code>userId</code> = <b>HSB 内部 client_id</b> 标识（例如 <code>95000056</code>）。</li>
  <li><code>cardNumber</code> 是 TADA 发放的固定凭据，每次请求都相同；不是每位客户的卡号。</li>
  <li>要扣减或退回的 Coin 数量在 <code>convertedAmount</code>；<code>amount</code> 是 IDR 金额，仅供参考。</li>
  <li><b>Redeem rate</b> 由 HSB 在 TADA 侧配置；TADA 自行计算 <code>convertedAmount</code>。<b>已确认：1 Coin = 100 IDR</b>（例如 500,000 IDR 的礼品 → 5,000 Coin）。HSB 只扣减 <code>convertedAmount</code>，不自行换算。</li>
  <li>对账与去重的键是 <code>orderReference</code>，在同一笔交易的扣减与退回之间保持一致。</li>
  <li>TADA 向 HSB 的每次调用都有 3 秒超时；HSB 的接口必须在 3 秒内响应。</li>
  <li><b>兑换拦截：</b> 在拦截名单（表 <code>client_promotion_blacklist</code>）中的客户无法打开 webview，并在 <code>/redeem-point</code> 被拒绝。</li>
</ul>

<h3>与 Tada 的实施流程（7 步）</h3>
<table>
  <tr><th style="width:8%">步骤</th><th>活动</th><th style="width:20%">PIC</th></tr>
  <tr><td class="c">1</td><td>召开会议收集集成需求</td><td>Client &amp; Tada</td></tr><tr><td class="c">2</td><td>Tada 提供 API 文档 + staging 凭据</td><td>Tada</td></tr><tr><td class="c">3</td><td>客户按文档构建 API 并与 Tada 集成</td><td>Client</td></tr><tr><td class="c">4</td><td>填写 Test Case Catalog Webview Integration（由 Tada 提供）</td><td>Client</td></tr><tr><td class="c">5</td><td>UAT 会议：客户跑通流程 + 测试用例，Tada 检查日志</td><td>Client &amp; Tada</td></tr><tr><td class="c">6</td><td>预付押金 —— 上线前必须完成</td><td>Client</td></tr><tr><td class="c">7</td><td>上线：Tada 提供生产环境凭据</td><td>Tada</td></tr>
</table>
</section><section class="panel" id="flow" role="tabpanel">
<h2>2. 兑换流程</h2>
<p>下图描述一次完整的兑换，从客户点击按钮到扣减 Coin、发放礼品，以及失败时退回 Coin。每个方框是一个阶段；方框底部的黄色条是该阶段的备注或待定事项。</p>
<div class="flowv"><div class="fstage"><div class="fhead"><div class="ft">阶段 0 — 获取令牌</div><div class="fd">HSB 在调用 SSO 之前先调用 TADA 获取 Bearer 令牌。方向 A。</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-token">Spec · /v2/catalog/token ▸</button></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>HSB 用 client credentials（Basic auth）和 API 用户（password grant）调用 <code>POST /v2/catalog/token</code>（TADA 称之为 API Authentication）。</td></tr><tr><td class="c">2</td><td>TADA 返回 Bearer 令牌及其有效期。</td></tr></table></div><div class="fnote">令牌有效期约 1 天；需缓存并检查 `expiredAt`；到期或遇到 401 时重新申请。UAT 与 Production 使用各自的凭据。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 1 — 打开 webview（SSO）</div><div class="fd">HSB 调用 TADA 获取打开兑换 webview 的 URL。方向 A。</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="int-webview">Spec · /loyalty/redeem/session ▸</button><button type="button" class="specbtn mini" data-spec="ep-sso">Spec · /v2/catalog/sso ▸</button></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>客户在 app 中点击兑换按钮。</td></tr><tr><td class="c">2</td><td>app 调用 <b>HSB 后端的内部 API</b>（携带客户的 app 令牌）；app 不直接调用 TADA。</td></tr><tr><td class="c">3</td><td>后端用 <code>userId</code>、<code>cardNumber</code>、<code>amount</code> 调用 <code>POST /v2/catalog/sso</code>。</td></tr><tr><td class="c">4</td><td>TADA 返回 <code>url</code>、<code>token</code> 以及 300 秒的 <code>expiryTime</code>。</td></tr><tr><td class="c">5</td><td>后端把 <code>url</code> 返回给 app；app 打开 webview。</td></tr></table></div><div class="fnote"><code>cardNumber</code> 是 TADA 的固定凭证，而非每位客户的卡号。300 秒是打开 URL 的有效期；通过认证后 webview 会话存活 24 小时，客户中途不会被登出。HSB 在此步骤即拦截黑名单客户（不打开 webview）；真正的拦截仍在 /redeem-point。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 2 — 显示余额</div><div class="fd">TADA 调用 HSB 获取在 webview 上显示的 Coin 余额。方向 B。必须。</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-auth">Spec · /auth ▸</button><button type="button" class="specbtn mini" data-spec="ep-getpoint">Spec · /get-point ▸</button></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>TADA 调用 <code>/auth</code>（若 HSB 启用）获取令牌；或使用 static token。</td></tr><tr><td class="c">2</td><td>TADA 用 <code>userId</code>、<code>cardNumber</code> 调用 <code>POST /get-point</code>；HSB 返回余额。</td></tr></table></div><div class="fnote"><code>/get-point</code> 为必须。显示的余额和兑换时用于校验的余额都取自此处返回的值。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 3 — 扣减 Coin</div><div class="fd">客户兑换时 TADA 调用 HSB 扣减 Coin。方向 B。必须。3 秒超时。</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-redeem">Spec · /redeem-point ▸</button></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>客户选择礼品并点击兑换。</td></tr><tr><td class="c">2</td><td>TADA 用 <code>trxId</code>、<code>convertedAmount</code>、<code>orderReference</code> 调用 <code>POST /redeem-point</code>…</td></tr><tr><td class="c">3</td><td>HSB 检查（按 <code>orderReference</code> 去重、<b>拦截黑名单客户</b>、Coin 是否足够）然后精确扣减 <code>convertedAmount</code>（按 lot FIFO），返回 <code>status</code>。</td></tr><tr><td class="c">4</td><td>TADA 创建订单。</td></tr></table></div><div class="fnote">必须在 3 秒内响应，并按 <code>orderReference</code> 去重。拒绝时：返回 HTTP 200 并带 <code>status</code> failed 表示业务原因（Coin 不足、客户被列入黑名单、找不到客户），4xx 表示客户端错误，5xx 表示系统错误。<br><br><b>Redeem 超过 3 秒：</b> TADA 不会重试 redeem，也不会自行发送 void。如果 HSB 已扣减 Coin 但响应过迟，订单未创建 → 客户被扣 Coin 却没有礼品。<b>HSB 自建对账任务 #16</b>：按 <code>orderReference</code> 调用 <code>Get Order Detail</code>；若超过时限 TADA 返回真正的 404（订单不存在），则<b>提醒 ops 核实后手动退回 Coin</b> — 不自动退回（TADA API 故障时 404 可能有误）。TADA 已确认存在 Get Order Detail API（#19）。详见 API 标签页的 /redeem-point 与 Get Order Detail 规格。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 4a — 订单成功</div><div class="fd">TADA 向客户发放礼品。不回调 HSB。</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-webhook">Spec · Order Webhook ▸</button><button type="button" class="specbtn mini" data-spec="ep-order">Spec · Get Order Detail ▸</button></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>TADA 按类型发放礼品：e-Voucher、实物、PLN、e-Wallet、Pulsa/Data。</td></tr></table></div><div class="fnote">对于通过邮件发送的 e-Voucher：<b>客户在 TADA 结账步骤自行填写邮箱</b>；HSB 不传邮箱，也不调用 Create Order。<b>订单跟踪（#22 已答复）：</b> HSB 可通过 webhook 和 Get Order Detail 在 <b>app 内原生</b> 展示订单状态与详情，无需让客户返回 TADA webview（见 API 标签页的 Order Webhook Spec）。</div></div><div class="down" aria-hidden="true">▼</div><div class="fstage"><div class="fhead"><div class="ft">阶段 4b — 订单失败，退回 Coin</div><div class="fd">TADA 调用 HSB 退回已扣的 Coin。方向 B。必须。</div></div><div class="fbody"><div class="fspec"><button type="button" class="specbtn mini" data-spec="ep-topup">Spec · /topup-point ▸</button></div><table class="fmsg"><tr><th class="c">步骤</th><th>动作</th></tr><tr><td class="c">1</td><td>TADA 调用 <code>POST /topup-point</code> 退回 Coin。</td></tr><tr><td class="c">2</td><td>HSB 按 <code>orderReference</code> 对账后退回 Coin；重复的退回视为已完成。</td></tr><tr><td class="c">3</td><td>失败时 TADA 只重试一次；仍失败则发邮件给 HSB 人工处理。</td></tr></table></div><div class="fnote">按 <code>orderReference</code> 去重：对重复的退回返回 success，不退两次。</div></div></div>
<p class="note">兑换后，客户照常回到累积 Coin 的阶段。各 API 的详情和开发工作见 <a href="#api" class="ref">API</a> 标签页（点击 详细规格）；共用的表和配置见 <a href="#data" class="ref">数据与配置</a> 标签页。</p>
</section><section class="panel" id="api" role="tabpanel">
<h2>3. API</h2>
<p>按调用方向排列的 API 列表。点击每个 API 的 <b>详细规格</b> 查看该 API 的全部工作：准备、request、HSB 处理、response、注意事项。共用的表和配置见 <a href="#data" class="ref">数据与配置</a> 标签页。</p>
<h3>A · HSB 调用 TADA</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">必须</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="ep-token"><td><code>POST /v2/catalog/token</code></td><td>必须</td><td>HSB 获取 Bearer 令牌以调用 SSO 和 Get Order Detail。</td><td><button type="button" class="specbtn" data-spec="ep-token">详细规格 ▸</button></td></tr><tr id="ep-sso"><td><code>POST /v2/catalog/sso</code></td><td>必须</td><td>HSB 获取打开兑换 webview 的 URL。</td><td><button type="button" class="specbtn" data-spec="ep-sso">详细规格 ▸</button></td></tr><tr id="ep-order"><td><code>GET /v2/catalog/orders/{orderNumberorderReference}</code></td><td>可选 · tracking</td><td>按需获取某个订单的详情和状态。</td><td><button type="button" class="specbtn" data-spec="ep-order">详细规格 ▸</button></td></tr></table></div><h3>B · TADA 调用 HSB</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">必须</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="ep-auth"><td><code>POST /auth</code></td><td>可选</td><td>向 Tada 签发服务令牌（或使用 static token）。</td><td><button type="button" class="specbtn" data-spec="ep-auth">详细规格 ▸</button></td></tr><tr id="ep-getpoint"><td><code>POST /get-point</code></td><td>必须</td><td>返回客户当前的 Coin 余额。</td><td><button type="button" class="specbtn" data-spec="ep-getpoint">详细规格 ▸</button></td></tr><tr id="ep-redeem"><td><code>POST /redeem-point</code></td><td>必须</td><td>客户兑换时扣减 Coin（扣减步骤）。</td><td><button type="button" class="specbtn" data-spec="ep-redeem">详细规格 ▸</button></td></tr><tr id="ep-topup"><td><code>POST /topup-point</code></td><td>必须</td><td>订单失败 / void 时退回 Coin。</td><td><button type="button" class="specbtn" data-spec="ep-topup">详细规格 ▸</button></td></tr><tr id="ep-webhook"><td><code>POST {HSB base URL}/webhook</code></td><td>可选 · tracking</td><td>接收来自 Tada 的订单更新 → 同步到表 point_redemption_order（后端持续同步）。</td><td><button type="button" class="specbtn" data-spec="ep-webhook">详细规格 ▸</button></td></tr></table></div><h3>内部 · App ↔ HSB 后端</h3><div class="scroll"><table class="apiidx"><tr><th style="width:27%">API</th><th style="width:12%">必须</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="int-webview"><td><code>POST /loyalty/redeem/session</code></td><td>必须</td><td>app 请求打开 Tada webview 的 URL。</td><td><button type="button" class="specbtn" data-spec="int-webview">详细规格 ▸</button></td></tr><tr id="int-orders"><td><code>GET /loyalty/orders</code></td><td>可选 · tracking</td><td>app 获取客户的订单列表（来自已同步的数据）。</td><td><button type="button" class="specbtn" data-spec="int-orders">详细规格 ▸</button></td></tr><tr id="int-order-detail" class="rvnew"><td><code>GET /loyalty/orders/{orderReference}</code></td><td>可选 · tracking</td><td>App 获取单个 order 的详情用于追踪页面。</td><td><button type="button" class="specbtn" data-spec="int-order-detail">详细规格 ▸</button></td></tr><tr id="int-catalog" class="rvnew"><td><code>GET /loyalty/catalog</code></td><td>可选</td><td>已登录用户按自己的 client_group 获取礼品列表。</td><td><button type="button" class="specbtn" data-spec="int-catalog">详细规格 ▸</button></td></tr><tr id="int-catalog-guest" class="rvnew"><td><code>GET /loyalty/catalog-guest</code></td><td>可选 · guest</td><td>面向 guest 的精选礼品列表（home，未登录）。</td><td><button type="button" class="specbtn" data-spec="int-catalog-guest">详细规格 ▸</button></td></tr></table></div>
<div hidden><div class="specsrc" id="spec-ep-token" data-title="POST /v2/catalog/token"><p class="specmeta">A · HSB → TADA · 必须 · <code>POST https://api.gift.id/v2/catalog/token</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/fc415a72b5444-authentication" target="_blank" rel="noopener" class="ref">原始文档 ↗</a></p><p>HSB 调用此接口获取用于 SSO 步骤的 Bearer 令牌。TADA 称此接口为 "API Authentication"。</p><div class="specsec"><h4>1. 准备</h4><p>配置：<code>TADA_TOKEN_URL</code>；Terminal ID/Password + API Key/Secret（Tada 在 BRD 后提供）。缓存令牌的位置（按 <code>expiredAt</code>）。见 <a href="#data" class="ref">数据与配置</a> 标签页。</p></div><div class="specsec"><h4>2. Request</h4><p>HSB 用 Terminal ID/Password + API Key/Secret 调用 Tada：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>Terminal ID</code></td><td>string</td><td>…</td><td>由 TADA 在 BRD 后提供。</td></tr><tr><td><code>Terminal Password</code></td><td>string</td><td>…</td><td>由 TADA 在 BRD 后提供。</td></tr><tr><td><code>API Key</code></td><td>string</td><td>…</td><td>由 TADA 在 BRD 后提供。</td></tr><tr><td><code>API Secret</code></td><td>string</td><td>…</td><td>由 TADA 在 BRD 后提供。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><p>接收令牌 → 缓存至 <code>expiredAt</code>（减去约 5 分钟缓冲）。仅在到期或遇到 <code>401</code> 时重新请求。出错时最多重试一次，然后通知 Tada。</p></div><div class="specsec"><h4>4. Response</h4><p>Tada 返回：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>token</code></td><td>string</td><td>6jYJW0lS9C…</td><td>用于后续调用的 Bearer 令牌。</td></tr><tr><td><code>tokenType</code></td><td>string</td><td>Bearer</td><td>令牌类型。</td></tr><tr><td><code>expiredAt</code></td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>令牌过期时间。用此时间点计算缓存有效期。</td></tr></table></div></div><div class="specsec"><h4>5. 注意事项</h4><p>UAT 与 Production 使用各自的凭据。详细 schema 见 Stoplight（上方的原始文档链接）。</p></div></div><div class="specsrc" id="spec-ep-sso" data-title="POST /v2/catalog/sso"><p class="specmeta">A · HSB → TADA · 必须 · <code>POST https://api.gift.id/v2/catalog/sso</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/aaa038646e288-tada-catalog-integration-v2" target="_blank" rel="noopener" class="ref">原始文档 ↗</a></p><p>HSB 调用此接口获取打开兑换 webview 的 URL，并附上客户标识和当前 Coin。</p><div class="specsec"><h4>1. 准备</h4><p>已有令牌（token 接口）。配置 <code>TADA_CARD_NUMBER</code>。有验证客户 app 令牌的流程。</p></div><div class="specsec"><h4>2. Request</h4><p>HSB 调用 Tada，header <code>Authorization: Bearer</code>，body：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>客户标识 = HSB 内部 client_id。</td></tr><tr><td><code>cardNumber</code></td><td>string</td><td>3671618079831369</td><td>TADA 发放的固定凭据，每次请求都相同；不是每位客户的卡号。</td></tr><tr><td><code>amount</code></td><td>number</td><td>500000</td><td>客户当前的 Coin，用于初始显示。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><p>客户点击 Redeem → app 调用内部 API <code>/loyalty/redeem/session</code> → 后端调用 token + sso → 把 <code>url</code> 返回 app。立即打开（300 秒时限）。</p></div><div class="specsec"><h4>4. Response</h4><p>Tada 返回：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>url</code></td><td>string</td><td>https://…usetada.com/authorize?sso=…</td><td>打开 webview 的 URL。</td></tr><tr><td><code>token</code></td><td>string</td><td>EA50L62of5…</td><td>嵌入 URL 中的 SSO 令牌。</td></tr><tr><td><code>expiryTime</code></td><td>number</td><td>300</td><td>打开 URL 的时限，以秒计。</td></tr></table></div></div><div class="specsec"><h4>5. 注意事项</h4><p>server-to-server 调用；app 不直接调用 Tada。验证后，webview 会话维持 24 小时。</p></div></div><div class="specsrc" id="spec-ep-order" data-title="GET /v2/catalog/orders/{orderNumberorderReference}"><p class="specmeta">A · HSB → TADA · 可选 · tracking · <code>GET https://api.gift.id/v2/catalog/orders/{orderNumberorderReference}</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/a077bf045ddaf-get-order-detail" target="_blank" rel="noopener" class="ref">原始文档 ↗</a></p><p>HSB 调用此接口获取某个订单的详情和状态。用于在 app 内原生展示订单，以及 #16 对账（检查订单是否已创建）。</p><div class="specsec"><h4>1. 准备</h4><p>已有令牌。知道 <code>orderReference</code>（redeem 已有）或 <code>orderNumber</code>。</p></div><div class="specsec"><h4>2. Request</h4><p>HSB 调用 Tada，path 参数 = <code>orderReference</code> 或 <code>orderNumber</code>，header Bearer：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>orderNumberorderReference</code></td><td>string</td><td>TRX90393933 · TADA181029…</td><td>查询键：orderReference 或 orderNumber。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds">
  <li>HSB 调用 <code>GET …/orders/{order_reference}</code> + Bearer 头 → 获取订单。</li>
  <li><b>缓存：</b> <b>UPSERT</b> <code>point_redemption_order</code> 按 <code>order_reference</code> — <code>INSERT … ON DUPLICATE KEY UPDATE</code> status、order_number、order_items、recipient、fees、<code>last_status_at=NOW()</code>、raw_payload。<code>client_id</code> 取自 <code>point_redemption_transaction</code>。返回给 app。</li>
  <li class="rvnew"><b>对账 #16：</b> 任务扫描 <code>status=1, reconciled=0</code> 且超过 <code>RECON_DELAY_MIN</code>（=10 分钟）但在 <code>point_redemption_order</code>（webhook 同步）中仍没有 order 的 redeem → 调用 <code>Get Order Detail</code>。仅<b>真正的 HTTP 404</b> 才是 <b>orphan</b>（5xx / timeout / exception → 重试，保持 <code>reconciled=0</code>）。遇 orphan → <b>向 ops 发出告警</b> + 设 <code>reconciled=1</code>（pending manual）使下一轮扫描不再重复告警；<b>不自动退回 Coin</b>。order 存在 → 设 <code>reconciled=2</code>。<b>Ops 处理 <code>reconciled=1</code> 的行：</b> 与 TADA 核实 — 若确为 orphan 则手动退回（<code>point_ledger</code> type=3 + <code>point_lot</code> + <code>point_redemption_transaction.status=2</code>）；若实际存在 order 则不处理 — 完成后设 <code>reconciled=2</code>。（为何不自动：TADA 已创建 order 但 API 故障时 404 可能有误 → 避免客户既拿到礼品又被退回 Coin。）</li>
  <li>订单存在且 <code>failed</code>：此处不处理 —— Tada 自行调用 /topup-point。</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>Tada 返回（足够原生 UI 使用）：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>status</code></td><td>string</td><td>new · on process · completed · canceled · failed</td><td>订单状态。</td></tr><tr><td><code>orderReference / orderNumber</code></td><td>string</td><td>WILSONTEST-901… · TO2307…</td><td>对账引用与订单号。</td></tr><tr><td><code>recipient</code></td><td>object</td><td>name, email, address, postalCode…</td><td>收件人与配送地址（实物）。</td></tr><tr><td><code>orderItems</code></td><td>array</td><td>itemType, itemName, price, status, quantity…</td><td>礼品列表；每个 item 的 status 含 on courier / completed… 用于配送跟踪。</td></tr><tr><td><code>payment</code></td><td>object</td><td>cardNumber, walletName, amount</td><td>支付信息。</td></tr><tr><td><code>fees</code></td><td>array</td><td>SHIPPING_FEE, INSURANCE…</td><td>订单的各项费用。</td></tr></table></div></div><div class="specsec"><h4>5. 注意事项</h4><p>同时以 orderReference 和 orderNumber 为键，因此无需依赖 webhook 获取 orderNumber。</p></div></div><div class="specsrc" id="spec-ep-auth" data-title="POST /auth"><p class="specmeta">B · TADA → HSB · 可选 · <code>POST {HSB base URL}/auth</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">原始文档 ↗</a></p><p>TADA 登录 HSB 系统获取令牌，用于其余三个方向 B 的 API。</p><div class="specsec"><h4>1. 准备</h4><p>配置 Terminal ID/Password（Tada 提供）。签发/校验令牌的位置。</p></div><div class="specsec"><h4>2. Request</h4><p>Tada 调用 HSB，body：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>username</code></td><td>string</td><td>johncatalog7464</td><td>由 TADA 发放的 Terminal ID。</td></tr><tr><td><code>password</code></td><td>string</td><td>9455J05N==</td><td>由 TADA 发放的 Terminal Password。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><p>校验 Terminal ID/Password → 签发令牌（服务级）。或不做 /auth，给 Tada 一个 static lifetime token，放入下面三个 API 的 header。</p></div><div class="specsec"><h4>4. Response</h4><p>HSB 返回：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>token</code></td><td>string</td><td>6jYJW0lS9C…</td><td>HSB 发给 TADA 的令牌。</td></tr><tr><td><code>expiredAt</code></td><td>datetime</td><td>2021-05-20T04:13:16.269Z</td><td>令牌过期时间（用此时间点）。</td></tr><tr><td><code>expiresIn</code></td><td>number</td><td>86399</td><td>剩余有效期。原文档写的是毫秒，但数值看起来像秒 —— 未经 Tada 确认，因此使用 expiredAt。</td></tr><tr><td><code>tokenType</code></td><td>string</td><td>Bearer</td><td>令牌类型。</td></tr></table></div></div><div class="specsec"><h4>5. 注意事项</h4><p>只证明“调用方是 Tada”，而非逐用户验证。可选 —— IP allowlist 是主要防线。</p></div></div><div class="specsrc" id="spec-ep-getpoint" data-title="POST /get-point"><p class="specmeta">B · TADA → HSB · 必须 · <code>POST {HSB base URL}/get-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">原始文档 ↗</a></p><p>TADA 调用此接口获取客户的 Coin 余额，用于在 webview 显示以及客户兑换时校验余额。</p><div class="specsec"><h4>1. 准备</h4><p>使用现有积分表 <code>point_lot</code>（每个 lot 的余额）。通过 header 获取 token（来自 /auth 或 static）。</p></div><div class="specsec"><h4>2. Request</h4><p>Tada 调用 HSB，header Bearer，body：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>客户标识 = HSB client_id。</td></tr><tr><td><code>cardNumber</code></td><td>string</td><td>6233724664249662</td><td>TADA 发放的固定凭据。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds">
  <li>Validate auth (Bearer header) + IP allowlist.</li>
  <li><b>SELECT（只读）</b> 可用余额：<code>SELECT SUM(point_balance) FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW()</code>。不修改，不新增行。</li>
  <li>返回 <code>{userId, amount}</code> — <code>amount</code> = 总可用余额。</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB 返回：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>客户标识（回传）。</td></tr><tr><td><code>amount</code></td><td>number</td><td>500000</td><td>客户当前的 Coin 余额。</td></tr></table></div></div><div class="specsec"><h4>5. 注意事项</h4><p>必须。这是 Tada 用于显示和兑换时校验的余额来源。</p></div></div><div class="specsrc" id="spec-ep-redeem" data-title="POST /redeem-point"><p class="specmeta">B · TADA → HSB · 必须 · <code>POST {HSB base URL}/redeem-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">原始文档 ↗</a></p><p>每次客户兑换时 TADA 调用此接口扣减客户的 Coin。这是扣减步骤。</p><div class="specsec"><h4>1. 准备</h4><p>新表 <code>point_redemption_transaction</code>（唯一 <code>order_reference</code>）。Coin 变动记录在 <code>point_ledger</code>，从现有 <code>point_lot</code> 扣减。通过表 <code>client_promotion_blacklist</code> 拦截黑名单客户。配置 <code>REDEEM_SLA_MS=3000</code>、IP 白名单、token。见标签页 <a href="#data" class="ref">数据与配置</a>。</p></div><div class="specsec"><h4>2. Request</h4><p>Tada 调用 HSB，header Bearer，body：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>TADA 的交易号（存储用于追溯，不作为键）。</td></tr><tr><td><code>date</code></td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>交易时间。</td></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>客户标识 = HSB client_id。</td></tr><tr><td><code>amount</code></td><td>number</td><td>150000</td><td>IDR 金额，仅供参考。</td></tr><tr><td><code>convertedAmount</code></td><td>number</td><td>150</td><td>HSB 需扣减的 Coin 数量。</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>对账与去重的键，与退回保持一致。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds">
  <li>校验 auth + IP + 必填字段。</li>
  <li><b>防重复：</b> <code>SELECT * FROM point_redemption_transaction WHERE order_reference=?</code>。若已存在行 → 返回旧的 <code>raw_response</code>，不再扣减。停止。</li>
  <li class="rvnew"><b>黑名单拦截：</b> <code>SELECT 1 FROM client_promotion_blacklist WHERE client_id=? AND promo_table='point_redemption_transaction' AND enabled=1 LIMIT 1</code>。若命中 → 返回 <code>{status:"failed", trxId, message}</code>（HTTP 200，不扣 Coin，<b>不写入表</b>）。停止。</li>
  <li>开启 <b>DB 事务</b>：<ul class="rules">
      <li><b>获取并锁定可用 lot（FIFO）：</b> <code>SELECT id, point_balance, cash_value_per_point_unit FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW() ORDER BY point_expiration_time ASC FOR UPDATE</code>（最早到期的 lot 先消耗）。</li>
      <li class="rvnew">若 <code>SUM(point_balance) &lt; convertedAmount</code>（或该 client 不存在）→ ROLLBACK → 返回 <code>{status:"failed", trxId, message}</code>（不扣 Coin，<b>不写入表</b>）。</li>
      <li>足够 → <b>INSERT</b> <code>point_redemption_transaction</code>（<code>status=1</code>、external_system='tada'、…）→ 取得 <code>redemption_id = id</code>。然后 <b>逐个 lot 消耗</b> 直到满足 convertedAmount，每个 lot <code>amt = min(lot.point_balance, remaining)</code>：<ul class="rules">
          <li><b>INSERT</b> <code>point_ledger</code> (client_id, <code>source_type='redeem'</code>, <code>type=2</code> CONSUME, <code>point_amount=−amt</code>, <code>lot_id</code>, <code>redemption_id</code>, <code>external_system='tada'</code>, <code>external_id=order_reference</code>, <code>point_balance_before/after</code>, cash_value_per_point_unit).</li>
          <li><b>UPDATE</b> <code>point_lot</code> SET <code>point_balance = point_balance − amt</code> WHERE <code>id=lot.id</code>.</li>
        </ul> </li>
      <li>COMMIT.</li>
    </ul> </li>
  <li>返回 <code>{status:"success", trxId}</code>。<b>3 秒内完成。</b></li>
  <li><b>并发竞争：</b> <code>point_redemption_transaction</code> 上的 UNIQUE <code>order_reference</code> 阻止重复请求 — 第二个触发 duplicate-key → 返回已有行。</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB 返回（符合 Tada 格式）：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>status</code></td><td>string</td><td>success</td><td>结果：必须是字符串 success 或 failed。</td></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>交易号（回传）。</td></tr><tr><td><code>message</code></td><td>string</td><td>insufficient points</td><td>可选，原 schema 中没有 —— 按 Tada 建议用于日志；Tada 不解析。</td></tr></table></div></div><div class="specsec"><h4>5. 注意事项</h4><p class="rvnew">扣减 <code>convertedAmount</code>（不是 amount）。Tada 将 non-2xx / <code>status:failed</code> / 超时视为失败，且不解析 message。被拒绝的 redeem <b>不写入表</b>（Tada 不重试 redeem）。若已扣 Coin 但响应超过 3 秒：<b>对账任务 #16</b>（每 15–30 分钟运行 + 每日全量扫描；<code>RECON_DELAY_MIN=10'</code>）依赖 <code>point_redemption_order</code>；若没有 order 则调用 Get Order Detail — 仅<b>真正的 HTTP 404</b> 才算 orphan（5xx/timeout → 重试）。遇 orphan → <b>提醒 ops 核实 + 手动退回</b>，不自动补 Coin。</p></div></div><div class="specsrc" id="spec-ep-topup" data-title="POST /topup-point"><p class="specmeta">B · TADA → HSB · 必须 · <code>POST {HSB base URL}/topup-point</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/d00f129256f1e-webview-client-api-schema" target="_blank" rel="noopener" class="ref">原始文档 ↗</a></p><p>当订单已创建但兑换失败时，TADA 调用此接口为客户退回 Coin。这是退回 / void 步骤。</p><div class="specsec"><h4>1. 准备</h4><p>表 <code>point_redemption_transaction</code> + <code>point_ledger</code> + <code>point_lot</code>。见标签页 <a href="#data" class="ref">数据与配置</a>。</p></div><div class="specsec"><h4>2. Request</h4><p>Tada 调用 HSB，header Bearer，body（同 /redeem-point）：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>TADA 的交易号。</td></tr><tr><td><code>date</code></td><td>datetime</td><td>2023-06-22T10:51:50.609Z</td><td>交易时间。</td></tr><tr><td><code>userId</code></td><td>string</td><td>95000056</td><td>客户标识 = HSB client_id。</td></tr><tr><td><code>amount</code></td><td>number</td><td>150000</td><td>IDR 金额，仅供参考。</td></tr><tr><td><code>convertedAmount</code></td><td>number</td><td>150</td><td>HSB 需退回的 Coin 数量。</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>对账键，与原始扣减一致。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds">
  <li>Validate auth + IP + field.</li>
  <li class="rvnew"><b>防重复：</b> <code>SELECT * FROM point_redemption_transaction WHERE order_reference=? FOR UPDATE</code>。若 <code>status=2</code>（已退回）→ 立即返回 success，不再退回。停止。</li>
  <li class="rvnew">若没有行或 <code>status≠1</code>（redeem 未成功 / 已退回）→ 返回 failed + 记录日志。停止。</li>
  <li>开启 <b>DB transaction</b> — 退回到被消耗的那些 lot：<ul class="rules">
      <li>获取原始 CONSUME 行：<code>SELECT lot_id, point_amount FROM point_ledger WHERE redemption_id=? AND type=2</code>。</li>
      <li>对每个 lot（仍有效）：<b>INSERT</b> <code>point_ledger</code>（<code>type=3</code> REFUND、<code>point_amount=+ABS(amt)</code>、lot_id、redemption_id、external_system='tada'、external_id=order_reference、快照 balance）；<b>UPDATE</b> <code>point_lot</code> SET <code>point_balance = point_balance + ABS(amt)</code>。</li>
      <li class="rvnew"><b>UPDATE</b> <code>point_redemption_transaction</code> SET <code>status=2</code>, <code>void_trx_id=trxId</code>, <code>void_date=date</code>.</li>
      <li>COMMIT.</li>
    </ul> </li>
  <li>返回 <code>{status:"success", trxId}</code>。</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB 返回：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>status</code></td><td>string</td><td>success</td><td>退回结果。</td></tr><tr><td><code>trxId</code></td><td>number</td><td>2147483647</td><td>交易号（回传）。</td></tr></table></div></div><div class="specsec"><h4>5. 注意事项</h4><p>Tada 对 void 恰好重试 1 次 → 对重复必须返回 success，不得退回两次。当订单 <code>failed</code> 时，Tada 自动调用此 API。lot 已过期时退回到哪里 — 需确定策略（退入新 lot / 允许为负 / 跳过）。</p></div></div><div class="specsrc" id="spec-ep-webhook" data-title="POST {HSB base URL}/webhook"><p class="specmeta">B · TADA → HSB · 可选 · tracking · <code>POST {HSB base URL}/webhook</code> · <a href="https://tada.stoplight.io/docs/catalog-integration-api/b942046a377b0-order" target="_blank" rel="noopener" class="ref">原始文档 ↗</a></p><p>当订单创建及其状态变更时，TADA 向 HSB 的端点 POST 订单事件，以便 HSB 存入并更新其订单表，用于原生展示。</p><div class="specsec"><h4>1. 准备</h4><p>搭建一个无状态、开放访问的端点。告知 Tada URL + 事件。Tada 提供 <b>webhook key</b>。表 <code>point_redemption_order</code>（见 <a href="#data" class="ref">数据与配置</a> 标签页）。</p></div><div class="specsec"><h4>2. Request</h4><p>Tada 向 HSB POST。Headers：<code>X-TADA-Event</code>、<code>X-TADA-Signature</code>、<code>X-TADA-Delivery</code>（GUID）、<code>X-TADA-Attempt</code>。两种事件：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>event = order.detail</code></td><td>object</td><td>trxDate, orderReference, orderNumber, status, recipient, payment, orderItems[], fees[]</td><td>每当创建订单时触发。详情完整；orderItems 含 egiftDetail（evoucherCode / pin / evoucherLink / expiredDate）和 vendorDetail（PLN/pulsa token 在 serialNumber / vendorMessage）。</td></tr><tr><td><code>event = order.status</code></td><td>object</td><td>data.order{ orderNumber, orderReferance, status, orderItems[]{ itemName, awbNumber, shippingCompany, trackingNumber, vendorMessage } }</td><td>当订单状态变更时触发。含配送跟踪（awbNumber、shippingCompany、trackingNumber）。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds">
  <li><b>校验签名：</b> 计算 <code>SHA512(X-TADA-Delivery + webhookKey)</code>，与 <code>X-TADA-Signature</code> 比较；不符 → 忽略。</li>
  <li><b>去重：</b> 若 <code>X-TADA-Delivery</code> 已处理 → ack 200 并丢弃。</li>
  <li><b>映射归属：</b> <code>SELECT client_id FROM point_redemption_transaction WHERE order_reference=?</code>（webhook 没有 userId；redeem 先前已写入该行）。</li>
  <li><b>按事件类型：</b>
    <ul class="rules">
      <li><code>order.detail</code>（创建订单）→ <b>UPSERT</b> <code>point_redemption_order</code>：<code>INSERT</code>（order_reference、order_number、client_id、status、order_items [voucher code/PIN、PLN token]、recipient、fees、last_status_at=NOW()、raw_payload）<code>ON DUPLICATE KEY UPDATE</code>。</li>
      <li><code>order.status</code>（状态变更）→ <b>UPDATE</b> <code>point_redemption_order</code> SET <code>status</code>，把 tracking（awb/courier/trackingNumber）merge 进 <code>order_items</code>，<code>last_status_at=NOW()</code> WHERE <code>order_reference=?</code>（也接受 <code>orderReferance</code>）。</li>
    </ul>
  </li>
  <li>返回 HTTP 200 ack。</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>HSB 返回 HTTP 200 以确认。</p></div><div class="specsec"><h4>5. 注意事项</h4><p>这是订单展示流程的 <b>后端持续同步</b> 机制。<code>failed</code> 的订单无需在此处理（Tada 自行调用 /topup-point）。</p></div></div><div class="specsrc" id="spec-int-webview" data-title="POST /loyalty/redeem/session"><p class="specmeta">内部 · App → HSB · 必须 · <code>POST {HSB base URL}/loyalty/redeem/session</code></p><p>app 调用 HSB 后端获取打开 Tada webview 的 URL（不直接调用 Tada）。</p><div class="specsec"><h4>1. 准备</h4><p>具备 token + sso 流程（见 A 方向的 API）。通过表 <code>client_promotion_blacklist</code> 拦截黑名单客户。</p></div><div class="specsec"><h4>2. Request</h4><p>app 调用 HSB 后端，携带客户的 app 令牌：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>客户的 app 登录令牌。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds">
  <li>验证客户的 app 令牌 → 得出 <code>client_id</code>。</li>
  <li><b>黑名单拦截：</b> <code>SELECT 1 FROM client_promotion_blacklist WHERE client_id=? AND promo_table='point_redemption_transaction' AND enabled=1 LIMIT 1</code>。若命中 → 向 app 返回错误，不打开 webview。（真正的拦截仍在 /redeem-point，因为 Tada 可直接调用。）</li>
  <li><b>SELECT（只读）</b> 余额：<code>SELECT SUM(point_balance) FROM point_lot WHERE client_id=? AND point_balance&gt;0 AND point_expiration_time&gt;NOW()</code>（发送初始显示的 <code>amount</code>）；从 config 取 <code>cardNumber</code>。</li>
  <li>获取 Bearer token（若缓存已过期则调用 <a href="#ep-token" class="ref">POST /v2/catalog/token</a>）→ 使用 <code>{userId=client_id, cardNumber, amount}</code> 调用 <a href="#ep-sso" class="ref">POST /v2/catalog/sso</a> 以获取 webview URL。</li>
  <li>获取 <code>url</code> → 返回给 app。不写入积分表。</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>后端返回 app：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>url</code></td><td>string</td><td>https://…usetada.com/authorize?sso=…</td><td>返回给 app 打开的 webview URL。</td></tr></table></div></div><div class="specsec"><h4>5. 注意事项</h4><p>中间层（D1）：app 不直接调用 Tada → 不泄露 Tada 的 Bearer 令牌，客户也无法篡改发送的 Coin 数量。</p></div></div><div class="specsrc" id="spec-int-orders" data-title="GET /loyalty/orders"><p class="specmeta">内部 · App → HSB · 可选 · tracking · <code>GET {HSB base URL}/loyalty/orders?clientId=…&amp;page=1&amp;pageSize=20</code></p><p>App 调用 HSB backend 获取客户的订单列表（从 webhook 已同步的表 point_redemption_order 读取）。</p><div class="specsec"><h4>1. 准备</h4><p>表 <code>point_redemption_order</code> 由 <b>webhook 持续同步</b>（见 Order Webhook）。</p></div><div class="specsec"><h4>2. Request</h4><p>app 调用 HSB 后端，携带 app 令牌 + clientId：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>clientId</code></td><td>string</td><td>72000123</td><td>客户标识。后端从 TOKEN 推导 client_id；若 query clientId 与 token 不一致 → 403。</td></tr><tr><td><code>page</code></td><td>number</td><td>1</td><td>页码，从 1 开始。</td></tr><tr><td><code>pageSize</code></td><td>number</td><td>20</td><td>每页订单数；默认 20，最多 100。</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>app 登录令牌。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds">
  <li>校验 app token → <code>client_id</code>（可信来源）。若 query <code>clientId</code> 与 token 的 <code>client_id</code> 不一致 → <code>403</code>。</li>
  <li><b>SELECT</b> <code>point_redemption_order</code> WHERE <code>client_id=?</code> <code>ORDER BY create_date DESC, id DESC</code> <code>LIMIT pageSize OFFSET (page-1)*pageSize</code> → 返回<b>摘要列表</b>（orderReference、orderNumber、status、orderDate、firstItemName、coinSpent）+ <code>total=COUNT(*)</code>。最新在前，保证分页稳定。</li>
  <li class="rvnew">单个 order 的完整详情 → 使用专用 endpoint <code>GET /loyalty/orders/{orderReference}</code>（见下文）。</li>
  <li>只读。列表时不调用 Tada。</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>后端返回给 app（固定 JSON 契约）：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>result</code></td><td>object</td><td>{ orders[], page, pageSize, total }</td><td>包裹在 { success, result } 中。orders 最新在前。</td></tr></table></div><p class="specmeta">固定 JSON 契约（dev 必须返回此结构）：</p><pre class="rvnew">GET /loyalty/orders?clientId=72000123&amp;page=1&amp;pageSize=20  -&gt;  200
{
  "success": true,
  "result": {
    "orders": [
      {
        "orderReference": "CI23062210514901613152",
        "orderNumber": "TADA18102908185099",
        "status": "on process",
        "orderDate": "2023-06-22T10:51:50Z",
        "firstItemName": "Logam Mulia UBS 1 Gram",
        "coinSpent": 150
      }
    ],
    "page": 1, "pageSize": 20, "total": 37
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// page starts at 1; pageSize default 20, max 100
// orders newest-first (ORDER BY create_date DESC, id DESC)
// status: new | on process | completed | canceled | failed
// NO price / fees / IDR in the list</pre></div><div class="specsec"><h4>5. 注意事项</h4><p>不要每次 list 都调用 Tada — 数据来自通过 webhook 同步的 backend。Tada 没有按 userId 列出订单的 API，因此 HSB 必须自行维护表 point_redemption_order。</p></div></div><div class="specsrc" id="spec-int-order-detail" data-title="GET /loyalty/orders/{orderReference}"><p class="specmeta">内部 · App → HSB · 可选 · tracking · <code>GET {HSB base URL}/loyalty/orders/{orderReference}</code></p><p>App 获取单个 order 的完整详情用于追踪页面（读取 point_redemption_order + point_redemption_transaction 中的 Coin 部分）。</p><div class="specsec"><h4>1. 准备</h4><p class="rvnew">表 <code>point_redemption_order</code>（webhook 同步）+ <code>point_redemption_transaction</code>（Coin 部分）。仅订单所有者可查看。</p></div><div class="specsec"><h4>2. Request</h4><p>App 携带 app token 调用 HSB backend；order_reference 在 path 中：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>orderReference</code></td><td>string</td><td>CI23062210514901613152</td><td>要查看的 order。</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>App 登录 token；后端必须校验该 order 属于 token 的 client_id，否则返回 403。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds rvnew">
  <li>校验 app token → <code>client_id</code>。</li>
  <li><b>SELECT</b> <code>point_redemption_order</code> WHERE <code>order_reference=?</code>。<b>权限校验：</b> <code>order.client_id</code> 必须与 token 的 <code>client_id</code> 一致，否则 → <code>403</code>。</li>
  <li>获取 Coin 部分：<b>SELECT</b> <code>coin_amount, redeem_date, status, void_date</code> FROM <code>point_redemption_transaction</code> WHERE <code>order_reference=?</code>（app 流程不取 <code>idr_amount</code>）。</li>
  <li>组装并返回对象：header（orderNumber、status、orderDate、lastStatusAt）、<code>items[]</code>（按类型拆分：e-voucher code/PIN、serialNumber 中的 PLN token、物流 tracking — <b>去掉价格字段</b>）、recipient、Coin（coinSpent，当 <code>status=2</code> 时为 refunded）。返回前<b>剔除所有 IDR 金额</b>（item 价格、fees、idr_amount）。只读。</li>
  <li>若需要实时 → 调用 <code>Get Order Detail</code> 再 UPSERT <code>point_redemption_order</code> 后返回。</li>
</ol></div><div class="specsec"><h4>4. Response</h4><p>后端返回详情对象（敏感代码仅返回给所有者）— 固定 JSON 契约：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>order</code></td><td>object</td><td>orderNumber, status, orderDate, lastStatusAt, coinSpent, items[], recipient</td><td>追踪页面的详情。不包含任何 IDR 金额（amount / price / fees）。</td></tr></table></div><p class="specmeta">固定 JSON 契约（dev 必须返回此结构）：</p><pre class="rvnew">GET /loyalty/orders/{orderReference}  -&gt;  200
{
  "success": true,
  "result": {
    "orderReference": "CI23062210514901613152",
    "orderNumber": "TADA18102908185099",
    "status": "on process",
    "orderDate": "2023-06-22T10:51:50Z",
    "lastStatusAt": "2023-06-24T08:18:51Z",
    "coinSpent": 150,
    "refunded": false,
    "items": [
      {
        "name": "Pulsa Telkomsel 50rb",
        "type": "pln",
        "quantity": 1,
        "status": "completed",
        "evoucher": { "code": "ABC123", "pin": "9981", "link": "https://...", "expiredDate": "2024-06-22" },
        "token":    { "serialNumber": "1122-3344-5566", "message": "Token PLN" },
        "tracking": { "awbNumber": "JNE123", "shippingCompany": "JNE", "trackingNumber": "JNE123" }
      }
    ],
    "recipient": { "name": "Jo", "address": "Jl ...", "postalCode": "12374" }
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// status: new | on process | completed | canceled | failed
// type:   egift | physical | pln | pulsa | ewallet | ...
// each item has ONLY ONE of evoucher / token / tracking (by type)
// NEVER include item price / fees / idr_amount (IDR)</pre></div><div class="specsec"><h4>5. 注意事项</h4><p class="rvnew"><b>合规 — 不得向前端暴露 IDR 金额</b>（idr_amount、每个 item 的价格、fees）：违反规定。App 仅显示 Coin；所有 IDR 金额必须在后端返回前剔除。<b>敏感数据</b>（voucher code/PIN、<code>serialNumber</code> 中的 PLN token）仅返回给订单所有者；app 默认遮盖，用户点击才显示。<b>Phase 1 仅有当前状态</b>（<code>status</code> + <code>last_status_at</code>），暂无逐步 timeline。每个 item 只有 e-voucher / token / tracking 三个区块中的一个（按 <code>itemType</code> 渲染）。<b>固定响应契约：</b> key 用 camelCase、日期 ISO-8601（UTC）、<code>status</code>/<code>type</code> 按 JSON 示例中的枚举 — dev 返回完全一致的结构，UI 无需返工。</p></div></div><div class="specsrc" id="spec-int-catalog" data-title="GET /loyalty/catalog"><p class="specmeta">内部 · App → HSB · 可选 · <code>GET {HSB base URL}/loyalty/catalog?clientId=…</code></p><p>已登录用户按自己真实的 client_group（取自 crm_customer_base）获取礼品列表。需 app token + clientId。</p><div class="specsec"><h4>1. 准备</h4><p class="rvnew">与 <code>/loyalty/catalog-guest</code> 相同，但 <b>client_group 取自用户</b>（非硬编码）：JOIN <code>promo_client_group → point_program → point_featured_gift</code>，分组取自 <code>clientId</code> 的 <code>crm_customer_base.group_code</code>。需 app token。</p></div><div class="specsec"><h4>2. Request</h4><p>App 携带 app token + clientId 调用：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>clientId</code></td><td>string</td><td>72000123</td><td>客户标识。client_id 来自 token；query clientId 必须与 token 一致，否则 403。</td></tr><tr><td><code>app token</code></td><td>string</td><td>&lt;app JWT&gt;</td><td>app 登录令牌。</td></tr></table></div></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds rvnew">
  <li>校验 app token → <code>client_id</code>。query <code>clientId</code> 必须与 token 的 <code>client_id</code> 一致，否则 → <code>403</code>。</li>
  <li>用<b>下方 SQL</b> 获取 active 礼品 — <code>client_group</code> 由 <code>clientId</code> 从 <code>crm_customer_base</code> 取得。</li>
  <li>将每个礼品映射为 <code>{ id, name, points, image }</code>（points = Coin；<code>id</code> = <code>point_featured_gift.id</code> 内部键，非 TADA deep-link）。<b>去掉 <code>cash_value</code>（IDR）</b>、<code>external_item_id</code>。</li>
  <li>Read-only.</li>
</ol><pre class="rvnew">SELECT  c.id             AS id,
        c.gift_name      AS name,
        c.point_price    AS points,       -- Coin
        c.gift_image_url AS image
FROM        promo_client_group  AS a
INNER JOIN  point_program        AS b  ON  b.id = a.promo_config_id
INNER JOIN  point_featured_gift  AS c  ON  c.program_id = b.id
WHERE   a.promo_table       = 'point_program'    -- hardcode (gift catalog is always under point_program)
    AND a.enabled           = 1
    AND b.enabled           = 1
    AND c.enabled           = 1
    AND c.show_on_dashboard = 1
    AND (c.display_from IS NULL OR NOW() &gt;= c.display_from)
    AND (c.display_to   IS NULL OR NOW() &lt;  c.display_to)
    AND a.client_group = (
            SELECT group_code
            FROM   crm_customer_base
            WHERE  client_id = :clientId       -- clientId resolved from / checked against the token
        )
ORDER BY c.sort_order ASC, c.point_price ASC;
-- do NOT select cash_value (IDR) or external_item_id</pre></div><div class="specsec"><h4>4. Response</h4><p>后端返回给 app（固定 JSON 契约）：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>result</code></td><td>object</td><td>{ rewards[] }</td><td>包裹在 { success, result } 中。仅 Coin；没有 cash_value / IDR。</td></tr></table></div><p class="specmeta">固定 JSON 契约（dev 必须返回此结构）：</p><pre class="rvnew">GET /loyalty/catalog?clientId=72000123  -&gt;  200
{
  "success": true,
  "result": {
    "rewards": [
      {
        "id": 1,
        "name": "Saldo GoPay Rp50.000",
        "points": 500,
        "image": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png"
      }
    ]
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// gifts via the user's client_group (crm_customer_base.group_code) -&gt; promo_client_group -&gt; point_program -&gt; point_featured_gift
// name is in Indonesian (TADA product name; may include a denomination)
// points = point_price (Coin). NEVER return cash_value / IDR
// id = point_featured_gift.id (internal key; NOT a TADA deep-link)
// UI shows up to 9 rewards (10th tile = "Earn more coins", UI-added)</pre></div><div class="specsec"><h4>5. 注意事项</h4><p class="rvnew"><b>与 guest 版不同：</b> <code>client_group</code> 取自用户（<code>crm_customer_base</code>），非硬编码 <code>'direct_client'</code>。<b>合规：</b> 只返回 <code>points</code>（Coin）；不得返回 <code>cash_value</code> 或 IDR。<code>gift_name</code> 可能含面额（产品名称）— HSB 自管此列。列表由 HSB 自行挑选（<code>point_featured_gift</code>）；完整 catalog 在 SSO 后的 webview 中。</p></div></div><div class="specsrc" id="spec-int-catalog-guest" data-title="GET /loyalty/catalog-guest"><p class="specmeta">内部 · App → HSB · 可选 · guest · <code>GET {HSB base URL}/loyalty/catalog-guest</code></p><p>Guest（未登录）按 client_group（默认 'direct_client'）获取精选礼品列表在 home 展示。无需 user token。</p><div class="specsec"><h4>1. 准备</h4><p class="rvnew">按 <b>client_group</b>（默认 <code>'direct_client'</code>，硬编码）通过 JOIN 链 <code>promo_client_group → point_program → point_featured_gift</code> 获取礼品（现有表；HSB 自行挑选，不从 TADA 自动同步）。用<b>静态 app-key + 限流</b> 保护，无需 user token。</p></div><div class="specsec"><h4>2. Request</h4><p>App 以 guest 模式调用（无 user token，无需 programId），header 带 app-key：</p></div><div class="specsec"><h4>3. HSB 处理</h4><ol class="conds rvnew">
  <li>校验 <b>app-key</b> + 限流。无需 user login，没有 <code>client_id</code>。</li>
  <li>用<b>下方 SQL</b> 获取 active 礼品 — 按 <code>client_group='direct_client'</code>（硬编码）过滤，仅 <code>enabled</code> 且在显示窗口内的礼品。</li>
  <li>将每个礼品映射为 <code>{ id, name, points, image }</code>（points = Coin；<code>id</code> = <code>point_featured_gift.id</code> 内部键，非 TADA deep-link）。<b>去掉 <code>cash_value</code>（IDR）</b>、<code>external_item_id</code>。</li>
  <li>只读，不个性化。guest 点击 redeem → 先要求登录，再进入 webview 流程。</li>
</ol><pre class="rvnew">SELECT  c.id             AS id,
        c.gift_name      AS name,
        c.point_price    AS points,       -- Coin
        c.gift_image_url AS image
FROM        promo_client_group  AS a
INNER JOIN  point_program        AS b  ON  b.id = a.promo_config_id
INNER JOIN  point_featured_gift  AS c  ON  c.program_id = b.id
WHERE   a.promo_table       = 'point_program'    -- hardcode (gift catalog is always under point_program)
    AND a.client_group      = 'direct_client'    -- hardcode (guest default group)
    AND a.enabled           = 1
    AND b.enabled           = 1
    AND c.enabled           = 1
    AND c.show_on_dashboard = 1
    AND (c.display_from IS NULL OR NOW() &gt;= c.display_from)
    AND (c.display_to   IS NULL OR NOW() &lt;  c.display_to)
ORDER BY c.sort_order ASC, c.point_price ASC;
-- do NOT select cash_value (IDR) or external_item_id</pre></div><div class="specsec"><h4>4. Response</h4><p>后端返回给 app（固定 JSON 契约）：</p><div class="scroll"><table><tr><th style="width:20%">字段</th><th style="width:14%">类型</th><th style="width:26%">示例</th><th>含义</th></tr><tr><td><code>result</code></td><td>object</td><td>{ rewards[] }</td><td>包裹在 { success, result } 中。仅 Coin；没有 cash_value / IDR。</td></tr></table></div><p class="specmeta">固定 JSON 契约（dev 必须返回此结构）：</p><pre class="rvnew">GET /loyalty/catalog  -&gt;  200
{
  "success": true,
  "result": {
    "rewards": [
      {
        "id": 1,
        "name": "Saldo GoPay Rp50.000",
        "points": 500,
        "image": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png"
      }
    ]
  }
}
// envelope: { success, result } (same as the existing loyalty API)
// gifts via client_group='direct_client' (hardcoded) -&gt; promo_client_group -&gt; point_program -&gt; point_featured_gift
// name is in Indonesian (TADA product name; may include a denomination)
// points = point_price (Coin). NEVER return cash_value / IDR
// id = point_featured_gift.id (internal key; NOT a TADA deep-link)
// UI shows up to 9 rewards (10th tile = "Earn more coins", UI-added)
// guest: no client_id, no redeem; tapping redeem -&gt; require login</pre></div><div class="specsec"><h4>5. 注意事项</h4><p class="rvnew"><b>Guest = 仅查看。</b> 无余额、不能 redeem；redeem 操作必须先登录。<b>合规：</b> 只返回 <code>points</code>（Coin）；不得返回 <code>cash_value</code> 或任何 IDR 金额。<b>礼品名称提示：</b> <code>gift_name</code> 可能含面额（如 "GoPay Rp50.000"）— 这是产品名称；HSB 自管此列，若规定要求隐藏面额可改名。列表由 HSB 自行挑选（不从 TADA 自动同步）— TADA 上礼品或价格变动需手动更新。查看完整 catalog → 登录 TADA webview。</p></div></div></div>
</section><section class="panel" id="data" role="tabpanel">
<h2>4. 数据与配置</h2>
<p>多个 API 共用的表和配置。各 API 在 <a href="#api" class="ref">API</a> 标签页的 Spec 弹窗指向此处。</p>

<h3>4.1 配置</h3>
<table>
  <tr><th style="width:30%">Config</th><th>含义</th><th style="width:30%">备注</th></tr>
  <tr><td><code>TADA_TOKEN_URL / SSO_URL / ORDER_URL</code></td><td>方向 A 接口（token、sso、get order detail）</td><td>UAT 与 PROD 不同</td></tr><tr><td><code>Terminal ID/Password, API Key/Secret</code></td><td>HSB 验证以获取 Tada 令牌</td><td>secret，Tada 在 BRD 后提供</td></tr><tr><td><code>TADA_CARD_NUMBER</code></td><td>用于 SSO 和 get-point 的固定凭据</td><td>不是每位用户的卡号</td></tr><tr><td><code>HSB_SERVICE_TOKEN / HSB_AUTH_USER/PASS</code></td><td>HSB 发给 Tada 的令牌/凭据（方向 B）</td><td>secret</td></tr><tr><td><code>WEBHOOK_KEY</code></td><td>校验 Order Webhook 签名的密钥</td><td>Tada 提供</td></tr><tr><td><code>REDEEM_RATE</code></td><td>Sanity-check convertedAmount</td><td>1 Coin = 100 IDR（已确认）</td></tr><tr><td><code>TADA_ALLOWED_IPS</code></td><td>要加入白名单的 Tada 出站 IP</td><td>PROD + STAGING；值在内部配置</td></tr><tr><td><code>REDEEM_SLA_MS = 3000</code></td><td>响应时间预算</td><td></td></tr><tr class="rvnew"><td><code>RECON_DELAY_MIN</code></td><td>任务 #16 判定 orphan 前的延迟</td><td>10 分钟；任务检测并告警 ops（不自动退回 Coin）</td></tr>
</table>

<h3>4.2 现有积分表 + point_redemption_transaction</h3>
<p><b>Coin 变动与余额使用 2 张现有表</b>（完整 schema 见 Table Document）：<code>point_lot</code> — 每个 lot 的可用余额（<code>point_balance</code>、<code>point_expiration_time</code>）；<code>point_ledger</code> — 变动日志（<code>source_type='redeem'</code>、<code>type</code> 2=CONSUME/3=REFUND、<code>point_amount</code>、<code>lot_id</code>、<code>redemption_id</code>、<code>external_system</code>、<code>external_id</code>、快照 <code>point_balance_before/after</code>）。</p>
<p>新表 <code>point_redemption_transaction</code> 存储 redeem/void 请求（按 <code>order_reference</code> 幂等、状态、void）；<code>point_ledger.redemption_id</code> 指向它的 <code>id</code>：</p>
<p class="note">table document on Google Sheet: <a href="https://docs.google.com/spreadsheets/d/1YUNpxDGjTDgPRBuh1rSKOrCXHJk7o-TRWL5goiEmKhM/edit?gid=0#gid=0" target="_blank" rel="noopener" class="ref">Visit Doc ↗</a></p>
<pre class="rvnew">CREATE TABLE point_redemption_transaction (
  id              BIGINT       PRIMARY KEY AUTO_INCREMENT,
  order_reference VARCHAR(64)  NOT NULL UNIQUE,            -- Tada orderReference = idempotency key; = point_ledger.external_id
  external_system VARCHAR(32)  NOT NULL DEFAULT 'tada',    -- external redemption system
  client_id       VARCHAR(32)  NOT NULL,                   -- = userId (crm_customer_base.client_id)
  trx_id          BIGINT       NULL,                       -- Tada trxId of the redeem (tracing only, not the key)
  coin_amount     BIGINT       NOT NULL,                   -- = convertedAmount (Coin deducted)
  idr_amount      BIGINT       NULL,                       -- = amount (IDR, reference only)
  redeem_date     DATETIME(3)  NULL,                       -- date from the redeem request
  status          TINYINT      NOT NULL,                   -- 1 deducted (active) / 2 refunded; rejected redeems are NOT stored
  fail_reason     VARCHAR(255) NULL,                        -- optional note (manual ops / reconciliation remark)
  void_trx_id     BIGINT       NULL,                       -- Tada trxId of the void (when status=2)
  void_date       DATETIME(3)  NULL,
  reconciled      TINYINT      NOT NULL DEFAULT 0,         -- job #16: 0 unreconciled / 1 pending manual (alerted) / 2 reconciled
  raw_request     JSON         NULL,                        -- redeem request payload; set once at INSERT, NOT overwritten by void
  raw_response    JSON         NULL,                        -- redeem response payload; set once at INSERT, NOT overwritten by void
  create_date     DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
  create_user     VARCHAR(64)  NULL,
  update_date     DATETIME(3)  NULL ON UPDATE CURRENT_TIMESTAMP(3),
  update_user     VARCHAR(64)  NULL
);
-- Coin movements &amp; balance live in point_ledger (redemption_id = id) + point_lot (point_balance). No new balance table.</pre>

<h3>4.3 表 point_redemption_order</h3>
<p>新表存储订单状态和详情（履约侧），以 <code>order_reference</code> 为键。Order Webhook UPSERT 到这里；Get Order Detail 在需要时补充。由 Order Webhook 和订单列表使用。</p>
<p class="note">table document on Google Sheet: <a href="https://docs.google.com/spreadsheets/d/1Tnp25uYI6zkLqNzgtpbOwlO9zLbshR6pXJHjEOWg514/edit?gid=0#gid=0" target="_blank" rel="noopener" class="ref">Visit Doc ↗</a></p>
<pre>CREATE TABLE point_redemption_order (
  id              BIGINT       PRIMARY KEY AUTO_INCREMENT,
  order_reference VARCHAR(64)  NOT NULL UNIQUE,            -- link point_redemption_transaction.order_reference
  order_number    VARCHAR(64)  NULL,                       -- Tada orderNumber
  client_id       VARCHAR(32)  NOT NULL,                   -- from point_redemption_transaction by order_reference
  status          VARCHAR(20)  NULL,                       -- new / on process / completed / canceled / failed
  order_items     JSON         NULL,                       -- items + egiftDetail (voucher code/PIN) + vendorDetail (PLN token) + tracking (awb/courier)
  recipient       JSON         NULL,                       -- recipient + delivery address
  fees            JSON         NULL,
  last_status_at  DATETIME(3)  NULL,
  raw_payload     JSON         NULL,
  create_date     DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
  create_user     VARCHAR(64)  NULL,
  update_date     DATETIME(3)  NULL ON UPDATE CURRENT_TIMESTAMP(3),
  update_user     VARCHAR(64)  NULL
);</pre>

<h3>4.4 拦截黑名单客户（client_promotion_blacklist）</h3>
<p>复用<b>现有</b>表 <code>client_promotion_blacklist</code>（Point Sys - Global）来拦截某客户使用兑换功能，不新建表。该表的唯一键 = <code>client_id + promo_table + promo_config_id + point_task_bundle_id</code>。</p>
<p><b>一条 redeem 拦截行的约定：</b></p>
<table>
  <tr><th style="width:34%">列</th><th>值</th></tr>
  <tr><td><code>client_id</code></td><td>被拦截客户的 client_id</td></tr>
  <tr><td><code>promo_table</code></td><td><code>point_redemption_transaction</code>（用作「兑换功能」标志）</td></tr>
  <tr><td><code>promo_config_id</code></td><td><code>0</code>（redeem 没有 config 行）</td></tr>
  <tr><td><code>point_task_bundle_id</code></td><td><code>0</code>（redeem 不属于任何 bundle）</td></tr>
  <tr><td><code>enabled</code></td><td><code>1</code> = 黑名单（0 = 解除拦截）</td></tr>
</table>
<p>将 <code>promo_config_id</code>/<code>point_task_bundle_id</code> 设为 <code>0</code>（不要用 NULL — MySQL 唯一键中的 NULL 被视为互不相同，会允许重复插入），从而严格保持「一个客户 = 一条 redeem 拦截行」。在 /redeem-point 和 /loyalty/redeem/session 的检查查询：</p>
<pre>SELECT 1 FROM client_promotion_blacklist\n WHERE client_id = ?\n   AND promo_table = 'point_redemption_transaction'\n   AND enabled = 1\n LIMIT 1;</pre>

<h3>4.5 安全（摘要）</h3>
<ul>
  <li>LB/gateway 上为方向 B 接口设置的 <b>IP allowlist</b>（IP 值在内部配置）。</li>
  <li>get-point / redeem / topup 上的 <b>Bearer token</b>（通过 /auth 或 static）。无 HMAC。</li>
  <li><b>Order Webhook 带签名</b>：校验 <code>X-TADA-Signature</code> = <code>SHA512(X-TADA-Delivery + webhookKey)</code>。</li>
  <li><b>无会话绑定</b>（方案 A）。</li>
</ul>
</section><section class="panel" id="open" role="tabpanel">
